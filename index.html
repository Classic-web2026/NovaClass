function weekPanelHTML(){
  const mon = currentMonday(); const activeIdx = dowIdx(selectedDate); const todayIso = todayISO();
  const monthLabel = MONTHS_NOM[mon.getMonth()].toUpperCase()+' '+mon.getFullYear();
  const dayNames = ['ПОНЕДЕЛЬНИК','ВТОРНИК','СРЕДА','ЧЕТВЕРГ','ПЯТНИЦА'];
  const days = [];
  for(let i=0;i<5;i++){
    const d = new Date(mon); d.setDate(mon.getDate()+i);
    const iso = isoOfDate(d); const isActive = i===activeIdx; const isToday = iso===todayIso;
    days.push(`<button class="wp-day ${isActive?'active':''} ${isToday?'today':''}" data-day="${i}"><span class="wp-day-name">${dayNames[i]}</span></button>`);
  }
  const mobileTab = `<div class="wp-mobile"><div class="wp-mobile-tab"><span class="wp-mobile-name">${dayNames[activeIdx]}</span></div></div>`;
  return `<div class="week-wrap"><div class="week-panel"><div class="wp-head">
    <button class="wp-arrow" id="wpPrev" type="button"><span class="msr">chevron_left</span></button>
    <div class="wp-title" id="wpTitle"><span class="msr">calendar_month</span><span>${monthLabel}</span></div>
    <button class="wp-today-btn" id="wpToday" type="button">Сегодня</button>
    <button class="wp-arrow" id="wpNext" type="button"><span class="msr">chevron_right</span></button>
  </div><div class="wp-days">${days.join('')}</div>${mobileTab}</div></div>`;
}
function bindWeekPanel(){
  const prev = $('wpPrev'), next = $('wpNext'), today = $('wpToday'), title = $('wpTitle');
  const isPhone = window.innerWidth <= 820;
  if(prev) prev.onclick = () => { isPhone ? moveDay(-1) : moveWeek(-1); loadPageData(currentPage); };
  if(next) next.onclick = () => { isPhone ? moveDay(1)  : moveWeek(1);  loadPageData(currentPage); };
  if(today) today.onclick = () => { goToday(); loadPageData(currentPage); };
  if(title) title.onclick = e => { moveMonth(e.shiftKey ? -1 : 1); loadPageData(currentPage); };
  document.querySelectorAll('.wp-day').forEach(b => { b.onclick = () => { setDayOfWeek(parseInt(b.dataset.day,10)); loadPageData(currentPage); }; });
}

function calcDiaryAverages(){
  const u = getCurrentUser(); if(!u) return { overall: null, days: {} };
  const email = u.email;
  const all = []; const days = {};
  getLast5SchoolDays().forEach(iso => {
    const lessons = prefetched.scheduleByDate[iso] || [];
    const dayGrades = [];
    lessons.forEach(l => {
      const e = getGrade(iso, l.id, email);
      if(e && e.status === 'ЕСТЬ' && typeof e.grade === 'number'){ all.push(e.grade); dayGrades.push(e.grade); }
    });
    days[iso] = dayGrades.length ? +(dayGrades.reduce((a,b)=>a+b,0)/dayGrades.length).toFixed(1) : null;
  });
  const overall = all.length ? +(all.reduce((a,b)=>a+b,0)/all.length).toFixed(1) : null;
  return { overall, days };
}
function diaryContentHTML(){
  const u = getCurrentUser(); if(!u) return '<div class="empty-state">Войдите</div>';
  const email = u.email;
  const { overall, days } = calcDiaryAverages();
  const total100 = overall !== null ? Math.round(overall * 10) : 0;
  const circ = 2 * Math.PI * 55;
  const ratio = overall !== null ? Math.min(overall / 10, 1) : 0;
  const fillLen = (circ * ratio).toFixed(2);
  const dashArr = `${fillLen} ${circ.toFixed(2)}`;

  const daysArr = getLast5SchoolDays();
  const dayBlocks = daysArr.map((iso, idx) => {
    const lessons = prefetched.scheduleByDate[iso] || [];
    const info = formatRuDate(iso);
    const wd = WEEKDAYS[new Date(iso+'T00:00:00').getDay()];
    const dayAvg = days[iso];
    let lessonsHtml = '';
    if(!lessons.length){
      lessonsHtml = `<div class="diary-lesson" style="opacity:.6"><div class="diary-lesson-info"><div class="diary-lesson-subject">Уроков нет</div></div></div>`;
    } else {
      lessonsHtml = lessons.map(l => {
        const entry = getGrade(iso, l.id, email);
        let g = '—', gCls = 'diary-grade';
        if(entry && entry.status === 'Н'){ g = 'Н'; gCls += ' filled g1'; }
        else if(entry && typeof entry.grade === 'number'){ g = entry.grade; gCls += ' filled ' + gradeColorClass(entry.grade); }
        return `<div class="diary-lesson">
          <div class="diary-lesson-info">
            <div class="diary-lesson-subject">${esc(l.subject||'—')}</div>
            <div class="diary-lesson-meta">
              ${l.teacher?`<span><span class="msr">person</span>${esc(l.teacher)}</span>`:''}
              ${l.room?`<span><span class="msr">meeting_room</span>${esc(l.room)}</span>`:''}
            </div>
          </div>
          <div class="${gCls}">${g}</div>
        </div>`;
      }).join('');
    }
    const totalHtml = dayAvg !== null
      ? `<div class="day-total"><div class="day-total-label">Итог</div><div class="day-total-value">${dayAvg.toFixed(1)}</div><div class="day-total-sub">за день</div></div>`
      : `<div class="day-total"><div class="day-total-label">Итог</div><div class="day-total-value empty">—</div><div class="day-total-sub">нет оценок</div></div>`;
    return `<div class="day-block" style="animation-delay:${idx*80}ms">
      <div class="day-head"><div class="day-date">${esc(info)}<span class="day-weekday">${esc(wd)}</span></div></div>
      <div class="day-grid">
        <div class="lessons-col">${lessonsHtml}</div>
        ${totalHtml}
      </div>
    </div>`;
  }).join('');

  return `
    <div class="diary-banner">
      <div class="diary-circle">
        <svg viewBox="0 0 120 120">
          <circle class="dc-bg" cx="60" cy="60" r="55" stroke-dasharray="${circ.toFixed(2)} ${circ.toFixed(2)}"/>
          <circle class="dc-fill" cx="60" cy="60" r="55" stroke-dasharray="${dashArr}"/>
        </svg>
        <div class="dc-inner">
          <div class="dc-value">${overall !== null ? overall.toFixed(1) : '—'}</div>
          <div class="dc-label">Средняя</div>
        </div>
      </div>
      <div class="diary-title-wrap">
        <div class="diary-title">Дневник</div>
        <div class="diary-sub">${esc(u.name || 'Ученик')}</div>
      </div>
      <div class="diary-score">
        <div class="diary-score-value"><span>${total100}</span><span class="sep">/</span><span class="max">100</span></div>
        <div class="diary-score-label">Общий балл</div>
      </div>
    </div>
    ${dayBlocks}
  `;
}

$('dpInput').addEventListener('input', e => {
  let v = e.target.value.replace(/[^\d]/g, '');
  if(v.length > 8) v = v.slice(0, 8);
  let out = '';
  if(v.length >= 1) out = v.slice(0, 2);
  if(v.length >= 3) out += '/' + v.slice(2, 4);
  if(v.length >= 5) out += '/' + v.slice(4, 8);

  const dates = new Set();
  Object.keys(prefetched.scheduleByDate||{}).forEach(d => {

$('dpSave').onclick = () => {
  const v = $('dpInput').value.trim();
  if(!v){ showToast('Введите дату'); $('dpInput').focus(); return; }
  const iso = parseDateDMY(v);
  if(!iso){ showToast('Неверная дата. Формат: ДД/ММ/ГГГГ'); $('dpInput').classList.add('error'); return; }
  const cfg = getTableCfg();
  if(cfg.columns.indexOf(iso) === -1){
    cfg.columns.push(iso); cfg.columns.sort(); saveTableCfg(cfg);
    closeDatePicker(); refreshCurrentPage();
    showToast('Дата добавлена: ' + formatRuDate(iso));
    const user = getCurrentUser();
    if(user && prefetched.scheduleByDate[iso] === undefined){
      fetchSched(iso, user).then(() => { if(currentPage === 'users') refreshCurrentPage(); }).catch(()=>{});
    }
  } else { closeDatePicker(); showToast('Такая дата уже есть'); }
};
function parseDateDMY(str){
  const s = String(str).trim();
  let m = s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{4})$/);
  if(!m) return '';
  const d = parseInt(m[1],10), mo = parseInt(m[2],10), y = parseInt(m[3],10);
  if(d<1||d>31||mo<1||mo>12||y<2000) return '';
  const dt = new Date(y, mo-1, d);
  if(dt.getDate() !== d || dt.getMonth() !== mo-1) return '';
  return isoOfDate(dt);
}

function openPopover(btn, mode){

  updatePopSelection(); $('popOverlay').classList.add('open');
  requestAnimationFrame(() => { positionPopover(btn); pop.style.visibility = ''; });
}
function positionPopover(btn){
  const pop = $('popover');
  const br = btn.getBoundingClientRect();
  const pr = pop.getBoundingClientRect();
  const vw = window.innerWidth, vh = window.innerHeight, pad = 12, gap = 12;
  let top = br.top + window.scrollY;
  let left = br.right + gap + window.scrollX;
  let arrow = 'top-left';
  if(left + pr.width > vw + window.scrollX - pad){ left = br.left - pr.width - gap + window.scrollX; arrow = 'top-right'; }
  if(top + pr.height > vh + window.scrollY - pad){ top = br.bottom - pr.height + window.scrollY; arrow = arrow.replace('top','bottom'); }
  if(top < window.scrollY + pad){ top = window.scrollY + pad; arrow = arrow.replace('bottom','top'); }
  if(left < window.scrollX + pad) left = window.scrollX + pad;
  pop.style.top = top + 'px'; pop.style.left = left + 'px';
  pop.setAttribute('data-arrow', arrow);
}
function closePopover(){ $('popover').classList.remove('open'); $('popOverlay').classList.remove('open'); popTarget = null; }

  if(mb && mb.dataset.page){ renderPage(mb.dataset.page); return; }
  const mbb = e.target.closest('.mb-item');
  if(mbb && mbb.dataset.page){ renderPage(mbb.dataset.page); return; }
});
$$('[data-logout]').forEach(b => b.onclick = () => {
  showLoader();
  prefetched.scheduleByDate = {};
  prefetched.hwStatuses = null;
  prefetched.users = null;
  clearSession();
  setTimeout(()=>location.reload(), 2200);
});

/* =========================================================
   INIT
   ========================================================= */
(async function init(){
  requestAnimationFrame(fitFormHeight);
  initAllSelects();
  buildGradesGrid();
  Theme.init();
  I18N.init();
  UserMenu.init();
  Account.init();
  Account.applyAvatar();

  const s = getSession();
  if(s && s.user){
    showLoader();
    await new Promise(r => setTimeout(r, 2200));
    hideLoader();
    $('authView').classList.add('hidden');
    $('appView').classList.remove('hidden');
    applyUserToUI(); addCreatorMenu();
    renderPage('home');
    requestAnimationFrame(() => { $('appView').classList.add('ready'); moveIndicator(); });
    prefetchAll(s.user).then(() => {
      if(['schedule','homework','diary','users'].includes(currentPage)) refreshCurrentPage();
    }).catch(()=>{});
  } else {
    showLoader();
    await new Promise(r => setTimeout(r, 2200));
    hideLoader();
    $('authView').classList.remove('hidden');
  }
})();
</script>
</body>
</html>
