<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>NovaClass</title>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<script>
(function(){
  try{
    document.documentElement.setAttribute('data-theme', localStorage.getItem('nc_theme')||'light');
    document.documentElement.lang = localStorage.getItem('nc_lang')||'ru';
  }catch(e){}
})();
</script>
<style>
/* =========================================================
   DESIGN TOKENS — Company Classic
   ========================================================= */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
:root{
  /* Backgrounds */
  --bg:#FFFFFF;           /* page background — pure white */
  --section:#F1F5F9;      /* subtle secondary / hover */
  --card:#F8FAFC;         /* cards / sections — light gray-blue */
  --bg-rgb:255,255,255;

  /* Text */
  --text:#1E293B;
  --muted:#64748B;
  --brand:#0F172A;

  /* Interactive */
  --accent:#2563EB;
  --accent-h:#1D4ED8;
  --accent-light:#DBEAFE;

  /* Border */
  --border:#E2E8F0;

  /* Radii */
  --rc:20px;   /* cards, containers */
  --ri:14px;   /* buttons, inputs */
  --rt:12px;   /* tabs, small buttons */
  --rb:10px;   /* badges, micro */
  --rp:32px;   /* pill / capsule */

  /* Shadows */
  --shadow:0 4px 6px -1px rgba(0,0,0,.05);
  --shadow-hover:0 8px 20px -6px rgba(37,99,235,.25);
  --shadow-toggle:0 4px 12px rgba(37,99,235,.30);
  --shadow-lg:0 20px 40px -16px rgba(15,23,42,.2);

  /* Motion */
  --ease-spring:cubic-bezier(.34,1.4,.64,1);
  --ease-loop:cubic-bezier(.4,.1,.2,1);
  --ease-out:cubic-bezier(.4,0,.2,1);
  --ease-smooth:cubic-bezier(.4,0,.2,1);

  /* Layout */
  --gap:20px;
  --sb-mini:88px;
  --sb-full:300px;
}

html[data-theme="dark"]{
  --bg:#0B1220;
  --section:#1E293B;
  --card:#0F172A;
  --bg-rgb:11,18,32;
  --text:#E2E8F0;
  --muted:#94A3B8;
  --brand:#F1F5F9;
  --accent:#3B82F6;
  --accent-h:#2563EB;
  --accent-light:rgba(59,130,246,.15);
  --border:#1E293B;
}

body{
  font-family:'Comfortaa',sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:16px;
  line-height:1.5;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  transition:background-color .3s ease,color .3s ease;
}
.hidden{display:none!important}
.msr{
  font-family:'Material Symbols Rounded';
  font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;
  font-size:26px;display:inline-flex;align-items:center;justify-content:center;
  color:currentColor;line-height:1;user-select:none;flex-shrink:0;
}

/* =========================================================
   ROLE BADGES
   ========================================================= */
.role-badge{display:inline-block;padding:3px 10px;border-radius:var(--rb);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;line-height:1.4}
.role-badge.student  {background:rgba(37,99,235,.12);color:#2563EB}
.role-badge.moderator{background:rgba(234,88,12,.15);color:#EA580C}
.role-badge.teacher  {background:rgba(22,163,74,.15);color:#16A34A}
.role-badge.director {background:rgba(168,85,247,.15);color:#A855F7}
.role-badge.admin    {background:rgba(220,38,38,.15);color:#DC2626}
.role-badge.creator  {background:linear-gradient(135deg,#3B82F6,#2563EB);color:#fff}
.sor-badge{display:inline-block;padding:3px 9px;margin-left:8px;border-radius:var(--rb);font-size:10px;font-weight:700;background:rgba(31,158,168,.15);color:#1F9EA8;letter-spacing:.4px}
.soch-badge{display:inline-block;padding:3px 9px;margin-left:8px;border-radius:var(--rb);font-size:10px;font-weight:700;background:rgba(30,136,229,.15);color:#1E88E5;letter-spacing:.4px}

/* =========================================================
   TOP PROGRESS BAR (4px, gradient, shortened at edges)
   ========================================================= */
#topProgress{
  position:fixed;top:6px;left:24px;right:24px;height:4px;
  z-index:10000;pointer-events:none;opacity:0;
  transition:opacity .25s ease;
}
#topProgress.active{opacity:1}
#topProgressFill{
  height:100%;width:0;
  background:linear-gradient(90deg,var(--accent),var(--brand));
  border-radius:10px;
  transition:width .35s var(--ease-out);
}

/* =========================================================
   LOADER — spinner + main progress bar
   ========================================================= */
#loader{
  position:fixed;inset:0;z-index:9999;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:34px;
  transition:opacity .55s var(--ease-smooth);
}
#loader.fade-out{opacity:0;pointer-events:none}

.loader-stage{position:relative;width:130px;height:130px}
.loader-spinner{width:100%;height:100%;display:block;animation:spinCW 1.1s linear infinite}
.spinner-track{fill:none;stroke:#E2E8F0;stroke-width:8}
.spinner-arc{
  fill:none;stroke:url(#spinGrad);stroke-width:8;stroke-linecap:round;
  stroke-dasharray:185 252;
}
@keyframes spinCW{to{transform:rotate(360deg)}}
html[data-theme="dark"] .spinner-track{stroke:#1E293B}

.loader-bar{width:min(420px,80vw)}
.loader-bar-track{
  height:8px;padding:1px;
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:var(--rc);
  overflow:hidden;
}
.loader-bar-fill{
  height:100%;width:0;
  background:linear-gradient(90deg,#2563EB,#1D4ED8);
  border-radius:var(--rc);
  transition:width .35s var(--ease-out);
}

.loader-label{
  font-size:18px;font-weight:700;color:var(--accent);
  letter-spacing:.4px;
  opacity:0;transform:translateY(8px);
  transition:opacity .45s var(--ease-out),transform .45s var(--ease-out);
}
.loader-label.show{opacity:1;transform:translateY(0)}

@media (max-width:520px){
  .loader-stage{width:100px;height:100px}
  .loader-bar{width:80vw}
  .loader-label{font-size:15px}
}

/* =========================================================
   AUTH
   ========================================================= */
#authView{
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:20px;background:var(--bg);
}
.card{
  width:100%;max-width:400px;background:var(--card);
  border:1px solid var(--border);border-radius:var(--rc);
  padding:28px;box-shadow:var(--shadow);
  animation:zoom .45s var(--ease-spring) both;
}
@keyframes zoom{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.logo{text-align:center;margin-bottom:20px}
.logo-mark{
  display:inline-flex;align-items:center;justify-content:center;
  width:84px;height:84px;border-radius:22px;overflow:hidden;margin-bottom:14px;
  box-shadow:var(--shadow-hover);
  animation:logoFloat 3s ease-in-out infinite;
}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.logo-mark svg{width:100%;height:100%;display:block}
.logo h1{font-size:19px;font-weight:700;color:var(--brand)}

.tabs{
  position:relative;display:flex;background:var(--bg);
  border:1px solid var(--border);border-radius:var(--rt);
  padding:5px;margin-bottom:20px;overflow:hidden;
}
.tabs .slider{
  position:absolute;top:5px;left:5px;width:calc(50% - 5px);height:calc(100% - 10px);
  background:var(--accent);border-radius:var(--rb);
  transition:transform .45s var(--ease-spring);z-index:0;
}
.tabs[data-active="reg"] .slider{transform:translateX(100%)}
.tab{
  position:relative;z-index:1;flex:1;padding:11px 8px;
  border:none;background:transparent;color:var(--muted);
  font-family:inherit;font-size:13.5px;font-weight:500;cursor:pointer;
  border-radius:var(--rb);transition:color .3s ease;
}
.tab.active{color:#fff;font-weight:700}

.forms-wrap{position:relative;overflow:hidden;height:0;transition:height .4s var(--ease-out)}
.slider-track{display:flex;width:200%;transition:transform .45s var(--ease-out);align-items:flex-start}
.slider-track[data-active="reg"]{transform:translateX(-50%)}
.slide-pane{width:50%;flex-shrink:0;padding:0 2px}

.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:7px;padding-left:2px}

input,textarea,select{
  width:100%;padding:13px 16px;
  border:1px solid var(--border);border-radius:var(--ri);
  background:var(--bg);color:var(--text);
  font-family:inherit;font-size:14px;outline:none;
  transition:border-color .2s ease,box-shadow .25s ease;
}
input::placeholder,textarea::placeholder{color:#94A3B8}
input:focus,textarea:focus,select:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 4px rgba(37,99,235,.12);
}
input.error{border-color:#DC2626;box-shadow:0 0 0 4px rgba(220,38,38,.14);animation:shake .5s}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}

.pass-wrap{position:relative}
.pass-wrap input{padding-right:48px}
.pass-toggle{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:36px;height:36px;border:none;background:transparent;color:var(--muted);
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
  border-radius:var(--rb);
}

.btn{
  width:100%;padding:13px;border:none;border-radius:var(--ri);
  background:var(--accent);color:#fff;font-family:inherit;font-size:14px;font-weight:700;
  cursor:pointer;margin-top:8px;
  transition:background .2s ease,transform .15s var(--ease-spring);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.btn:hover{background:var(--accent-h)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.75;cursor:wait}
.btn-ghost{background:var(--bg);color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--section)}

.err{
  background:#FEF2F2;color:#991B1B;border:1px solid #FECACA;
  border-radius:var(--ri);padding:11px 14px;font-size:13px;margin-bottom:14px;
}

/* =========================================================
   APP SHELL
   ========================================================= */
#appView{position:fixed;inset:0;z-index:10;background:var(--bg);opacity:0;transition:opacity .45s ease}
#appView.ready{opacity:1}
.app-layout{display:flex;gap:var(--gap);padding:var(--gap);height:100%;overflow:hidden}

.sidebar{
  flex-shrink:0;width:var(--sb-mini);
  background:var(--card);border:1px solid var(--border);border-radius:var(--rc);
  box-shadow:var(--shadow);padding:20px 14px;
  display:flex;flex-direction:column;overflow:hidden;
  transition:width .45s var(--ease-out);z-index:30;
}
.sidebar:hover,.sidebar.open{width:var(--sb-full);box-shadow:var(--shadow-lg)}

.sb-head{
  display:flex;align-items:center;gap:14px;padding:4px 4px 18px;
  border-bottom:1px solid var(--border);margin-bottom:14px;
  min-height:68px;overflow:hidden;white-space:nowrap;
}
.sb-logo{
  width:56px;height:56px;border-radius:18px;overflow:hidden;flex-shrink:0;
  box-shadow:0 10px 24px -10px rgba(37,99,235,.65);
}
.sb-logo svg{width:100%;height:100%;display:block}
.sb-name{font-size:17px;font-weight:700;color:var(--brand);opacity:0;transform:translateX(-10px);transition:opacity .3s ease .05s,transform .4s var(--ease-out) .05s}
.sidebar:hover .sb-name,.sidebar.open .sb-name{opacity:1;transform:translateX(0)}

.menu{position:relative;display:flex;flex-direction:column;gap:8px}
.menu-indicator{
  position:absolute;top:0;left:0;right:0;height:0;
  background:linear-gradient(135deg,#3B82F6 0%,#2563EB 100%);
  border-radius:16px;
  box-shadow:0 10px 22px -10px rgba(37,99,235,.75);
  transition:transform .5s var(--ease-spring),height .4s var(--ease-spring),opacity .25s ease;
  pointer-events:none;z-index:0;opacity:0;
}
.menu-indicator.ready{opacity:1}
.menu-item{
  position:relative;z-index:1;display:flex;align-items:center;gap:18px;
  padding:14px 16px;border-radius:16px;border:none;background:transparent;
  color:var(--text);font-family:inherit;font-size:14.5px;font-weight:500;
  cursor:pointer;text-align:left;transition:color .3s ease,background .2s ease;
  white-space:nowrap;min-height:56px;overflow:hidden;
}
.menu-item:hover{background:var(--section);transform:translateX(2px)}
.menu-item.active{color:#fff;font-weight:700}
.menu-item.active .msr{color:#fff}
.menu-item .menu-label{opacity:0;transform:translateX(-10px);transition:opacity .3s ease .05s,transform .4s var(--ease-out) .05s}
.sidebar:hover .menu-item .menu-label,.sidebar.open .menu-item .menu-label{opacity:1;transform:translateX(0)}

.sb-foot{
  margin-top:auto;padding:16px 4px 4px;border-top:1px solid var(--border);
  display:flex;align-items:center;gap:12px;min-height:72px;overflow:hidden;white-space:nowrap;
}
.sb-user{display:flex;align-items:center;gap:14px;flex:1;min-width:0}
.sb-ava{
  width:48px;height:48px;border-radius:50%;
  background:linear-gradient(135deg,#3B82F6,#2563EB);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;
  font-weight:700;font-size:16px;flex-shrink:0;
  background-size:cover;background-position:center;
}
.sb-info{min-width:0;flex:1;opacity:0;transform:translateX(-10px);transition:opacity .3s ease .05s,transform .4s var(--ease-out) .05s}
.sidebar:hover .sb-info,.sidebar.open .sb-info{opacity:1;transform:translateX(0)}
.sb-name-u{font-size:13.5px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:4px}
.sb-logout{
  width:42px;height:42px;border-radius:var(--ri);
  border:1px solid var(--border);background:var(--bg);
  display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--muted);flex-shrink:0;
  opacity:0;transform:translateX(-10px);
  transition:opacity .3s ease .05s,transform .4s var(--ease-out) .05s,background .2s ease,color .2s ease;
}
.sidebar:hover .sb-logout,.sidebar.open .sb-logout{opacity:1;transform:translateX(0)}
.sb-logout:hover{background:#FEF2F2;color:#DC2626}

.content-wrap{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--gap);overflow:hidden}

.topbar{
  background:var(--card);border:1px solid var(--border);border-radius:var(--rc);
  padding:14px 24px;display:flex;align-items:center;gap:12px;
  box-shadow:var(--shadow);flex-shrink:0;min-height:74px;
}
.topbar-title{font-size:17px;font-weight:700;color:var(--brand);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar-right{display:flex;align-items:center;gap:10px;flex-shrink:0;margin-left:auto}
.topbar-add{
  display:inline-flex;align-items:center;gap:8px;padding:11px 20px;
  border-radius:var(--ri);border:none;background:var(--accent);color:#fff;
  font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;
  box-shadow:0 8px 18px -8px rgba(37,99,235,.6);
  transition:background .2s ease,transform .15s var(--ease-spring);
}
.topbar-add:hover{background:var(--accent-h)}
.topbar-add:active{transform:scale(.97)}
.topbar-add .msr{font-size:22px;color:#fff}

.burger{
  display:none;width:44px;height:44px;border-radius:var(--ri);
  border:1px solid var(--border);background:var(--bg);cursor:pointer;
  flex-direction:column;justify-content:center;align-items:center;gap:5px;padding:0;
}
.burger span{display:block;width:20px;height:2px;background:var(--text);border-radius:2px;transition:transform .4s var(--ease-spring),opacity .3s ease,width .3s ease}
.burger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.burger.open span:nth-child(2){opacity:0;transform:scaleX(0)}
.burger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

.topbar-chip{
  display:flex;align-items:center;gap:10px;padding:5px 16px 5px 5px;
  background:var(--bg);border:1px solid var(--border);border-radius:var(--rp);
  font-size:12.5px;font-weight:600;color:var(--text);cursor:pointer;font-family:inherit;
}
.topbar-chip .user-ava{
  width:34px;height:34px;border-radius:50%;
  background:linear-gradient(135deg,#3B82F6,#2563EB);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;
  background-size:cover;background-position:center;
}
.chip-arrow{font-size:18px!important;color:var(--muted);margin-left:-4px;transition:transform .35s var(--ease-spring)}

.user-menu-wrap{position:relative}
.user-dropdown{
  position:absolute;top:calc(100% + 10px);right:0;width:300px;
  background:var(--card);border:1px solid var(--border);border-radius:18px;
  box-shadow:0 24px 60px -16px rgba(15,23,42,.28);z-index:200;padding:14px;
  opacity:0;transform:translateY(-8px) scale(.94);pointer-events:none;
  transition:opacity .28s var(--ease-out),transform .35s var(--ease-spring);
  transform-origin:top right;
}
.user-dropdown.open{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.ud-head{display:flex;align-items:center;gap:12px;padding:8px 8px 14px;border-bottom:1px solid var(--border);margin-bottom:12px}
.ud-ava{
  width:46px;height:46px;border-radius:50%;
  background:linear-gradient(135deg,#3B82F6,#2563EB);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;
  background-size:cover;background-position:center;
}
.ud-info{min-width:0;flex:1}
.ud-name{font-size:14px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:4px}
.ud-tabs{position:relative;display:flex;background:var(--bg);border:1px solid var(--border);border-radius:var(--rt);padding:4px;margin-bottom:10px;overflow:hidden}
.ud-tabs .ud-slider{position:absolute;top:4px;left:4px;width:calc(50% - 4px);height:calc(100% - 8px);background:var(--accent);border-radius:9px;transition:transform .4s var(--ease-spring);z-index:0}
.ud-tabs[data-active="settings"] .ud-slider{transform:translateX(100%)}
.ud-tab{position:relative;z-index:1;flex:1;padding:8px 6px;border:none;background:transparent;color:var(--muted);font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;border-radius:9px}
.ud-tab.active{color:#fff}
.ud-pane{display:none;flex-direction:column;gap:4px}
.ud-pane.active{display:flex;animation:udIn .35s var(--ease-out) both}
@keyframes udIn{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:translateX(0)}}
.ud-action{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:none;background:transparent;border-radius:var(--rb);color:var(--text);font-family:inherit;font-size:13.5px;font-weight:500;cursor:pointer;text-align:left;transition:background .2s ease,transform .2s ease}
.ud-action:hover{background:var(--section);transform:translateX(3px)}
.ud-action.danger{color:#DC2626}
.ud-action .msr{font-size:20px;opacity:.85}
.ud-divider{height:1px;background:var(--border);margin:8px 4px}
.ud-danger-label{font-size:10.5px;font-weight:700;color:#DC2626;text-transform:uppercase;letter-spacing:.6px;padding:6px 12px 4px;opacity:.75}

.mobile-sidebar-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(4px);z-index:70;opacity:0;pointer-events:none;transition:opacity .35s ease}
.mobile-sidebar-backdrop.open{opacity:1;pointer-events:auto}

.pages-viewport{flex:1;min-height:0;position:relative;overflow:hidden;border-radius:var(--rc)}
.pages-viewport::before,.pages-viewport::after{content:'';position:absolute;left:0;right:0;height:28px;pointer-events:none;z-index:5}
.pages-viewport::before{top:0;background:linear-gradient(to bottom,var(--bg) 0%,var(--bg) 30%,rgba(var(--bg-rgb),0) 100%)}
.pages-viewport::after{bottom:0;background:linear-gradient(to top,var(--bg) 0%,var(--bg) 30%,rgba(var(--bg-rgb),0) 100%)}

.page-pane{
  position:absolute;inset:0;
  background:var(--card);border:1px solid var(--border);border-radius:var(--rc);
  box-shadow:var(--shadow);padding:clamp(20px,2.5vw,32px);overflow:auto;
  animation:paneIn .4s var(--ease-out) both;
}
.page-pane.slide-in-right{animation:paneInRight .4s var(--ease-out) both}
.page-pane.slide-in-left{animation:paneInLeft .4s var(--ease-out) both}
.page-pane.slide-out-left{animation:paneOutLeft .35s var(--ease-out) both}
.page-pane.slide-out-right{animation:paneOutRight .35s var(--ease-out) both}
@keyframes paneIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes paneInRight{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes paneInLeft{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:translateX(0)}}
@keyframes paneOutLeft{to{opacity:0;transform:translateX(-40px)}}
@keyframes paneOutRight{to{opacity:0;transform:translateX(40px)}}

/* =========================================================
   BANNER
   ========================================================= */
.banner{
  width:100%;border-radius:16px;
  background:linear-gradient(135deg,#3B82F6 0%,#2563EB 100%);
  color:#fff;padding:22px 28px;display:flex;align-items:center;gap:12px;
  box-shadow:0 10px 22px -10px rgba(37,99,235,.6);margin-bottom:22px;min-height:76px;
}
.banner .msr{font-size:26px;color:#fff}
.banner-title{font-size:clamp(15px,1.5vw,17px);font-weight:700}

/* =========================================================
   WEEK PANEL
   ========================================================= */
.week-wrap{display:flex;flex-direction:column;margin-bottom:18px;overflow:hidden;border-radius:16px}
.week-panel{
  width:100%;border-radius:16px;
  background:linear-gradient(135deg,#3B82F6 0%,#2563EB 100%);
  box-shadow:0 10px 22px -10px rgba(37,99,235,.6);
  display:flex;flex-direction:column;overflow:hidden;
}
.wp-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 8px}
.wp-title{color:#fff;font-size:14px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;flex:1;text-align:center;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.wp-title .msr{font-size:18px;opacity:.85;color:#fff}
.wp-today-btn{color:#fff;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:var(--rb);padding:5px 12px;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;text-transform:uppercase}
.wp-arrow{flex-shrink:0;width:40px;height:40px;border-radius:var(--rt);border:none;background:rgba(255,255,255,.1);color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .2s ease}
.wp-arrow:hover{background:rgba(255,255,255,.2)}
.wp-arrow .msr{font-size:22px;color:#fff}
.wp-days{display:grid;grid-template-columns:repeat(5,1fr);padding:4px 12px 0 12px;gap:4px}
.wp-day{min-height:60px;border:none;background:transparent;color:#fff;font-family:inherit;cursor:pointer;border-radius:14px 14px 0 0;padding:10px 4px;display:flex;align-items:center;justify-content:center;text-align:center;align-self:flex-end;transition:background .2s ease}
.wp-day:hover{background:rgba(255,255,255,.14)}
.wp-day.active{background:var(--bg);color:var(--accent)}
.wp-day-name{font-size:11.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.wp-mobile{display:none;padding:4px 12px 0 12px}
.wp-mobile .wp-mobile-tab{width:100%;min-height:60px;background:var(--bg);color:var(--accent);border-radius:14px 14px 0 0;font-family:inherit;display:flex;align-items:center;justify-content:center;padding:10px}
@media (max-width:820px){.wp-days{display:none}.wp-mobile{display:block}}

/* =========================================================
   LESSON ROWS
   ========================================================= */
.lessons-list{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.lesson-row{
  display:flex;align-items:center;gap:16px;
  background:var(--bg);border:1.5px solid var(--border);border-radius:16px;
  padding:18px 20px;
  transition:border-color .25s ease,box-shadow .25s ease,transform .3s var(--ease-spring);
  animation:rowIn .5s var(--ease-out) both;
  animation-delay:calc(var(--i,0)*60ms);
}
@keyframes rowIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.lesson-row:hover{border-color:rgba(37,99,235,.35);transform:translateY(-3px);box-shadow:var(--shadow-hover)}
.lesson-row.cancelled{border-color:#FECACA;background:#FEF2F2;opacity:.92}
.lesson-num{flex-shrink:0;width:60px;height:60px;border-radius:16px;background:var(--accent-light);border:2px solid var(--accent);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:22px}
.lesson-info{flex:1;min-width:0}
.lesson-subject{font-size:15.5px;font-weight:700;color:var(--brand);margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lesson-meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12.5px;color:var(--muted)}
.lesson-meta .meta-item{display:inline-flex;align-items:center;gap:5px}
.lesson-meta .meta-item .msr{font-size:16px;color:var(--muted)}
.lesson-action{flex-shrink:0;display:flex;gap:8px;align-items:center}

.lesson-grade-chip{flex-shrink:0;width:44px;height:44px;border-radius:var(--rt);border:1.5px solid var(--border);background:var(--bg);color:var(--muted);font-family:inherit;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .2s var(--ease-spring)}
.lesson-grade-chip:hover{transform:scale(1.1)}
.lesson-grade-chip.filled{border-color:transparent;color:#fff}
.lesson-grade-chip.g1,.lesson-grade-chip.g2,.lesson-grade-chip.g3,.lesson-grade-chip.g4{background:#DC2626}
.lesson-grade-chip.g5,.lesson-grade-chip.g6{background:#EA580C}
.lesson-grade-chip.g7,.lesson-grade-chip.g8{background:#EAB308}
.lesson-grade-chip.g9,.lesson-grade-chip.g10{background:#16A34A}

.btn-icon{width:40px;height:40px;border-radius:var(--rt);border:1px solid var(--border);background:var(--bg);color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:transform .25s var(--ease-spring),background .2s ease,color .2s ease}
.btn-icon:hover{background:var(--section);color:var(--accent);transform:scale(1.1)}
.btn-icon.danger:hover{background:#FEF2F2;color:#DC2626}
.btn-icon.success{color:#16A34A;border-color:#86EFAC}
.btn-icon.success:hover{background:#F0FDF4}
.btn-icon .msr{font-size:20px}

.empty-state{padding:60px 24px;text-align:center;color:var(--muted);background:var(--bg);border:1px solid var(--border);border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:14px}
.empty-state .msr{font-size:54px;color:#CBD5E1}
.empty-state h3{font-size:15px;font-weight:700;color:var(--brand)}
.empty-add-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:var(--ri);border:none;background:var(--accent);color:#fff;font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;transition:background .2s ease,transform .15s var(--ease-spring)}
.empty-add-btn:hover{background:var(--accent-h)}
.empty-add-btn:active{transform:scale(.97)}
.empty-add-btn .msr{font-size:22px;color:#fff}

/* =========================================================
   DIARY
   ========================================================= */
.diary-banner{
  background:linear-gradient(135deg,#3B82F6 0%,#2563EB 100%);
  border-radius:var(--rc);padding:24px 28px;display:flex;align-items:center;gap:24px;
  color:#fff;box-shadow:0 20px 40px -16px rgba(37,99,235,.55);
  margin-bottom:18px;position:relative;overflow:hidden;
}
.diary-banner::after{content:'';position:absolute;top:-50%;right:-15%;width:380px;height:380px;background:radial-gradient(circle,rgba(255,255,255,.15) 0%,transparent 70%);pointer-events:none}
.diary-circle{position:relative;width:120px;height:120px;flex-shrink:0;z-index:1}
.diary-circle svg{width:100%;height:100%;transform:rotate(-90deg)}
.diary-circle circle{fill:none;stroke-width:10;stroke-linecap:round}
.dc-bg{stroke:rgba(255,255,255,.18)}
.dc-fill{stroke:#fff;transition:stroke-dasharray .8s var(--ease-out)}
.dc-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.dc-value{font-size:28px;font-weight:700;letter-spacing:-1px}
.dc-label{font-size:9px;opacity:.75;text-transform:uppercase;letter-spacing:1px;font-weight:600}
.diary-title-wrap{display:flex;flex-direction:column;gap:4px;position:relative;z-index:1}
.diary-title{font-size:24px;font-weight:700}
.diary-sub{font-size:12.5px;opacity:.85;font-weight:500}
.diary-score{margin-left:auto;text-align:right;position:relative;z-index:1}
.diary-score-value{font-size:48px;font-weight:700;line-height:1;letter-spacing:-2px}
.diary-score-value .sep{opacity:.5;margin:0 4px}
.diary-score-value .max{font-size:26px;opacity:.7}
.diary-score-label{font-size:10px;opacity:.75;text-transform:uppercase;letter-spacing:1.5px;font-weight:600;margin-top:4px}

.day-block{background:var(--bg);border:1px solid var(--border);border-radius:var(--rc);padding:22px 24px;box-shadow:var(--shadow);margin-bottom:14px;animation:dayIn .5s var(--ease-out) both}
@keyframes dayIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.day-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.day-date{font-size:13.5px;font-weight:700;color:var(--muted);text-transform:uppercase}
.day-weekday{font-size:11px;color:var(--muted);opacity:.7;margin-left:8px;text-transform:none}
.day-grid{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start}
.lessons-col{display:flex;flex-direction:column;gap:8px}
.diary-lesson{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--section);border:1px solid var(--border);border-radius:var(--ri);padding:12px 16px}
.diary-lesson-info{flex:1;min-width:0}
.diary-lesson-subject{font-size:13.5px;font-weight:700;color:var(--text);margin-bottom:2px}
.diary-lesson-meta{font-size:11px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.diary-lesson-meta span{display:inline-flex;align-items:center;gap:3px}
.diary-lesson-meta .msr{font-size:13px}
.diary-grade{flex-shrink:0;width:44px;height:44px;border-radius:var(--rt);background:var(--bg);border:1.5px solid var(--border);color:var(--muted);font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center}
.diary-grade.filled{border-color:transparent;color:#fff}
.diary-grade.g1,.diary-grade.g2,.diary-grade.g3,.diary-grade.g4{background:#DC2626}
.diary-grade.g5,.diary-grade.g6{background:#EA580C}
.diary-grade.g7,.diary-grade.g8{background:#EAB308}
.diary-grade.g9,.diary-grade.g10{background:#16A34A}
.day-total{flex-shrink:0;min-width:100px;padding:14px 16px;border-radius:16px;background:linear-gradient(135deg,#3B82F6 0%,#2563EB 100%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.day-total-label{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;opacity:.8;font-weight:700}
.day-total-value{font-size:28px;font-weight:700;line-height:1;letter-spacing:-1px}
.day-total-value.empty{opacity:.4;font-size:20px}
.day-total-sub{font-size:9.5px;opacity:.7}

/* =========================================================
   DATE GRID
   ========================================================= */
.date-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:22px}
.date-card{
  position:relative;background:linear-gradient(135deg,#3B82F6 0%,#2563EB 100%);color:#fff;
  border:none;border-radius:18px;padding:22px 20px;cursor:pointer;font-family:inherit;
  text-align:left;box-shadow:0 12px 28px -12px rgba(37,99,235,.55);
  transition:transform .25s var(--ease-spring),box-shadow .25s ease;overflow:hidden;user-select:none;
  animation:dateIn .5s var(--ease-out) both;
}
@keyframes dateIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.date-card::after{content:'';position:absolute;top:-40%;right:-20%;width:200px;height:200px;background:radial-gradient(circle,rgba(255,255,255,.18) 0%,transparent 70%);pointer-events:none}
.date-card:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 20px 36px -12px rgba(37,99,235,.75)}
.date-card:active{transform:scale(.98)}
.date-card-day{font-size:32px;font-weight:700;line-height:1;letter-spacing:-1px;margin-bottom:8px}
.date-card-month{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;opacity:.9;margin-bottom:4px}
.date-card-year{font-size:11px;opacity:.7;font-weight:500}
.date-card-weekday{position:absolute;top:16px;right:18px;font-size:10px;font-weight:700;background:rgba(255,255,255,.2);padding:3px 9px;border-radius:var(--rb);text-transform:uppercase;letter-spacing:.5px}
.date-card-counter{position:absolute;bottom:14px;right:18px;font-size:10.5px;opacity:.85;font-weight:600;display:flex;align-items:center;gap:4px}
.date-card-counter .msr{font-size:14px}

/* =========================================================
   TABLE
   ========================================================= */
.table-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.back-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:var(--rt);border:1px solid var(--border);background:var(--bg);color:var(--text);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:background .2s ease,transform .2s var(--ease-spring)}
.back-btn:hover{background:var(--section);transform:translateX(-3px)}
.back-btn .msr{font-size:20px}
.table-title{font-size:16px;font-weight:700;color:var(--brand);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.table-hint{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--section);border-radius:var(--rb);border:1px dashed var(--border);margin-bottom:14px}
.table-hint .msr{font-size:16px;color:var(--muted)}
.grades-table-wrap{background:var(--bg);border:1px solid var(--border);border-radius:18px;padding:18px;overflow:auto;box-shadow:var(--shadow);max-height:calc(100vh - 320px)}
.grades-table{border-collapse:separate;border-spacing:6px;min-width:100%}
.grades-table th{font-size:10.5px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:.4px;padding:10px 14px;text-align:center;white-space:nowrap;background:linear-gradient(135deg,#3B82F6 0%,#2563EB 100%);border-radius:var(--rb);user-select:none}
.grades-table th.sticky-col{position:sticky;left:0;z-index:3}
.grades-table th.lesson-head{cursor:context-menu;min-width:120px}
.grades-table td{padding:6px;text-align:center;vertical-align:middle}
.grades-table td.name-cell{text-align:left;font-size:13.5px;font-weight:700;color:#fff;white-space:nowrap;padding:12px 16px;position:sticky;left:0;z-index:2;min-width:180px;background:linear-gradient(135deg,#3B82F6 0%,#2563EB 100%);border-radius:var(--rt);user-select:none;cursor:context-menu}
.grades-table .cell-btn{width:52px;height:52px;border-radius:var(--rt);border:1.5px solid var(--border);background:var(--section);color:var(--muted);font-family:inherit;font-weight:700;font-size:15px;cursor:pointer;transition:transform .2s var(--ease-spring),background .2s ease,color .2s ease,border-color .2s ease;display:inline-flex;align-items:center;justify-content:center}
.grades-table .cell-btn:hover{transform:scale(1.1);border-color:var(--accent)}
.grades-table .cell-btn.filled{border-color:transparent;color:#fff}
.grades-table .cell-btn.g1,.grades-table .cell-btn.g2,.grades-table .cell-btn.g3,.grades-table .cell-btn.g4{background:#DC2626}
.grades-table .cell-btn.g5,.grades-table .cell-btn.g6{background:#EA580C}
.grades-table .cell-btn.g7,.grades-table .cell-btn.g8{background:#EAB308}
.grades-table .cell-btn.g9,.grades-table .cell-btn.g10{background:#16A34A}
.grades-table .cell-btn.absent{background:#DC2626;color:#fff;border-color:transparent}
.grades-table .cell-btn.not-here{opacity:.35;cursor:not-allowed;font-size:18px}

/* =========================================================
   USERS
   ========================================================= */
.users-list{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.user-row{display:flex;align-items:center;gap:14px;background:var(--bg);border:1px solid var(--border);border-radius:var(--ri);padding:14px 16px;transition:background .2s ease,transform .2s ease;cursor:context-menu}
.user-row:hover{background:var(--section);transform:translateX(4px)}
.u-ava{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#3B82F6,#2563EB);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0}
.u-info{flex:1;min-width:0}
.u-name{font-size:14px;font-weight:700;color:var(--text);margin-bottom:3px}
.u-email{font-size:11.5px;color:var(--muted)}
.u-role select{font-family:inherit;font-size:12px;font-weight:700;padding:9px 12px;border-radius:var(--rb);border:1px solid var(--border);background:var(--bg);color:var(--text);outline:none;cursor:pointer}
.u-del{width:36px;height:36px;border-radius:var(--rb);border:1px solid var(--border);background:var(--bg);color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s ease,color .2s ease}
.u-del:hover{background:#FEF2F2;color:#DC2626}
.u-del .msr{font-size:20px}

/* =========================================================
   POPOVER
   ========================================================= */
.pop-overlay{position:fixed;inset:0;z-index:199;background:transparent;display:none}
.pop-overlay.open{display:block}
.popover{position:absolute;z-index:200;width:300px;background:var(--bg);border:1px solid var(--border);border-radius:18px;box-shadow:0 24px 60px -16px rgba(15,23,42,.35);padding:16px;opacity:0;transform:scale(.9) translateY(-6px);pointer-events:none;transition:opacity .22s var(--ease-out),transform .28s var(--ease-spring)}
.popover.open{opacity:1;transform:scale(1) translateY(0);pointer-events:auto}
.popover .pop-arrow{position:absolute;width:14px;height:14px;background:var(--bg);border:1px solid var(--border);transform:rotate(45deg);z-index:-1}
.popover[data-arrow="top-left"] .pop-arrow{top:-7px;left:22px;border-right:none;border-bottom:none}
.popover[data-arrow="top-right"] .pop-arrow{top:-7px;right:22px;border-right:none;border-bottom:none}
.popover[data-arrow="bottom-left"] .pop-arrow{bottom:-7px;left:22px;border-left:none;border-top:none}
.popover[data-arrow="bottom-right"] .pop-arrow{bottom:-7px;right:22px;border-left:none;border-top:none}
.pop-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:14px}
.pop-title{font-size:13.5px;font-weight:700;color:var(--brand);line-height:1.3}
.pop-sub{font-size:10.5px;color:var(--muted);margin-top:2px}
.pop-close{width:28px;height:28px;border-radius:var(--rb);border:1px solid var(--border);background:var(--bg);color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.pop-close .msr{font-size:16px}
.pop-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;display:block}
.status-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.status-btn{padding:10px 8px;border:2px solid var(--border);background:var(--bg);border-radius:var(--rt);font-family:inherit;font-size:12.5px;font-weight:700;color:var(--text);cursor:pointer;transition:border-color .2s ease,background .2s ease;display:flex;align-items:center;justify-content:center;gap:6px}
.status-btn.active[data-status="ЕСТЬ"]{border-color:#16A34A;background:rgba(22,163,74,.1);color:#16A34A}
.status-btn.active[data-status="Н"]{border-color:#DC2626;background:rgba(220,38,38,.1);color:#DC2626}
.status-btn .msr{font-size:16px}
.grades-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:14px}
.grade-btn{aspect-ratio:1;border-radius:var(--rb);border:none;color:#fff;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:transform .18s var(--ease-spring);display:inline-flex;align-items:center;justify-content:center}
.grade-btn:hover{transform:scale(1.12)}
.grade-btn.selected{outline:3px solid var(--accent);outline-offset:1px}
.grade-1,.grade-2,.grade-3,.grade-4{background:#DC2626}
.grade-5,.grade-6{background:#EA580C}
.grade-7,.grade-8{background:#EAB308}
.grade-9,.grade-10{background:#16A34A}
.pop-actions{display:flex;gap:8px}
.pop-actions button{flex:1;padding:10px;border-radius:var(--rt);font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;transition:transform .15s var(--ease-spring)}
.pop-actions button:active{transform:scale(.96)}
.btn-clear{background:var(--bg);color:var(--muted);border:1px solid var(--border)}
.btn-clear:hover{background:#FEF2F2;color:#DC2626}
.btn-save{background:var(--accent);color:#fff;border:none}
.btn-save:hover{background:var(--accent-h)}

/* =========================================================
   CONTEXT MENU
   ========================================================= */
.ctx-menu{position:fixed;z-index:500;background:var(--bg);border:1px solid var(--border);border-radius:var(--ri);box-shadow:0 20px 50px -12px rgba(15,23,42,.4);padding:6px;min-width:230px;opacity:0;transform:scale(.92);pointer-events:none;transition:opacity .18s ease,transform .22s var(--ease-spring);transform-origin:top left}
.ctx-menu.open{opacity:1;transform:scale(1);pointer-events:auto}
.ctx-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--rb);color:var(--text);font-family:inherit;font-size:13.5px;font-weight:500;cursor:pointer;text-align:left;width:100%;border:none;background:transparent;transition:background .15s ease,transform .15s ease}
.ctx-item:hover{background:var(--section);transform:translateX(3px)}
.ctx-item.danger{color:#DC2626}
.ctx-item.danger:hover{background:#FEF2F2}
.ctx-item .msr{font-size:20px;opacity:.85}
.ctx-divider{height:1px;background:var(--border);margin:4px 8px}
.ctx-title{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;padding:8px 12px 4px}

/* =========================================================
   MODALS
   ========================================================= */
.modal-backdrop{position:fixed;inset:0;z-index:100;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:16px;opacity:0;transition:opacity .28s ease;backdrop-filter:blur(4px)}
.modal-backdrop.show{display:flex;opacity:1}
.modal{width:100%;max-width:540px;background:var(--card);border:1px solid var(--border);border-radius:22px;box-shadow:0 24px 60px -16px rgba(15,23,42,.35);max-height:92vh;overflow-y:auto;transform:scale(.92) translateY(20px);transition:transform .35s var(--ease-spring)}
.modal-backdrop.show .modal{transform:scale(1) translateY(0)}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:22px 26px 18px;border-bottom:1px solid var(--border)}
.modal-title{font-size:17px;font-weight:700;color:var(--brand)}
.modal-close{width:38px;height:38px;border-radius:var(--rt);border:1px solid var(--border);background:var(--bg);color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.modal-body{padding:22px 26px}
.modal-body .field{margin-bottom:16px}
.modal-body .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.modal-body textarea{min-height:100px;resize:vertical;font-family:inherit}
.modal-foot{display:flex;gap:10px;padding:18px 26px 24px;border-top:1px solid var(--border)}
.modal-foot .btn{margin-top:0;flex:1}
.check-field{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1.5px dashed var(--border);border-radius:var(--ri);background:var(--bg);cursor:pointer;font-size:13.5px;font-weight:600;margin-bottom:10px}
.check-field input[type=checkbox]{width:22px;height:22px;margin:0;flex-shrink:0;accent-color:var(--accent);cursor:pointer;padding:0}
.check-field .check-text{flex:1}
.check-field .check-hint{font-size:11px;color:var(--muted);margin-top:2px}
.check-field.danger:hover{border-color:#DC2626}
.check-field.sor input[type=checkbox]{accent-color:#1F9EA8}
.check-field.soch input[type=checkbox]{accent-color:#1E88E5}
.modal-backdrop.mini .modal{max-width:440px}

/* =========================================================
   TOGGLE SWITCH (spec-compliant capsule)
   ========================================================= */
.nc-switch{position:relative;display:inline-block;width:58px;height:32px;flex-shrink:0}
.nc-switch input{opacity:0;width:0;height:0;position:absolute}
.nc-switch .nc-switch-track{
  position:absolute;inset:0;
  background:var(--bg);
  border:2px solid var(--border);
  border-radius:var(--rp);
  cursor:pointer;
  transition:background .3s ease,border-color .3s ease;
}
.nc-switch .nc-switch-track::after{
  content:'';position:absolute;top:50%;left:3px;
  width:22px;height:22px;background:var(--muted);
  border-radius:50%;transform:translateY(-50%);
  transition:left .38s var(--ease-spring),background .3s ease,box-shadow .3s ease;
}
.nc-switch input:checked + .nc-switch-track{
  background:var(--accent-light);
  border-color:var(--accent);
}
.nc-switch input:checked + .nc-switch-track::after{
  left:calc(100% - 25px);
  background:#FFFFFF;
  box-shadow:var(--shadow-toggle);
}

/* =========================================================
   DATE PICKER MODAL
   ========================================================= */
.dp-hint{font-size:11.5px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:6px}
.dp-hint .msr{font-size:16px}
.dp-input-wrap{position:relative}
.dp-input{font-size:18px;font-weight:700;letter-spacing:2px;text-align:center;padding:16px 18px;font-variant-numeric:tabular-nums}
.dp-input::placeholder{letter-spacing:2px;color:#94A3B8;font-weight:400}
.dp-actions-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:16px}
.dp-pick-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px;border-radius:var(--ri);border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;transition:background .2s ease,border-color .2s ease,transform .2s var(--ease-spring)}
.dp-pick-btn:hover{background:var(--section);border-color:var(--accent);transform:translateY(-2px)}
.dp-pick-btn .msr{font-size:22px;color:var(--accent)}
.dp-panel{margin-top:14px;display:none}
.dp-panel.open{display:block;animation:dpIn .35s var(--ease-out) both}
@keyframes dpIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.dp-panel-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px;padding-left:2px}
.dp-dates-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;max-height:260px;overflow-y:auto;padding-right:4px}
.dp-dates-grid::-webkit-scrollbar{width:6px}
.dp-dates-grid::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:3px}
.dp-date-chip{padding:12px 8px;border-radius:var(--rt);border:1.5px solid var(--border);background:var(--bg);cursor:pointer;font-family:inherit;font-weight:700;font-size:12.5px;color:var(--text);transition:background .2s ease,border-color .2s ease,color .2s ease,transform .2s var(--ease-spring);display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.2}
.dp-date-chip:hover{background:var(--accent);border-color:var(--accent);color:#fff;transform:translateY(-3px) scale(1.03)}
.dp-date-chip.selected{background:var(--accent);border-color:var(--accent);color:#fff}
.dp-date-chip-day{font-size:18px;letter-spacing:-.5px}
.dp-date-chip-month{font-size:10px;text-transform:uppercase;opacity:.75;letter-spacing:.5px}
.dp-date-chip-year{font-size:9.5px;opacity:.55}
.dp-empty{padding:24px;text-align:center;color:var(--muted);font-size:13px}
.dp-empty .msr{font-size:38px;color:#CBD5E1;display:block;margin-bottom:8px}

/* =========================================================
   ACCOUNT & SETTINGS MODALS
   ========================================================= */
.account-modal{max-width:480px}
.settings-modal{max-width:820px;width:100%}
.acc-avatar-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:22px}
.acc-avatar{position:relative;width:110px;height:110px;border-radius:50%;cursor:pointer;overflow:hidden;box-shadow:0 12px 30px -12px rgba(37,99,235,.5);display:block}
.acc-avatar-img{width:100%;height:100%;border-radius:50%;background:linear-gradient(135deg,#3B82F6,#2563EB);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:38px;background-size:cover;background-position:center}
.acc-avatar-overlay{position:absolute;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .3s ease}
.acc-avatar:hover .acc-avatar-overlay{opacity:1}
.acc-avatar-overlay .msr{font-size:32px;color:#fff}
.acc-avatar-hint{font-size:11.5px;color:var(--muted);text-align:center}
.acc-divider{height:1px;background:var(--border);margin:18px 0}
.acc-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acc-actions .btn{margin-top:0;padding:11px;font-size:12.5px}
.acc-actions .btn .msr{font-size:18px}
.settings-layout{display:grid;grid-template-columns:220px 1fr;min-height:420px;max-height:70vh}
.settings-side{border-right:1px solid var(--border);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.set-tab{display:flex;align-items:center;gap:12px;padding:12px 14px;border:none;background:transparent;border-radius:var(--rt);color:var(--text);font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;text-align:left;transition:background .2s ease}
.set-tab.active{background:var(--accent-light);color:var(--accent)}
.set-tab .msr{font-size:22px}
.settings-main{padding:24px 26px;overflow-y:auto}
.set-pane{display:none}
.set-pane.active{display:block}
.set-block-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:16px}
.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.theme-card{border:2px solid var(--border);background:var(--bg);border-radius:16px;padding:14px;cursor:pointer;font-family:inherit;transition:border-color .2s ease,box-shadow .2s ease}
.theme-card.active{border-color:var(--accent);box-shadow:0 0 0 4px rgba(37,99,235,.12)}
.theme-preview{height:80px;border-radius:var(--rb);margin-bottom:10px;border:1px solid var(--border)}
.theme-preview.light{background:linear-gradient(135deg,#F8FAFC,#FFFFFF)}
.theme-preview.dark{background:linear-gradient(135deg,#0B1220,#1E293B)}
.theme-name{font-size:13px;font-weight:700;color:var(--text);text-align:center}
.lang-list{display:flex;flex-direction:column;gap:10px}
.lang-card{display:flex;align-items:center;gap:14px;padding:14px 18px;border:2px solid var(--border);background:var(--bg);border-radius:var(--ri);cursor:pointer;font-family:inherit;transition:border-color .2s ease,background .2s ease}
.lang-card.active{border-color:var(--accent);background:var(--accent-light)}
.lang-flag{font-size:26px}
.lang-name{font-size:14px;font-weight:700;color:var(--text)}

/* =========================================================
   MOBILE BOTTOM NAV
   ========================================================= */
.mobile-bottom{position:fixed;left:10px;right:10px;bottom:10px;height:68px;background:var(--card);border:1px solid var(--border);border-radius:22px;box-shadow:0 -6px 24px -8px rgba(15,23,42,.15);display:none;align-items:center;padding:6px 8px;gap:4px;z-index:45}
.mb-item{flex:1;height:56px;border:none;background:transparent;border-radius:16px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);transition:background .2s ease,color .2s ease}
.mb-item.active{background:linear-gradient(135deg,#3B82F6 0%,#2563EB 100%);color:#fff}
.mb-item .msr{font-size:26px}

@media (max-width:640px){
  .burger{display:flex}
  .app-layout{padding:10px 10px 88px;gap:10px}
  .topbar{border-radius:18px;padding:10px 14px;gap:10px;min-height:60px}
  .topbar-title{font-size:15px}
  .topbar-chip .user-name{display:none}
  .page-pane{border-radius:18px;padding:14px}
  .lesson-row{padding:14px;gap:12px;flex-wrap:wrap}
  .lesson-num{width:52px;height:52px;font-size:19px}
  .lesson-action{width:100%;justify-content:flex-end}
  .mobile-bottom{display:flex}
  .sidebar{position:fixed;top:10px;left:10px;bottom:10px;width:280px;transform:translateX(calc(-100% - 20px));transition:transform .4s var(--ease-out);z-index:75;box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:translateX(0);width:280px}
  .sidebar .sb-name,.sidebar .menu-label,.sidebar .sb-info,.sidebar .sb-logout{opacity:1;transform:translateX(0)}
  .day-grid{grid-template-columns:1fr}
  .day-total{width:100%;flex-direction:row;justify-content:center;gap:10px}
  .diary-score{display:none}
  .diary-banner{justify-content:center;text-align:center}
  .diary-title-wrap{align-items:center}
  .settings-layout{grid-template-columns:1fr}
  .settings-side{flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--border);padding:12px}
  .set-tab{white-space:nowrap}
  .modal-body .grid-2{grid-template-columns:1fr}
  .acc-actions{grid-template-columns:1fr}
  .user-dropdown{width:min(300px,calc(100vw - 20px))}
  .popover{width:calc(100vw - 40px);max-width:320px}
  .date-grid{grid-template-columns:1fr 1fr}
  .date-card{padding:16px 14px}
  .date-card-day{font-size:24px}
  .dp-dates-grid{grid-template-columns:repeat(auto-fill,minmax(72px,1fr))}
}

/* =========================================================
   TOAST
   ========================================================= */
#toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);background:#0F172A;color:#fff;padding:12px 20px;border-radius:var(--rt);font-size:13px;font-weight:600;z-index:300;opacity:0;transition:opacity .3s ease,transform .35s var(--ease-spring);pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
html[data-theme="dark"] #toast{background:#334155}

/* =========================================================
   CUSTOM SELECT
   ========================================================= */
.cs-wrap{position:relative;width:100%}
.cs-input{width:100%;padding:13px 44px 13px 16px;border:1px solid var(--border);border-radius:var(--ri);background:var(--bg);color:var(--text);font-family:inherit;font-size:14px;cursor:pointer;text-align:left;transition:border-color .2s ease,box-shadow .25s ease}
.cs-input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(37,99,235,.12);outline:none}
.cs-input.placeholder{color:#94A3B8}
.cs-panel{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--bg);border:1px solid var(--border);border-radius:var(--ri);box-shadow:0 20px 40px -16px rgba(15,23,42,.25);z-index:200;max-height:320px;overflow:hidden;display:none;flex-direction:column}
.cs-wrap.open .cs-panel{display:flex}
.cs-search{padding:8px 10px;border-bottom:1px solid var(--border);display:flex}
.cs-search input{border:none;padding:8px 4px;font-size:13.5px;flex:1;box-shadow:none!important;background:transparent}
.cs-list{overflow-y:auto;padding:6px;max-height:240px}
.cs-option{padding:11px 14px;font-size:14px;border-radius:var(--rb);cursor:pointer;transition:background .15s ease,color .15s ease}
.cs-option:hover{background:var(--accent-light);color:var(--accent)}
.cs-option.selected{background:var(--accent);color:#fff}
.cs-empty{padding:16px;text-align:center;color:var(--muted);font-size:13px}

/* dark theme extras */
html[data-theme="dark"] .lesson-row.cancelled{background:rgba(220,38,38,.08)}
html[data-theme="dark"] .ctx-item.danger:hover{background:rgba(220,38,38,.12)}
html[data-theme="dark"] .dp-dates-grid::-webkit-scrollbar-thumb{background:#334155}
</style>

<script>
/* =========================================================

const GAS_URL = 'https://script.google.com/macros/s/AKfycbzzQR5ER-IR-44nE7AcnNkK8RcYNvYmGvTrOfFXuDKfHhkLxa17AHoAUgH730VKQNHW/exec';
const CREATOR_EMAIL = 'maksimsuhomlinov37@gmail.com';
const SESSION_KEY = 'nc_session';
const CACHE_KEY = 'nc_cache_v8';
const SESSION_MS = 30*24*60*60*1000;
const THEME_KEY = 'nc_theme';
const LANG_KEY = 'nc_lang';
const AVATAR_KEY = 'nc_avatar';
const CUSTOM_REFS_KEY = 'nc_custom_refs_v1';
const GRADES_KEY = 'nc_grades_v3';
const TABLE_KEY = 'nc_grades_table_v3';

const $ = id => document.getElementById(id);
const $$ = sel => document.querySelectorAll(sel);
const ROLES = {'Ученик':'student','Модератор':'moderator','Учитель':'teacher','Директор':'director','Администратор':'admin','Создатель':'creator'};
const EDITOR_ROLES = ['Учитель','Директор','Администратор','Создатель'];
const MONTHS_GEN=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONTHS_NOM=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_SHORT=['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
const WEEKDAYS=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
const WEEKDAYS_SHORT=['ВС','ПН','ВТ','СР','ЧТ','ПТ','СБ'];

const REF_LESSON_NUMS = ['1','2','3','4','5','6','7'];
const REF_TIMES = ['12:55 - 13:35','13:40 - 14:20','14:30 - 15:10','15:25 - 16:05','16:15 - 16:55','17:00 - 17:40','17:45 - 18:25'];
const REF_SUBJECTS = ['Классный час','Казахский язык','Математика','Русский язык','История Казахстана','Физическая культура','Иностранный язык (Английский язык)','Русская литература','Художественный труд','Естествознание','Всемирная история','Музыка','Информация и Искусственный интеллект'];
const REF_TEACHERS = ['Күлжиһан Ибтанқыз','Жулдыз Сейдоловна','Елизавета Юрьевна','Камшат Айсиновна','Александра Сергеевна','Лаура Жамбоуловна','Лидия Васильевна','Гульмира Жумагалеевна','Игорь Вячеславович'];
const REF_ROOMS = ['308 - Кабинет английского языка','305 - Кабинет математики','214 - Кабинет истории','215 - СпортЗал','307 - Кабинет НВиТП','207 - Кабинет географии'];

/* =========================================================
   ОЦЕНКИ
   ========================================================= */
function loadGrades(){ try{ const raw = localStorage.getItem(GRADES_KEY); return raw ? JSON.parse(raw) : {}; }catch(e){ return {}; } }
function saveGrades(g){ try{ localStorage.setItem(GRADES_KEY, JSON.stringify(g)); }catch(e){} }
let gradesStore = loadGrades();
function gradeKey(dateIso, lessonId, email){ return dateIso + '::' + String(lessonId) + '::' + (email || '').toLowerCase(); }
function getGrade(dateIso, lessonId, email){ return gradesStore[gradeKey(dateIso, lessonId, email)] || null; }
function gradeColorClass(g){
  if(!g) return '';
  const n = parseInt(g,10);
  if(n>=1 && n<=4) return 'g1';
  if(n>=5 && n<=6) return 'g5';
  if(n>=7 && n<=8) return 'g7';
  if(n>=9 && n<=10) return 'g9';
  return '';
}

/* =========================================================
   СЕССИЯ
   ========================================================= */
function saveSession(u){ try{ localStorage.setItem(SESSION_KEY, JSON.stringify({user:u, expiresAt:Date.now()+SESSION_MS})); }catch(e){} }
function getSession(){ try{ const raw=localStorage.getItem(SESSION_KEY); if(!raw) return null; const d=JSON.parse(raw); if(!d||!d.expiresAt) return null; if(Date.now()>=d.expiresAt){ localStorage.removeItem(SESSION_KEY); return null; } return d; }catch(e){ return null; } }
function clearSession(){ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} }
function getCurrentUser(){ const s=getSession(); return s&&s.user?s.user:null; }
function userRole(){ const u=getCurrentUser(); let r=u&&u.role?u.role:'Ученик'; if(!ROLES[r]) r='Ученик'; return r; }
function isCreator(){ const u=getCurrentUser(); if(!u) return false; return String(u.email||'').toLowerCase()===CREATOR_EMAIL.toLowerCase() && userRole()==='Создатель'; }
function canEditSchedule(){ return EDITOR_ROLES.indexOf(userRole())!==-1; }
function isAdmin(){ const r=userRole(); return r==='Администратор'||r==='Создатель'; }
function canGrade(){ return canEditSchedule(); }
function canManageUsers(){ return isAdmin(); }

/* =========================================================
   JSONP
   ========================================================= */
let jsonpCounter = 0;
function jsonp(params, timeout){
  return new Promise((resolve,reject)=>{
    const cbName='nc_cb_'+(++jsonpCounter)+'_'+Date.now();
    let finished=false, script, to;
    const cleanup=()=>{ try{ delete window[cbName]; }catch(e){} if(script&&script.parentNode) script.parentNode.removeChild(script); clearTimeout(to); };
    window[cbName]=function(data){ if(finished) return; finished=true; cleanup(); resolve(data); };
    const qs=new URLSearchParams(Object.assign({}, params, {callback:cbName})).toString();
    script=document.createElement('script'); script.src=GAS_URL+'?'+qs+'&_='+Date.now();
    script.onerror=function(){ if(finished) return; finished=true; cleanup(); reject(new Error('Нет связи')); };
    document.head.appendChild(script);
    to=setTimeout(()=>{ if(finished) return; finished=true; cleanup(); reject(new Error('Таймаут')); }, timeout||20000);
  });
}

/* =========================================================
   ДАТЫ
   ========================================================= */
function normDate(v){
  if(!v) return ''; const s=String(v).trim();
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[1]+'-'+m[2]+'-'+m[3];
  m=s.match(/^(\d{1,2})[./](\d{1,2})[./](\d{4})/); if(m) return m[3]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0');
  const d=new Date(s); if(!isNaN(d.getTime())) return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  return s.slice(0,10);
}
function isoOfDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayISO(){ return isoOfDate(new Date()); }
function mondayOf(d){ const x=new Date(d); x.setHours(0,0,0,0); const day=x.getDay(); const diff=(day===0?-6:1-day); x.setDate(x.getDate()+diff); return x; }
function currentMonday(){ return mondayOf(new Date(selectedDate+'T00:00:00')); }
function initialDate(){ const d=new Date(); const dow=d.getDay(); if(dow===0) d.setDate(d.getDate()-2); if(dow===6) d.setDate(d.getDate()-1); return isoOfDate(d); }
function moveWeek(delta){ const d=new Date(selectedDate+'T00:00:00'); d.setDate(d.getDate()+delta*7); selectedDate=isoOfDate(d); }
function moveDay(delta){ const d=new Date(selectedDate+'T00:00:00'); do{ d.setDate(d.getDate()+delta); }while(d.getDay()===0||d.getDay()===6); selectedDate=isoOfDate(d); }
function moveMonth(delta){ const d=new Date(selectedDate+'T00:00:00'); d.setMonth(d.getMonth()+delta); while(d.getDay()===0||d.getDay()===6){ d.setDate(d.getDate()+(delta>0?1:-1)); } selectedDate=isoOfDate(d); }
function setDayOfWeek(idx){ const mon=currentMonday(); mon.setDate(mon.getDate()+idx); selectedDate=isoOfDate(mon); }
function goToday(){ selectedDate=initialDate(); }
function dowIdx(iso){ const d=new Date(iso+'T00:00:00'); const day=d.getDay(); return day===0?0:Math.min(day-1,4); }
function formatRuDate(iso){ const d=new Date(iso+'T00:00:00'); return d.getDate()+' '+MONTHS_GEN[d.getMonth()]+' '+d.getFullYear()+' год'; }
function esc(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function filterByDate(lessons, date){ return (lessons||[]).filter(l => normDate(l.date) === date); }
function getLast5SchoolDays(){
  const arr = [];
  const d = new Date();
  while(d.getDay()===0 || d.getDay()===6){ d.setDate(d.getDate()-1); }
  for(let i=0;i<5;i++){
    arr.unshift(isoOfDate(d));
    d.setDate(d.getDate()-1);
    while(d.getDay()===0 || d.getDay()===6){ d.setDate(d.getDate()-1); }
  }
  return arr;
}

/* =========================================================
   СОСТОЯНИЕ
   ========================================================= */
let currentPage='home', selectedDate=initialDate(), animating=false;
let cacheLessons=[], cacheHwStatuses={}, editingId=null;
let currentTableDate = null;
const prefetched = { scheduleByDate:{}, hwStatuses:null, users:null };
const inflight = new Map();
const PAGE_ORDER = {home:0, schedule:1, homework:2, diary:3, users:4};

/* =========================================================
   СИНХРОНИЗАЦИЯ ОЦЕНОК
   ========================================================= */
async function pushGradeToServer(dateIso, lessonId, email, entry){
  const u = getCurrentUser(); if(!u) return;
  try{
    await jsonp({
      action:'grades_set', requester:u.email, date:dateIso,
      lessonId:String(lessonId), email:email,
      status: entry ? entry.status : 'ЕСТЬ',
      grade: (entry && entry.grade != null) ? entry.grade : ''
    }, 12000);
  }catch(e){ console.warn('grades_set failed:', e); }
}
async function pullGradesFromServer(user){
  try{
    const res = await jsonp({action:'grades_get', requester:user.email}, 15000);
    if(!res || res.status !== 'ok' || !Array.isArray(res.grades)) return;
    gradesStore = {};
    res.grades.forEach(g => {
      gradesStore[gradeKey(g.date, g.lessonId, g.email)] = { status:g.status, grade:g.grade };
    });
    saveGrades(gradesStore);
  }catch(e){ console.warn('grades_get failed:', e); }
}
function setGrade(dateIso, lessonId, email, entry){
  const k = gradeKey(dateIso, lessonId, email);
  if(!entry || (entry.status === 'ЕСТЬ' && (entry.grade === null || entry.grade === undefined))) delete gradesStore[k];
  else gradesStore[k] = entry;
  saveGrades(gradesStore);
  pushGradeToServer(dateIso, lessonId, email, entry);
}

/* =========================================================

   ========================================================= */
function loadTableCfg(){ try{ const raw = localStorage.getItem(TABLE_KEY); return raw ? JSON.parse(raw) : { students:[], columns:[] }; }catch(e){ return { students:[], columns:[] }; } }
function saveTableCfg(cfg){ try{ localStorage.setItem(TABLE_KEY, JSON.stringify(cfg)); }catch(e){} }
function getTableCfg(){
  const cfg = loadTableCfg();
  if(!cfg.students) cfg.students = [];
  if(!cfg.columns)  cfg.columns  = [];
  const users = (prefetched.users && prefetched.users.length) ? prefetched.users : [];
  if(users.length){
    const known = new Set(cfg.students.map(s => String(s.email).toLowerCase()));
    users.filter(u => String(u.role||'').trim() === 'Ученик').forEach(u => {
      const em = String(u.email).toLowerCase();
      if(!known.has(em)){ cfg.students.push({ email:u.email, name:u.name || u.email }); known.add(em); }
    });
    saveTableCfg(cfg);
  }
  if(!cfg.students.length){
    const me = getCurrentUser();
    if(me) cfg.students = [{ email: me.email, name: me.name || me.email }];
  }
  if(!cfg.columns.length) cfg.columns = getLast5SchoolDays();
  return cfg;
}

function getCustomRefs(){ try{ const raw=localStorage.getItem(CUSTOM_REFS_KEY); if(!raw) return {lessonNum:[],time:[],subject:[],teacher:[],room:[]}; const o=JSON.parse(raw); return {lessonNum:o.lessonNum||[],time:o.time||[],subject:o.subject||[],teacher:o.teacher||[],room:o.room||[]}; }catch(e){ return {lessonNum:[],time:[],subject:[],teacher:[],room:[]}; } }
function saveCustomRefs(o){ try{ localStorage.setItem(CUSTOM_REFS_KEY, JSON.stringify(o)); }catch(e){} }
function normKey(s){ return String(s||'').trim().toLowerCase(); }
function contains(list, v){ const k=normKey(v); return list.some(x=>normKey(x)===k); }
function mergeRefs(base, custom){ const seen=new Set(); const out=[]; (base||[]).forEach(v=>{const k=normKey(v); if(!k||seen.has(k))return; seen.add(k); out.push(v);}); (custom||[]).forEach(v=>{const k=normKey(v); if(!k||seen.has(k))return; seen.add(k); out.push(v);}); return out; }
function rememberValue(kind, value){ const v=String(value||'').trim(); if(!v) return; const refs=getCustomRefs(); if(!refs[kind]) refs[kind]=[]; if(contains(refs[kind],v)) return; const baseMap={lessonNum:REF_LESSON_NUMS,time:REF_TIMES,subject:REF_SUBJECTS,teacher:REF_TEACHERS,room:REF_ROOMS}; if(baseMap[kind] && contains(baseMap[kind],v)) return; refs[kind].push(v); saveCustomRefs(refs); }

const CustomSelect = (function(){
  function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function init(wrap, options, opts){
    opts = opts || {};
    const toggle = wrap.querySelector('[data-cs-toggle]');
    const search = wrap.querySelector('[data-cs-search]');
    const list = wrap.querySelector('[data-cs-list]');
    let allOptions = (options||[]).slice();
    let filtered = allOptions.slice();
    function renderList(){
      const cur = wrap.dataset.value || '';
      const q = search ? search.value.trim() : '';
      let html = '';
      if(q && !filtered.some(v => normKey(v)===normKey(q))){ html += `<div class="cs-option" data-cs-add="1" style="color:var(--accent);font-weight:700">+ Добавить «${esc(q)}»</div>`; }
      if(!filtered.length && !q){ html += '<div class="cs-empty">Ничего не найдено</div>'; }
      else { html += filtered.map(v => `<div class="cs-option ${v===cur?'selected':''}" data-val="${esc(v)}">${esc(v)}</div>`).join(''); }
      list.innerHTML = html;
    }
    function open(){ document.querySelectorAll('.cs-wrap.open').forEach(w=>{if(w!==wrap)w.classList.remove('open');}); wrap.classList.add('open'); if(search){search.value='';filtered=allOptions.slice();renderList();setTimeout(()=>search.focus(),40);} }
    function close(){ wrap.classList.remove('open'); }
    toggle.addEventListener('click', e => { e.stopPropagation(); wrap.classList.contains('open') ? close() : open(); });
    if(search){ search.addEventListener('input', () => { const q=search.value.trim().toLowerCase(); filtered=!q?allOptions.slice():allOptions.filter(v=>v.toLowerCase().includes(q)); renderList(); });
      search.addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); const q=search.value.trim(); if(filtered.length) setValue(filtered[0]); else if(q) addAndSelect(q); } else if(e.key==='Escape') close(); }); }
    list.addEventListener('click', e => {
      const addBtn = e.target.closest('[data-cs-add]');
      if(addBtn){ e.stopPropagation(); const q=search.value.trim(); if(q) addAndSelect(q); return; }
      const opt = e.target.closest('.cs-option[data-val]'); if(!opt) return; setValue(opt.dataset.val);
    });
    function addAndSelect(v){ rememberValue(wrap.dataset.kind, v); if(!allOptions.some(x=>normKey(x)===normKey(v))) allOptions.push(v); filtered=allOptions.slice(); setValue(v); }
    function setValue(v){ wrap.dataset.value = v; toggle.textContent = v; toggle.classList.remove('placeholder'); close(); }
    function setSilent(v){ wrap.dataset.value = v||''; if(v){ toggle.textContent=v; toggle.classList.remove('placeholder'); } else { toggle.textContent = opts.placeholder||'Выберите'; toggle.classList.add('placeholder'); } }
    document.addEventListener('click', e => { if(!wrap.contains(e.target)) close(); });
    renderList();
    wrap._cs = { setValue, setSilent, get value(){ return wrap.dataset.value; } };
  }
  return { init };
})();

   ========================================================= */
const NovaLoader = (function(){
  let interval = null, progress = 0, labelShown = false;
  function start(){
    progress = 0; labelShown = false;
    const fill = $('loaderFill');
    const label = $('loaderLabel');
    if(fill) fill.style.width = '0%';
    if(label) label.classList.remove('show');
    interval = setInterval(() => {
      progress += (92 - progress) * 0.08;
      if(fill) fill.style.width = progress.toFixed(2) + '%';
      if(progress > 25 && !labelShown){
        labelShown = true;
        if(label) label.classList.add('show');
      }
    }, 60);
  }
  function stop(){
    clearInterval(interval);
    const fill = $('loaderFill');
    if(fill){
      fill.style.transition = 'width .35s cubic-bezier(.4,0,.2,1)';
      fill.style.width = '100%';
    }
  }
  return { start, stop };
})();
function showLoader(){ const l=$('loader'); if(!l) return; l.classList.remove('hidden','fade-out'); NovaLoader.start(); }
function hideLoader(){ const l=$('loader'); if(!l) return; NovaLoader.stop(); l.classList.add('fade-out'); setTimeout(()=>{ l.classList.add('hidden'); l.classList.remove('fade-out'); }, 550); }

async function fetchSched(date, user){
  if(prefetched.scheduleByDate[date] !== undefined) return prefetched.scheduleByDate[date];
  if(inflight.has(date)) return inflight.get(date);
  const p = jsonp({action:'get_sched', requester:user.email, date}, 12000)
    .then(res => {
      if(res && res.status === 'ok'){
        const lessons = filterByDate(res.lessons, date);
        prefetched.scheduleByDate[date] = lessons;
        return lessons;
      }
      prefetched.scheduleByDate[date] = [];
      return [];
    }).finally(() => inflight.delete(date));
  inflight.set(date, p);
  return p;
}
async function prefetchAll(user){
  if(!user||!user.email) return;
  const mon = mondayOf(new Date(selectedDate+'T00:00:00'));
  const dates=[];
  for(let i=0;i<5;i++){ const d=new Date(mon); d.setDate(mon.getDate()+i); dates.push(isoOfDate(d)); }
  const jobs = dates.map(date => fetchSched(date, user).catch(()=>{}));
  if(!prefetched.hwStatuses){
    jobs.push(jsonp({action:'hw_status', requester:user.email}, 10000).then(hr => { if(hr&&hr.status==='ok') prefetched.hwStatuses = hr.statuses||{}; }).catch(()=>{}));
  }
  if(!prefetched.users || !prefetched.users.length){
    jobs.push(jsonp({action:'users_list', requester:user.email}, 10000).then(ur => { if(ur&&ur.status==='ok') prefetched.users = ur.users||[]; }).catch(()=>{}));
  }
  jobs.push(pullGradesFromServer(user).catch(()=>{}));
  await Promise.all(jobs);
}

async function doLogin(){
  hideErr();
  if(markEmpty([$('loginEmail'), $('loginPass')])){ showErr('Введите данные'); return; }
  $('loginBtn').disabled=true;
  const email = $('loginEmail').value.trim().toLowerCase(); const pass = $('loginPass').value;
  try{
    showLoader();
    const res = await jsonp({action:'login', email, pass});
    if(!res){ hideLoader(); showErr('Пустой ответ'); return; }
    if(res.status !== 'ok'){ hideLoader(); showErr(res.message||'Ошибка входа'); return; }
    const u = res.user || {};
    if(!u.name) u.name = u.email ? u.email.split('@')[0] : 'Пользователь';
    if(!u.role||!ROLES[u.role]) u.role='Ученик';
    if(String(u.email||'').toLowerCase()===CREATOR_EMAIL.toLowerCase()) u.role='Создатель';
    u.pass = pass;
    saveSession(u);
    await new Promise(r=>setTimeout(r, 2200));
    hideLoader();
    await enterApp();
    prefetchAll(u).then(()=>{ if(['schedule','homework','diary','users'].includes(currentPage)) refreshCurrentPage(); });
  }catch(e){ hideLoader(); showErr('Ошибка: '+e.message); }
  finally{ $('loginBtn').disabled=false; }
}

function renderPage(key){
  const vp = $('pagesViewport');
  $$('.menu-item').forEach(b => b.classList.toggle('active', b.dataset.page === key));
  $$('.mb-item').forEach(b => b.classList.toggle('active', b.dataset.page === key));
  moveIndicator();
  $('topbarTitle').textContent = TITLES[key] || 'Главная';
  if(!vp.firstChild){
    vp.appendChild(buildPane(key));
    bindPage(key);
    currentPage = key; updateTopbarAdd(); loadPageData(key);
    return;
  }
  if(key === currentPage || animating) return;
  animating = true;
  showTopProgress();
  const oldPane = vp.querySelector('.page-pane');
  const dir = (PAGE_ORDER[key]||0) > (PAGE_ORDER[currentPage]||0) ? 'next' : 'prev';
  const newPane = buildPane(key, dir);
  vp.appendChild(newPane);
  bindPage(key);
  if(oldPane) oldPane.classList.add(dir==='next' ? 'slide-out-left' : 'slide-out-right');
  setTimeout(()=>{ if(oldPane&&oldPane.parentNode) oldPane.parentNode.removeChild(oldPane); animating=false; }, 400);
  currentPage = key; updateTopbarAdd(); loadPageData(key);
}
function bindPage(key){
  if(key==='schedule'||key==='homework') bindWeekPanel();
  if(key==='users') bindUsersPage();
}
function refreshCurrentPage(){
  const pane = document.querySelector('.page-pane[data-page="'+currentPage+'"]'); if(!pane) return;
  pane.innerHTML = getPaneHTML(currentPage);
  bindPage(currentPage);
}
async function loadPageData(key){
  const user = getCurrentUser(); if(!user) return;
  if(key==='schedule' || key==='homework'){
    if(prefetched.scheduleByDate[selectedDate] !== undefined){
      cacheLessons = prefetched.scheduleByDate[selectedDate];
      if(key==='homework' && prefetched.hwStatuses) cacheHwStatuses = prefetched.hwStatuses;
      refreshCurrentPage(); return;
    }
    try{
      const lessons = await fetchSched(selectedDate, user);
      cacheLessons = lessons;
      if(key==='homework'){
        if(prefetched.hwStatuses) cacheHwStatuses = prefetched.hwStatuses;
        else { const hr = await jsonp({action:'hw_status', requester:user.email}); if(hr&&hr.status==='ok'){ cacheHwStatuses=hr.statuses||{}; prefetched.hwStatuses=cacheHwStatuses; } }
      }
      if(currentPage===key) refreshCurrentPage();
    }catch(e){ showToast(e.message); if(currentPage===key) refreshCurrentPage(); }
    return;
  }
  if(key==='users'){
    try{
      const res = await jsonp({action:'users_list', requester:user.email});
      if(res && res.status==='ok') prefetched.users = res.users||[];
    }catch(e){}
    if(currentTableDate && prefetched.scheduleByDate[currentTableDate] === undefined){
      try{ await fetchSched(currentTableDate, user); }catch(e){}
    }
    if(!prefetched.hwStatuses){
      try{ const hr = await jsonp({action:'hw_status', requester:user.email}, 8000); if(hr&&hr.status==='ok') prefetched.hwStatuses = hr.statuses||{}; }catch(e){}
    }
    if(currentPage===key) refreshCurrentPage();
  }
}

  if(l.sor) badges.push(`<span class="sor-badge">СОР</span>`);
  if(l.soch) badges.push(`<span class="soch-badge">СОЧ</span>`);

  const user = getCurrentUser();
  const email = user ? user.email : '';
  const entry = getGrade(dateIso, l.id, email);
  let chip = '';

    let chipText = '—', chipCls = 'lesson-grade-chip';

    chip = `<div class="${chipCls}" title="Оценка">${chipText}</div>`;
  }
  const status = hwStatuses ? hwStatuses[l.id] : undefined;
  if(mode === 'homework' && status !== undefined){
    badges.push(`<span class="role-badge ${status?'teacher':'admin'}" style="margin-left:8px">${status?'СДЕЛАНО':'НЕ СДЕЛАНО'}</span>`);

  const hwIcon = l.homework ? `<div style="margin-top:8px;font-size:12.5px;color:var(--text);display:flex;align-items:flex-start;gap:6px"><span class="msr" style="font-size:16px;color:var(--accent);flex-shrink:0">menu_book</span><span>${esc(l.homework)}</span></div>` : '';

    editBtns = `<button class="btn-icon" onclick="editLesson('${esc(l.id)}')"><span class="msr">edit</span></button><button class="btn-icon danger" onclick="deleteLesson('${esc(l.id)}')"><span class="msr">delete</span></button>`;
  } else if(mode === 'homework'){

  }

  return `<div class="lesson-row ${cls.join(' ')}" style="--i:${i||0}">

    <div class="lesson-info">
