.modal-backdrop{position:fixed;inset:0;z-index:100;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:16px;opacity:0;transition:opacity .25s ease}.modal-backdrop.show{display:flex;opacity:1}.modal{width:100%;max-width:540px;background:#fff;border-radius:22px;box-shadow:0 24px 60px -16px rgba(15,23,42,.35);max-height:92vh;overflow-y:auto;animation:zoom .3s cubic-bezier(.34,1.4,.64,1) both}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:22px 26px 18px;border-bottom:1px solid var(--border)}.modal-title{font-size:17px;font-weight:700;color:var(--brand)}.modal-close{width:38px;height:38px;border-radius:12px;border:1px solid var(--border);background:#fff;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background .2s ease}.modal-close:hover{background:var(--section);color:var(--text)}.modal-close .msr{font-size:22px}.modal-body{padding:22px 26px}.modal-body .field{margin-bottom:16px}.modal-body .field:last-child{margin-bottom:0}.modal-body .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.modal-body textarea{min-height:100px;resize:vertical;font-family:inherit;line-height:1.5}.modal-foot{display:flex;gap:10px;padding:18px 26px 24px;border-top:1px solid var(--border)}.modal-foot .btn{margin-top:0;flex:1}

оль</label><input id="regPass" type="password" placeholder="Минимум 6 символов" autocomplete="new-password"></div><div class="field"><label>Повтор пароля</label><input id="regPass2" type="password" placeholder="Повторите пароль" autocomplete="new-password"></div><button class="btn" id="regBtn">Создать аккаунт</button></div></div></div></div></div>

content-wrap"><header class="topbar"><div class="topbar-title" id="topbarTitle"><span class="conn-dot ok" id="connDot"></span><span id="connText">Главная</span></div><div class="topbar-right"><button class="topbar-add hidden" id="topbarAddBtn"><span class="msr">add</span> <span>Добавить урок</span></button><div class="topbar-chip"><div class="user-ava" data-user-ava>П</div><span class="user-name" data-user-name>Пользователь</span></div><button class="topbar-logout" data-logout title="Выйти"><span class="msr">logout</span></button></div></header><div class="pages-viewport" id="pagesViewport"></div></div></div><nav class="mobile-bottom" id="mobileBottom"><button class="mb-item active" data-page="home"><span class="msr">home</span></button><button class="mb-item" data-page="schedule"><span class="msr">calendar_month</span></button><button class="mb-item" data-page="homework"><span class="msr">menu_book</span></button><button class="mb-item" data-page="diary"><span class="msr">auto_stories</span></button></nav><div class="side-panel-backdrop" id="sidePanelBackdrop"></div><aside class="side-panel" id="sidePanel"><div class="sp-head"><div class="sp-title" id="spTitle">—</div><button class="sp-close" id="spClose"><span class="msr">close</span></button></div><div class="sp-body" id="spBody"></div></aside><div class="modal-backdrop" id="modalBackdrop"><div class="modal"><div class="modal-head"><div class="modal-title" id="modalTitle">Новый урок</div><button class="modal-close" id="modalClose"><span class="msr">close</span></button></div><div class="modal-body"><div class="grid-2"><div class="field"><label>Дата *</label><input type="date" id="mDate"></div><div class="field"><label>Номер урока</label><input type="number" id="mLessonNum" placeholder="1" min="1"></div></div><div class="field"><label>Время *</label><input type="text" id="mTime" placeholder="08:00 – 08:45"></div><div class="field"><label>Название предмета *</label><input type="text" id="mSubject" placeholder="Мате <script>
const GAS_URL='https://script.google.com/macros/s/AKfycbw-fWUM0ZaLtzS_I62c_sS5APOg-rdOaBvS_fUqIinVqWIas9iQPBCcdd0rRO9vQwwU/exec';
const CREATOR_EMAIL='maksimsuhomlinov37@gmail.com';
const $=id=>document.getElementById(id);
const $$=sel=>document.querySelectorAll(sel);
const SESSION_KEY='nc_session';
const SESSION_MS=30*24*60*60*1000;
let connTimer=null;
function setConn(status, text){
  const dot=$('connDot'); const txt=$('connText');
  if(!dot) return;
  dot.className='conn-dot '+status;
  if(text && currentPage=='home'){
    // на главной показываем статус связи в заголовке
    const titles={home:text, schedule:'Расписание', homework:'Домашние задания', diary:'Дневник в разработке', users:'Управление'};
    // не переопределяем если уже в другом разделе
  }
  if(status=='ok') dot.title='Связь есть ✓ '+new Date().toLocaleTimeString();
  if(status=='sync') dot.title='Синхронизация...';
  if(status=='bad') dot.title='Нет связи';
}
function setConnText(t){ const el=document.getElementById('connText'); if(!el) return; if(currentPage=='home') el.textContent=t; }
const ROLES={'Ученик':{cls:'student'},'Модератор':{cls:'moderator'},'Учитель':{cls:'teacher'},'Директор':{cls:'director'},'Администратор':{cls:'admin'},'Создатель':{cls:'creator'}};
const ROLE_ORDER=['Ученик','Модератор','Учитель','Директор','Администратор','Создатель'];
const EDITOR_ROLES=['Учитель','Директор','Администратор','Создатель'];
function getRoleMeta(r){return ROLES[r]||ROLES['Ученик'];}
function saveSession(u){try{localStorage.setItem(SESSION_KEY,JSON.stringify({user:u,loginAt:Date.now(),expiresAt:Date.now()+SESSION_MS}));}catch(e){}}
function getSession(){try{const raw=localStorage.getItem(SESSION_KEY);if(!raw)return null;const d=JSON.parse(raw);if(!d||!d.expiresAt)return null;if(Date.now()>=d.expiresAt){localStorage.removeItem(SESSION_KEY);return null;}return d;}catch(e){return null;}}
function clearSession(){try{localStorage.removeItem(SESSION_KEY);}catch(e){}}
function getCurrentUser(){const s=getSession();return s&&s.user?s.user:null;}
function isCreator(){const u=getCurrentUser();if(!u)return false;return String(u.email).toLowerCase()===CREATOR_EMAIL.toLowerCase() && String(u.role||'')==='Создатель';}
function userRole(){const u=getCurrentUser();let r=u&&u.role?u.role:'Ученик';if(r==='Инкогнито'||!ROLES[r])r='Ученик';return r;}
function canEditSchedule(){return EDITOR_ROLES.indexOf(userRole())!==-1;}
let jsonpCounter=0;
function jsonp(params, timeout){
  return new Promise((resolve,reject)=>{
    let tries=0;
    const attempt=()=>{
      tries++;
      setConn('sync','');
      const cbName='nc_cb_'+(++jsonpCounter)+'_'+Date.now();
      let finished=false;
      window[cbName]=function(data){
        finished=true; clearTimeout(to); delete window[cbName]; if(script.parentNode) script.parentNode.removeChild(script);
        setConn('ok',''); resolve(data);
      };
      const qs=new URLSearchParams(Object.assign({},params,{callback:cbName})).toString();
      const script=document.createElement('script');
      script.src=GAS_URL+'?'+qs+'&_='+Date.now();
      script.onerror=function(){if(finished)return;finished=true;clearTimeout(to);delete window[cbName];if(script.parentNode)script.parentNode.removeChild(script);if(tries<3){setTimeout(attempt,600);}else{setConn('bad','');reject(new Error('Нет связи'));}};
      document.head.appendChild(script);
      const to=setTimeout(()=>{if(finished)return;finished=true;delete window[cbName];if(script.parentNode)script.parentNode.removeChild(script);if(tries<3){attempt();}else{setConn('bad','');reject(new Error('Таймаут'));}},timeout||15000);
    };
    attempt();
  });
}
function fitFormHeight(){const pane=document.querySelector('.slide-pane[data-pane="'+$('track').dataset.active+'"]');if(pane)$('formsWrap').style.height=pane.scrollHeight+'px';}
$('tabLogin').onclick=()=>switchTab('login');$('tabReg').onclick=()=>switchTab('reg');
function switchTab(w){hideErr();const l=w==='login';$('tabLogin').classList.toggle('active',l);$('tabReg').classList.toggle('active',!l);$('tabs').dataset.active=l?'login':'reg';$('track').dataset.active=l?'login':'reg';fitFormHeight();}
function showErr(m){$('errBox').textContent=m;$('errBox').classList.remove('hidden');fitFormHeight();}
function hideErr(){$('errBox').classList.add('hidden');}
document.querySelectorAll('input').forEach(i=>i.addEventListener('input',()=>i.classList.remove('error')));
function markEmpty(a){let any=false;a.forEach(i=>{if(!i.value.trim()){i.classList.remove('error');void i.offsetWidth;i.classList.add('error');any=true;}});return any;}
$('loginBtn').onclick=doLogin;$('loginPass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
async function doLogin(){hideErr();if(markEmpty([$('loginEmail'),$('loginPass')])){showErr('Введите данные!');return;}$('loginBtn').disabled=true;try{const res=await jsonp({action:'login',email:$('loginEmail').value.trim().toLowerCase(),pass:$('loginPass').value});if(res.status!=='ok'){showErr(res.message||'Ошибка');return;}const u=res.user||{};if(!u.name)u.name=u.email?u.email.split('@')[0]:'Пользователь';if(!u.role||!ROLES[u.role])u.role='Ученик';saveSession(u);goToApp();}catch(e){showErr(e.message);}finally{$('loginBtn').disabled=false;}}
$('regBtn').onclick=doRegister;$('regPass2').addEventListener('keydown',e=>{if(e.key==='Enter')doRegister();});
async function doRegister(){hideErr();if(markEmpty([$('regName'),$('regEmail'),$('regPass'),$('regPass2')])){showErr('Введите данные!');return;}const p1=$('regPass').value,p2=$('regPass2').value;if(p1.length<6){markEmpty([$('regPass')]);showErr('Пароль минимум 6 символов');return;}if(p1!==p2){markEmpty([$('regPass2')]);showErr('Пароли не совпадают');return;}$('regBtn').disabled=true;try{const res=await jsonp({action:'register',email:$('regEmail').value.trim().toLowerCase(),pass:p1,name:$('regName').value.trim()});if(res.status!=='ok'){showErr(res.message||'Ошибка');return;}const u=res.user||{};if(!u.name)u.name=$('regName').value.trim();if(!u.role||!ROLES[u.role])u.role='Ученик';saveSession(u);goToApp();}catch(e){showErr(e.message);}finally{$('regBtn').disabled=false;}}
function goToApp(){$('authView').classList.add('hidden');$('loader').classList.remove('hidden');setTimeout(()=>{$('loader').classList.add('hidden');$('appView').classList.remove('hidden');applyUserToUI();addCreatorMenu();requestAnimationFrame(()=>{renderPage('home',null);requestAnimationFrame(moveIndicator);});},900);}
function applyUserToUI(){const u=getCurrentUser();let name='Пользователь',role='Ученик';if(u){if(u.name&&u.name.trim())name=u.name.trim();else if(u.email)name=u.email.split('@')[0];role=userRole();}const letter=name.charAt(0).toUpperCase()||'П';$$('[data-user-ava]').forEach(el=>el.textContent=letter);$$('[data-user-name]').forEach(el=>el.textContent=name);$$('[data-user-role]').forEach(el=>{const m=getRoleMeta(role);el.className='role-badge '+m.cls;el.textContent=role;});updateAddBtn();}
function updateAddBtn(){const btn=$('topbarAddBtn');if(!btn)return;btn.classList.toggle('hidden',!(canEditSchedule()&&currentPage==='schedule'));}
function addCreatorMenu(){if(!isCreator())return;const mb=$('menuBox');if(mb&&!mb.querySelector('[data-page="users"]')){const b=document.createElement('button');b.className='menu-item';b.dataset.page='users';b.innerHTML='<span class="msr">admin_panel_settings</span><span class="menu-label">Управление</span>';mb.appendChild(b);b.onclick=()=>renderPage('users');}}
function moveIndicator(){const i=$('menuIndicator'),box=$('menuBox');if(!i||!box)return;const a=box.querySelector('.menu-item.active');if(!a){i.classList.remove('ready');return;}i.style.height=a.offsetHeight+'px';i.style.transform='translateY('+a.offsetTop+'px)';i.style.borderRadius=(parseFloat(getComputedStyle(a).borderRadius)||16)+'px';i.classList.add('ready');}
window.addEventListener('resize',()=>setTimeout(moveIndicator,50));
const MONTHS_NOM=['ЯНВАРЬ','ФЕВРАЛЬ','МАРТ','АПРЕЛЬ','МАЙ','ИЮНЬ','ИЮЛЬ','АВГУСТ','СЕНТЯБРЬ','ОКТЯБРЬ','НОЯБРЬ','ДЕКАБРЬ'];
const MONTHS_GEN=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WEEK_FULL=['ПОНЕДЕЛЬНИК','ВТОРНИК','СРЕДА','ЧЕТВЕРГ','ПЯТНИЦА'];
function isoOfDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function todayISO(){return isoOfDate(new Date());}
function mondayOf(d){const x=new Date(d);x.setHours(0,0,0,0);const day=x.getDay();const diff=(day===0?-6:1-day);x.setDate(x.getDate()+diff);return x;}
function currentMonday(){return mondayOf(new Date(selectedDate+'T00:00:00'));}
function initialDate(){const d=new Date();const dow=d.getDay();if(dow===0)d.setDate(d.getDate()-2);if(dow===6)d.setDate(d.getDate()-1);return isoOfDate(d);}
let selectedDate=initialDate();
function moveWeek(delta){const d=new Date(selectedDate+'T00:00:00');d.setDate(d.getDate()+delta*7);selectedDate=isoOfDate(d);}
function moveDay(delta){const d=new Date(selectedDate+'T00:00:00');do{d.setDate(d.getDate()+delta);}while(d.getDay()===0||d.getDay()===6);selectedDate=isoOfDate(d);}
function moveMonth(delta){const d=new Date(selectedDate+'T00:00:00');d.setMonth(d.getMonth()+delta);while(d.getDay()===0||d.getDay()===6){d.setDate(d.getDate()+(delta>0?1:-1));}selectedDate=isoOfDate(d);}
function setDayOfWeek(idx){const mon=currentMonday();mon.setDate(mon.getDate()+idx);selectedDate=isoOfDate(mon);}
function goToday(){selectedDate=initialDate();}
function dowIdx(iso){const d=new Date(iso+'T00:00:00');const day=d.getDay();return day===0?0:Math.min(day-1,4);}
function weekPanelHTML(){const mon=currentMonday();const activeIdx=dowIdx(selectedDate);const todayIso=todayISO();const monthLabel=MONTHS_NOM[mon.getMonth()]+' '+mon.getFullYear();const days=[];for(let i=0;i<5;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);const iso=isoOfDate(d);const isActive=i===activeIdx;const isToday=iso===todayIso;days.push(`<button class="wp-day ${isActive?'active':''} ${isToday?'today':''}" data-day="${i}"><span class="wp-day-name">${WEEK_FULL[i]}</span></button>`);}const mobileTab=`<div class="wp-mobile"><div class="wp-mobile-tab"><span class="wp-mobile-name">${WEEK_FULL[activeIdx]}</span></div></div>`;return `<div class="week-wrap"><div class="week-panel"><div class="wp-head"><button class="wp-arrow" id="wpPrev"><span class="msr">chevron_left</span></button><div class="wp-title" id="wpTitle"><span class="msr">calendar_month</span><span>${monthLabel}</span></div><button class="wp-today-btn" id="wpToday">Сегодня</button><button class="wp-arrow" id="wpNext"><span class="msr">chevron_right</span></button></div><div class="wp-days">${days.join('')}</div>${mobileTab}</div></div>`;}
function bindWeekPanel(){const prev=$('wpPrev'),next=$('wpNext'),today=$('wpToday'),title=$('wpTitle');const isPhone=window.innerWidth<=820;if(prev)prev.onclick=()=>{isPhone?moveDay(-1):moveWeek(-1);loadPageData(currentPage);};if(next)next.onclick=()=>{isPhone?moveDay(1):moveWeek(1);loadPageData(currentPage);};if(today)today.onclick=()=>{goToday();loadPageData(currentPage);};if(title)title.onclick=(e)=>{moveMonth(e.shiftKey?-1:1);loadPageData(currentPage);};document.querySelectorAll('.wp-day').forEach(b=>{b.onclick=()=>{setDayOfWeek(parseInt(b.dataset.day,10));loadPageData(currentPage);};});}
let cacheLessons=[],cacheHwStatuses={},cacheUsers=[];
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function homeContentHTML(){return `<div class="banner"><div class="banner-title"><span class="conn-dot ok"></span> Добро пожаловать — связь работает</div></div>`;}
function scheduleSkeletonHTML(){let out='<div class="lessons-list">';for(let i=0;i<3;i++){out+=`<div class="lesson-row" style="opacity:.5"><div class="lesson-num">...</div><div class="lesson-info"><div class="lesson-subject">Загрузка...</div></div></div>`;}out+='</div>';return out;}
function scheduleContentHTML(lessons,loading){let list;if(loading){list=scheduleSkeletonHTML();}else if(!lessons||!lessons.length){const canEdit=canEditSchedule();list=`<div class="empty-state"><span class="msr">event_busy</span><h3>Уроков на этот день нет</h3><p>${canEdit?'Нажми кнопку, чтобы добавить урок':'Расписание появится, как только его добавят'}</p>${canEdit?`<button class="empty-add-btn" onclick="openModal(null)"><span class="msr">add</span> Добавить урок</button>`:''}</div>`;}else{list='<div class="lessons-list">'+lessons.map(l=>lessonRowHTML(l,'schedule')).join('')+'</div>';}return weekPanelHTML()+list;}
function homeworkContentHTML(lessons,hwStatuses,loading){if(loading)return weekPanelHTML()+scheduleSkeletonHTML();const withHw=(lessons||[]).filter(l=>l.homework&&l.homework.trim());let list;if(!withHw.length){list=`<div class="empty-state"><span class="msr">menu_book</span><h3>Домашних заданий нет</h3><p>Задания появятся, как только их добавят в расписании</p></div>`;}else{list='<div class="lessons-list">'+withHw.map(l=>lessonRowHTML(l,'homework',hwStatuses)).join('')+'</div>';}return weekPanelHTML()+list;}
function lessonRowHTML(l,mode,hwStatuses){const cls=[];if(l.cancelled)cls.push('cancelled');const meta=[];if(l.time)meta.push(`<span class="meta-item"><span class="msr">schedule</span>${esc(l.time)}</span>`);if(l.room)meta.push(`<span class="meta-item"><span class="msr">meeting_room</span>${esc(l.room)}</span>`);if(l.teacher)meta.push(`<span class="meta-item"><span class="msr">person</span><b>${esc(l.teacher)}</b></span>`);const badges=[];if(l.sor)badges.push(`<span class="sor-badge">СОР</span>`);if(l.soch)badges.push(`<span class="soch-badge">СОЧ</span>`);if(l.cancelled)badges.push(`<span class="role-badge" style="background:#FECACA;color:#991B1B;margin-left:8px">ОТМЕНЁН</span>`);const status=hwStatuses&&hwStatuses[l.id];if(mode==='homework'&&status!==undefined){badges.push(`<span class="role-badge ${status?'student':''}" style="${status?'':'background:#FECACA;color:#991B1B'};margin-left:8px">${status?'СДЕЛАНО':'НЕ СДЕЛАНО'}</span>`);}const badgesHTML=badges.join('');const editBtns=(canEditSchedule()&&mode==='schedule')?`<button class="btn-icon" onclick="editLesson('${l.id}')"><span class="msr">edit</span></button><button class="btn-icon danger" onclick="deleteLesson('${l.id}')"><span class="msr">delete</span></button>`:`<button class="btn-icon" onclick="openView('${l.id}','${mode}')"><span class="msr">visibility</span></button>`;return `<div class="lesson-row ${cls.join(' ')}"><div class="lesson-num">${esc(l.lessonNum||'—')}</div><div class="lesson-info"><div class="lesson-subject">${esc(l.subject||'')}${badgesHTML}</div><div class="lesson-meta">${meta.join('')}</div>${l.homework?`<div style="margin-top:8px;font-size:12.5px;color:#1E293B">📚 ${esc(l.homework)}</div>`:''}</div><div class="lesson-action">${editBtns}</div></div>`;}
function usersContentHTML(){return `<div class="banner"><div class="banner-title">Управление</div></div><div id="usersList">Загрузка...</div>`;}
function diaryContentHTML(){return `<div class="dev-banner"><span class="msr">construction</span><div class="dev-text"><div class="dev-title">В разработке</div><div class="dev-sub">Дневник появится позже</div></div></div>`;}
let currentPage='home',animating=false,scheduleLoading=false,homeworkLoading=false;
function buildPane(key){const pane=document.createElement('div');pane.className='page-pane';pane.dataset.page=key;let html='';if(key==='home')html=homeContentHTML();if(key==='schedule')html=scheduleContentHTML(cacheLessons,scheduleLoading);if(key==='homework')html=homeworkContentHTML(cacheLessons,cacheHwStatuses,homeworkLoading);if(key==='diary')html=diaryContentHTML();if(key==='users')html=usersContentHTML();pane.innerHTML=html;return pane;}
function renderPage(key,direction){const TITLES={home:'Главная',schedule:'Расписание',homework:'Домашние задания',diary:'Дневник',users:'Управление'};const viewport=$('pagesViewport');$$('.menu-item').forEach(b=>b.classList.toggle('active',b.dataset.page===key));$$('.mb-item').forEach(b=>b.classList.toggle('active',b.dataset.page===key));moveIndicator();if(!viewport.firstChild){viewport.appendChild(buildPane(key));if(key==='schedule'||key==='homework')bindWeekPanel();currentPage=key;updateAddBtn();loadPageData(key);$('topbarTitle').innerHTML=`<span class="conn-dot ${$('connDot')?$('connDot').className.split(' ')[1]:'ok'}" id="connDot"></span><span id="connText">${TITLES[key]}</span>`;return;}if(key===currentPage||animating)return;animating=true;const oldPane=viewport.querySelector('.page-pane');const newPane=buildPane(key);viewport.appendChild(newPane);if(key==='schedule'||key==='homework')bindWeekPanel();setTimeout(()=>{if(oldPane&&oldPane.parentNode)oldPane.parentNode.removeChild(oldPane);animating=false;},350);currentPage=key;updateAddBtn();loadPageData(key);$('topbarTitle').innerHTML=`<span class="conn-dot ${$('connDot')?$('connDot').className.split(' ')[1]:'ok'}" id="connDot"></span><span id="connText">${TITLES[key]}</span>`;}
async function loadPageData(key){
  const user=getCurrentUser();if(!user)return;
  if(key==='schedule'||key==='homework'){
    scheduleLoading=true; homeworkLoading=true; refreshCurrentPage();
    try{const res=await jsonp({action:'get_sched',requester:user.email,date:selectedDate},15000);if(res.status==='ok'){cacheLessons=res.lessons||[];if(key==='homework'){const hr=await jsonp({action:'hw_status',requester:user.email},10000);if(hr.status==='ok')cacheHwStatuses=hr.statuses||{};}scheduleLoading=false;homeworkLoading=false;refreshCurrentPage();}}catch(e){scheduleLoading=false;homeworkLoading=false;refreshCurrentPage();}
  }
}
function refreshCurrentPage(){const pane=document.querySelector('.page-pane[data-page="'+currentPage+'"]');if(!pane)return;if(currentPage==='schedule')pane.innerHTML=scheduleContentHTML(cacheLessons,scheduleLoading);if(currentPage==='homework')pane.innerHTML=homeworkContentHTML(cacheLessons,cacheHwStatuses,homeworkLoading);if(currentPage==='schedule'||currentPage==='homework')bindWeekPanel();}
window.openView=function(id,mode){const l=cacheLessons.find(x=>String(x.id)===String(id));if(!l)return;openSidePanel(l);};
function openSidePanel(l){$('spTitle').textContent=l.subject||'—';const parts=[];if(l.date)parts.push(`<div class="sp-section"><div class="sp-label">Дата</div><div class="sp-value">${esc(formatRuDate(l.date))}</div></div>`);if(l.lessonNum)parts.push(`<div class="sp-section"><div class="sp-label">Номер</div><div class="sp-value">${esc(l.lessonNum)}</div></div>`);if(l.time)parts.push(`<div class="sp-section"><div class="sp-label">Время</div><div class="sp-value">${esc(l.time)}</div></div>`);if(l.teacher)parts.push(`<div class="sp-section"><div class="sp-label">Учитель</div><div class="sp-value">${esc(l.teacher)}</div></div>`);if(l.room)parts.push(`<div class="sp-section"><div class="sp-label">Кабинет</div><div class="sp-value">${esc(l.room)}</div></div>`);if(l.sor)parts.push(`<div class="sp-section"><div class="sp-label">СОР</div><div class="sp-value" style="color:#EA580C;font-weight:700">Да</div></div>`);if(l.soch)parts.push(`<div class="sp-section"><div class="sp-label">СОЧ</div><div class="sp-value" style="color:#7C3AED;font-weight:700">Да</div></div>`);if(l.cancelled)parts.push(`<div class="sp-section"><div class="sp-label">Отменен</div><div class="sp-value" style="color:#DC2626;font-weight:700">Да</div></div>`);parts.push(`<div class="sp-section"><div class="sp-label">Домашка</div><div class="sp-value">${l.homework?esc(l.homework):'Нет'}</div></div>`);$('spBody').innerHTML=parts.join('');$('sidePanel').classList.add('open');$('sidePanelBackdrop').classList.add('open');}
$('spClose').onclick=()=>{$('sidePanel').classList.remove('open');$('sidePanelBackdrop').classList.remove('open');};$('sidePanelBackdrop').onclick=()=>{$('sidePanel').classList.remove('open');$('sidePanelBackdrop').classList.remove('open');};
function formatRuDate(iso){const d=new Date(iso+'T00:00:00');return d.getDate()+' '+MONTHS_GEN[d.getMonth()]+' '+d.getFullYear();}
let editingId=null;
window.openModal=function(lesson){if(!canEditSchedule()){showToast('Нет прав');return;}editingId=lesson?lesson.id:null;$('modalTitle').textContent=lesson?'Редактировать урок':'Новый урок';$('mDate').value=lesson?lesson.date:selectedDate;$('mLessonNum').value=lesson?lesson.lessonNum:'';$('mTime').value=lesson?lesson.time:'';$('mSubject').value=lesson?lesson.subject:'';$('mTeacher').value=lesson?lesson.teacher:'';$('mRoom').value=lesson?lesson.room:'';$('mHomework').value=lesson?lesson.homework:'';$('mSor').checked=lesson?!!lesson.sor:false;$('mSoch').checked=lesson?!!lesson.soch:false;$('mCancelled').checked=lesson?!!lesson.cancelled:false;$('modalBackdrop').classList.add('show');};
function closeModal(){$('modalBackdrop').classList.remove('show');editingId=null;}
$('modalClose').onclick=closeModal;$('modalCancel').onclick=closeModal;$('modalBackdrop').onclick=e=>{if(e.target===$('modalBackdrop'))closeModal();};$('topbarAddBtn').onclick=()=>openModal(null);
$('modalSave').onclick=async()=>{
  const user=getCurrentUser();
  const payload={action:'save_sched',requester:user.email,role:userRole(),id:editingId||'',date:$('mDate').value,lessonNum:$('mLessonNum').value,time:$('mTime').value.trim(),subject:$('mSubject').value.trim(),teacher:$('mTeacher').value.trim(),room:$('mRoom').value.trim(),homework:$('mHomework').value.trim(),sor:$('mSor').checked?'true':'false',soch:$('mSoch').checked?'true':'false',cancelled:$('mCancelled').checked?'true':'false'};
  if(!payload.date||!payload.subject){showToast('Заполни дату и предмет');return;}
  $('modalSave').disabled=true; setConn('sync');
  try{const res=await jsonp(payload,20000);if(res.status!=='ok'){showToast(res.message||'Ошибка');setConn('bad');return;}showToast('Сохранено ✓');closeModal();if(payload.date!==selectedDate)selectedDate=payload.date;await loadPageData(currentPage);setConn('ok');}catch(e){showToast(e.message);setConn('bad');}finally{$('modalSave').disabled=false;}
};
window.editLesson=function(id){const l=cacheLessons.find(x=>String(x.id)===String(id));if(l)openModal(l);};
window.deleteLesson=async function(id){if(!confirm('Удалить урок?'))return;const user=getCurrentUser();try{setConn('sync');const res=await jsonp({action:'del_sched',requester:user.email,role:userRole(),id},15000);if(res.status!=='ok'){showToast(res.message||'Ошибка');setConn('bad');return;}showToast('Удалено');await loadPageData(currentPage);setConn('ok');}catch(e){showToast(e.message);setConn('bad');}};
function showToast(m){let t=$('toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#0F172A;color:#fff;padding:10px 18px;border-radius:12px;font-size:13px;font-weight:600;z-index:300;opacity:0;transition:opacity .25s ease;pointer-events:none;';document.body.appendChild(t);}t.textContent=m;t.style.opacity='1';clearTimeout(t._tid);t._tid=setTimeout(()=>{t.style.opacity='0';},2200);}
document.addEventListener('click',(e)=>{const mb=e.target.closest('.menu-item');if(mb&&mb.dataset.page){renderPage(mb.dataset.page);return;}const mbb=e.target.closest('.mb-item');if(mbb&&mbb.dataset.page){renderPage(mbb.dataset.page);return;}});
$$('[data-logout]').forEach(b=>{b.onclick=()=>{clearSession();location.reload();};});
(function init(){
  const s=getSession();
  if(s){$('authView').classList.add('hidden');$('appView').classList.remove('hidden');applyUserToUI();addCreatorMenu();requestAnimationFrame(()=>{renderPage('home',null);requestAnimationFrame(moveIndicator);});setConn('ok');return;}
  requestAnimationFrame(fitFormHeight);
})();
</script>
</body>
</html>
