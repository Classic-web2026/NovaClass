<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>NovaClass</title>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
:root{--section:#F8FAFC;--text:#1E293B;--muted:#64748B;--brand:#0F172A;--accent:#2563EB;--accent-h:#1D4ED8;--border:#E2E8F0;--rc:20px;--ri:14px;--rt:12px;--rb:10px;--shadow:0 4px 6px -1px rgba(0,0,0,.05);--shadow-hover:0 8px 20px -6px rgba(37,99,235,.25);--shadow-lg:0 20px 40px -16px rgba(15,23,42,.2);--gap:20px;--sb-mini:88px;--sb-full:300px}
body{font-family:'Comfortaa',sans-serif;background:var(--section);color:var(--text);font-size:16px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}
.msr{font-family:'Material Symbols Rounded';font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;font-size:26px;display:inline-flex;align-items:center;justify-content:center;color:currentColor;line-height:1;user-select:none;flex-shrink:0}

/* ============ LOADER ============ */
#loader{position:fixed;inset:0;z-index:9999;background:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .55s cubic-bezier(.4,0,.2,1)}
#loader.fade-out{opacity:0;pointer-events:none}
.nova-stage{position:relative;width:180px;height:180px}
.nova-ring{width:100%;height:100%;display:block}
.nova-ring circle{fill:none;stroke-width:12;stroke-linecap:round}
#ringGray{stroke:#E8ECF2}
#ringGrad{stroke:url(#gradArc)}
#ringBlue{stroke:#2563EB;opacity:0}
.nova-bar{margin-top:42px;width:min(420px,80vw);height:14px;display:block}
.nova-bar line{stroke-width:10;stroke-linecap:round}
#barGray{stroke:#E8ECF2}
#barGrad{stroke:url(#gradBar)}
#barBlue{stroke:#2563EB;opacity:0}
.nova-welcome{margin-top:36px;font-size:20px;font-weight:700;color:#2563EB;letter-spacing:.4px;opacity:0;transform:translateY(8px);transition:opacity .5s cubic-bezier(.4,0,.2,1),transform .5s cubic-bezier(.4,0,.2,1)}
.nova-welcome.show{opacity:1;transform:translateY(0)}
@media (max-width:520px){
  .nova-stage{width:140px;height:140px}
  .nova-ring circle{stroke-width:10}
  .nova-bar{margin-top:32px;height:12px}
  .nova-bar line{stroke-width:8}
  .nova-welcome{font-size:17px;margin-top:28px}
}

/* ============ AUTH ============ */
#authView{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:var(--section)}
.card{width:100%;max-width:400px;background:#fff;border:1px solid var(--border);border-radius:var(--rc);padding:28px 28px 26px;box-shadow:var(--shadow);animation:zoom .35s ease both}
@keyframes zoom{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.logo{text-align:center;margin-bottom:20px}
.logo-mark{display:inline-flex;align-items:center;justify-content:center;width:84px;height:84px;border-radius:22px;overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow-hover)}
.logo-mark svg{width:100%;height:100%;display:block}
.logo h1{font-size:19px;font-weight:700;color:var(--brand)}
.tabs{position:relative;display:flex;background:var(--section);border:1px solid var(--border);border-radius:var(--rt);padding:5px;margin-bottom:20px;overflow:hidden}
.tabs .slider{position:absolute;top:5px;left:5px;width:calc(50% - 5px);height:calc(100% - 10px);background:var(--accent);border-radius:var(--rb);transition:transform .4s cubic-bezier(.34,1.4,.64,1);z-index:0;box-shadow:0 4px 12px -4px rgba(37,99,235,.5)}
.tabs[data-active="reg"] .slider{transform:translateX(100%)}
.tab{position:relative;z-index:1;flex:1;padding:11px 8px;border:none;background:transparent;color:var(--muted);font-family:inherit;font-size:13.5px;font-weight:500;cursor:pointer;border-radius:var(--rb);transition:color .3s ease}
.tab.active{color:#fff;font-weight:700}
.tab:active{transform:scale(.97)}
.forms-wrap{position:relative;overflow:hidden;height:0;transition:height .4s cubic-bezier(.4,.1,.2,1)}
.slider-track{display:flex;width:200%;transition:transform .4s cubic-bezier(.4,.1,.2,1);will-change:transform;align-items:flex-start}
.slider-track[data-active="reg"]{transform:translateX(-50%)}
.slide-pane{width:50%;flex-shrink:0;padding:0 2px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:7px;padding-left:2px}
input,textarea,select{width:100%;padding:13px 16px;border:1px solid var(--border);border-radius:var(--ri);background:#fff;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:border-color .2s ease,box-shadow .2s ease}
input::placeholder,textarea::placeholder{color:#94A3B8}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(37,99,235,.12)}
input.error{border-color:#DC2626;box-shadow:0 0 0 4px rgba(220,38,38,.14);animation:shake .5s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
.pass-wrap{position:relative}
.pass-wrap input{padding-right:48px}
.pass-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:none;background:transparent;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;padding:0}
.pass-toggle:hover{background:var(--section);color:var(--accent)}
.pass-toggle .msr{font-size:22px}
.btn{width:100%;padding:13px;border:none;border-radius:var(--ri);background:var(--accent);color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;transition:background .2s ease,transform .15s ease;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--accent-h)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.75;cursor:wait}
.btn-ghost{background:#fff;color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--section)}
.err{background:#FEF2F2;color:#991B1B;border:1px solid #FECACA;border-radius:var(--ri);padding:11px 14px;font-size:13px;margin-bottom:14px;line-height:1.45}
.err code{background:rgba(153,27,27,.1);padding:1px 5px;border-radius:4px;font-size:12px}

/* ============ APP ============ */
#appView{position:fixed;inset:0;z-index:10;background:var(--section)}
.app-layout{display:flex;gap:var(--gap);padding:var(--gap);height:100%;overflow:hidden}
.sidebar{flex-shrink:0;width:var(--sb-mini);background:#fff;border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);padding:20px 14px;display:flex;flex-direction:column;overflow:hidden;transition:width .4s cubic-bezier(.4,.1,.2,1);z-index:30}
.sidebar:hover,.sidebar.open{width:var(--sb-full);box-shadow:var(--shadow-lg)}
.sb-head{display:flex;align-items:center;gap:14px;padding:4px 4px 18px;border-bottom:1px solid var(--border);margin-bottom:14px;min-height:68px;overflow:hidden;white-space:nowrap}
.sb-logo{width:56px;height:56px;border-radius:18px;overflow:hidden;flex-shrink:0;box-shadow:0 10px 24px -10px rgba(37,99,235,.65)}
.sb-logo svg{width:100%;height:100%;display:block}
.sb-name{font-size:17px;font-weight:700;color:var(--brand);letter-spacing:.2px;opacity:0;transform:translateX(-10px);transition:opacity .25s ease .05s,transform .3s ease .05s}
.sidebar:hover .sb-name,.sidebar.open .sb-name{opacity:1;transform:translateX(0)}
.menu{position:relative;display:flex;flex-direction:column;gap:8px}
.menu-indicator{position:absolute;top:0;left:0;right:0;height:0;background:linear-gradient(135deg,#3B82F6 0%,#2563EB 100%);border-radius:16px;box-shadow:0 10px 22px -10px rgba(37,99,235,.75);transition:transform .55s cubic-bezier(.34,1.4,.64,1),height .45s cubic-bezier(.34,1.4,.64,1),opacity .25s ease;pointer-events:none;z-index:0;opacity:0}
.menu-indicator.ready{opacity:1}
.menu-item{position:relative;z-index:1;display:flex;align-items:center;gap:18px;padding:14px 16px;border-radius:16px;border:none;background:transparent;color:var(--text);font-family:inherit;font-size:14.5px;font-weight:500;cursor:pointer;text-align:left;transition:color .35s ease;white-space:nowrap;min-height:56px;overflow:hidden}
.menu-item:hover{background:var(--section)}
.menu-item.active{color:#fff;font-weight:700}
.menu-item.active .msr{color:#fff}
.menu-item .menu-label{opacity:0;transform:translateX(-10px);transition:opacity .25s ease .05s,transform .3s ease .05s}
.sidebar:hover .menu-item .menu-label,.sidebar.open .menu-item .menu-label{opacity:1;transform:translateX(0)}
.sb-foot{margin-top:auto;padding:16px 4px 4px;border-top:1px solid var(--border);display:flex;align-items:center;gap:12px;min-height:72px;overflow:hidden;white-space:nowrap}
.sb-user{display:flex;align-items:center;gap:14px;flex:1;min-width:0}
.sb-ava{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#3B82F6 0%,#2563EB 100%);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex-shrink:0}
.sb-info{min-width:0;flex:1;opacity:0;transform:translateX(-10px);transition:opacity .25s ease .05s,transform .3s ease .05s}
.sidebar:hover .sb-info,.sidebar.open .sb-info{opacity:1;transform:translateX(0)}
.sb-name-u{font-size:13.5px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:4px}
.sb-role{font-size:10.5px}
.sb-logout{width:42px;height:42px;border-radius:14px;border:1px solid var(--border);background:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);flex-shrink:0;opacity:0;transform:translateX(-10px);transition:opacity .25s ease .05s,transform .3s ease .05s}
.sidebar:hover .sb-logout,.sidebar.open .sb-logout{opacity:1;transform:translateX(0)}
.sb-logout:hover{background:#FEF2F2;color:#DC2626}
.content-wrap{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--gap);overflow:hidden}
.topbar{background:#fff;border:1px solid var(--border);border-radius:24px;padding:14px 24px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);flex-shrink:0;min-height:74px}
.topbar-title{font-size:17px;font-weight:700;color:var(--brand);letter-spacing:.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar-right{display:flex;align-items:center;gap:10px;flex-shrink:0;margin-left:auto}
.topbar-add{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:14px;border:none;background:var(--accent);color:#fff;font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;box-shadow:0 8px 18px -8px rgba(37,99,235,.6);transition:background .2s ease,transform .15s ease}
.topbar-add:hover{background:var(--accent-h);transform:translateY(-1px)}
.topbar-add:active{transform:scale(.96)}
.topbar-add .msr{font-size:22px;color:#fff}
.topbar-chip{display:flex;align-items:center;gap:10px;padding:5px 16px 5px 5px;background:var(--section);border:1px solid var(--border);border-radius:999px;font-size:12.5px;font-weight:600;color:var(--text)}
.topbar-chip .user-ava{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#3B82F6 0%,#2563EB 100%);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.topbar-logout{width:42px;height:42px;border-radius:14px;border:1px solid var(--border);background:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);transition:background .2s ease,color .2s ease}
.topbar-logout:hover{background:#FEF2F2;color:#DC2626}
.topbar-logout .msr{font-size:22px}
.pages-viewport{flex:1;min-height:0;position:relative;overflow:hidden;border-radius:24px}
.pages-viewport::before,.pages-viewport::after{content:'';position:absolute;left:0;right:0;height:28px;pointer-events:none;z-index:5}
.pages-viewport::before{top:0;background:linear-gradient(to bottom,#fff 0%,#fff 30%,rgba(255,255,255,0) 100%)}
.pages-viewport::after{bottom:0;background:linear-gradient(to top,#fff 0%,#fff 30%,rgba(255,255,255,0) 100%)}
.page-pane{position:absolute;inset:0;background:#fff;border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);padding:clamp(20px,2.5vw,32px);overflow:auto;animation:paneIn .35s cubic-bezier(.34,1.2,.64,1) both}
@keyframes paneIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.banner{width:100%;border-radius:16px;background:linear-gradient(135deg,#3B82F6 0%,#2563EB 100%);color:#fff;padding:22px 28px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 22px -10px rgba(37,99,235,.6);margin-bottom:22px;min-height:76px}
.banner .msr{font-size:26px;color:#fff}
.banner-title{font-size:clamp(15px,1.5vw,17px);font-weight:700}
.role-badge{display:inline-block;padding:3px 10px;font-size:10px;font-weight:700;border-radius:999px;letter-spacing:.4px;text-transform:uppercase;white-space:nowrap}
.role-badge.student{background:rgba(37,99,235,.12);color:#2563EB}
.role-badge.creator{background:linear-gradient(135deg,#0F172A,#334155);color:#fff}
.role-badge.moderator{background:rgba(16,185,129,.15);color:#059669}
.role-badge.teacher{background:rgba(234,88,12,.15);color:#EA580C}
.role-badge.director{background:rgba(168,85,247,.15);color:#9333EA}
.role-badge.admin{background:rgba(220,38,38,.15);color:#DC2626}
.sor-badge{display:inline-block;padding:3px 10px;font-size:10px;font-weight:700;border-radius:999px;background:rgba(31,158,168,.15);color:#1F9EA8;margin-left:8px;border:1px solid rgba(31,158,168,.35)}
.soch-badge{display:inline-block;padding:3px 10px;font-size:10px;font-weight:700;border-radius:999px;background:rgba(30,136,229,.15);color:#1E88E5;margin-left:8px;border:1px solid rgba(30,136,229,.35)}
.week-wrap{display:flex;flex-direction:column;margin-bottom:18px}
.week-panel{width:100%;border-radius:16px;background:linear-gradient(135deg,#3B82F6 0%,#2563EB 100%);box-shadow:0 10px 22px -10px rgba(37,99,235,.6);display:flex;flex-direction:column;overflow:hidden}
.wp-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 8px}
.wp-title{color:#fff;font-size:14px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;flex:1;text-align:center;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;user-select:none}
.wp-title .msr{font-size:18px;opacity:.85;color:#fff}
.wp-today-btn{color:#fff;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:5px 12px;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;text-transform:uppercase}
.wp-today-btn:hover{background:rgba(255,255,255,.25)}
.wp-arrow{flex-shrink:0;width:40px;height:40px;border-radius:12px;border:none;background:rgba(255,255,255,.1);color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.wp-arrow:hover{background:rgba(255,255,255,.22)}
.wp-arrow .msr{font-size:22px;color:#fff}
.wp-days{display:grid;grid-template-columns:repeat(5,1fr);padding:4px 12px 0 12px;gap:4px}
.wp-day{min-height:60px;border:none;background:transparent;color:#fff;font-family:inherit;cursor:pointer;border-radius:14px 14px 0 0;padding:10px 4px;display:flex;align-items:center;justify-content:center;text-align:center;align-self:flex-end}
.wp-day:hover{background:rgba(255,255,255,.14)}
.wp-day.active{background:#fff;color:var(--accent)}
.wp-day-name{font-size:11.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.wp-day.today .wp-day-name::after{content:'';display:block;width:5px;height:5px;border-radius:50%;background:currentColor;margin:4px auto 0;opacity:.9}
.wp-mobile{display:none;padding:4px 12px 0 12px}
.wp-mobile .wp-mobile-tab{width:100%;min-height:60px;background:#fff;color:var(--accent);border-radius:14px 14px 0 0;font-family:inherit;display:flex;align-items:center;justify-content:center;padding:10px}
.wp-mobile .wp-mobile-name{font-size:13.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
@media (max-width:820px){.wp-days{display:none}.wp-mobile{display:block}}
.lessons-list{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.lesson-row{display:flex;align-items:center;gap:16px;background:#fff;border:1.5px solid var(--border);border-radius:16px;padding:18px 20px;transition:border-color .2s ease,box-shadow .2s ease,transform .15s ease;position:relative;animation:rowIn .35s cubic-bezier(.34,1.2,.64,1) both}
.lesson-row:hover{border-color:rgba(37,99,235,.35);transform:translateY(-1px)}
.lesson-row.cancelled{border-color:#FECACA;background:#FEF2F2;opacity:.92}
.lesson-num{flex-shrink:0;width:60px;height:60px;border-radius:16px;background:rgba(37,99,235,.08);border:2px solid var(--accent);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:22px}
.lesson-info{flex:1;min-width:0}
.lesson-subject{font-size:15.5px;font-weight:700;color:var(--brand);margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lesson-meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12.5px;color:var(--muted)}
.lesson-meta .meta-item{display:inline-flex;align-items:center;gap:5px}
.lesson-meta .meta-item .msr{font-size:16px;color:var(--muted)}
.lesson-action{flex-shrink:0;display:flex;gap:8px;align-items:center}
.btn-icon{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:#fff;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.btn-icon:hover{background:var(--section);color:var(--accent)}
.btn-icon.danger:hover{background:#FEF2F2;color:#DC2626}
.btn-icon.primary{color:var(--accent);border-color:rgba(37,99,235,.3)}
.btn-icon.primary:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-icon .msr{font-size:20px}
.empty-state{padding:60px 24px;text-align:center;color:var(--muted);background:#fff;border:1px solid var(--border);border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:14px}
.empty-state .msr{font-size:54px;color:#CBD5E1;display:block}
.empty-state h3{font-size:15px;font-weight:700;color:var(--brand);margin-bottom:2px}
.empty-state p{font-size:13px;max-width:340px;margin:0 auto}
.empty-add-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:14px;border:none;background:var(--accent);color:#fff;font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer}
.empty-add-btn:hover{background:var(--accent-h)}
.empty-add-btn .msr{font-size:22px;color:#fff}
.users-list{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.user-row{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px 16px}
.user-row:hover{background:var(--section)}
.u-ava{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#3B82F6,#2563EB);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0}
.u-info{flex:1;min-width:0}
.u-name{font-size:14px;font-weight:700;color:var(--text);margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.u-email{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.u-role select{font-family:inherit;font-size:12px;font-weight:700;padding:9px 12px;border-radius:10px;border:1px solid var(--border);background:#fff;color:var(--text);outline:none;cursor:pointer}
@keyframes rowIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.side-panel-backdrop{position:fixed;inset:0;z-index:80;background:rgba(15,23,42,.45);opacity:0;pointer-events:none;transition:opacity .3s ease}
.side-panel-backdrop.open{opacity:1;pointer-events:auto}
.side-panel{position:fixed;top:20px;right:20px;bottom:20px;width:min(440px,calc(100vw - 40px));background:#fff;border-radius:22px;box-shadow:0 24px 60px -16px rgba(15,23,42,.3);z-index:90;padding:26px;display:flex;flex-direction:column;transform:translateX(calc(100% + 40px));transition:transform .35s cubic-bezier(.4,.1,.2,1);overflow:hidden}
.side-panel.open{transform:translateX(0)}
.sp-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding-bottom:18px;border-bottom:1px solid var(--border);margin-bottom:20px}
.sp-title{font-size:18px;font-weight:700;color:var(--brand);line-height:1.25}
.sp-close{width:38px;height:38px;border-radius:12px;border:1px solid var(--border);background:#fff;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.sp-close:hover{background:var(--section);color:var(--text)}
.sp-close .msr{font-size:22px}
.sp-body{flex:1;overflow-y:auto;padding-right:4px}
.sp-section{margin-bottom:20px}
.sp-label{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.sp-value{font-size:14.5px;color:var(--text);line-height:1.5;white-space:pre-wrap}
.modal-backdrop{position:fixed;inset:0;z-index:100;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:16px;opacity:0;transition:opacity .25s ease;backdrop-filter:blur(4px)}
.modal-backdrop.show{display:flex;opacity:1}
.modal{width:100%;max-width:540px;background:#fff;border-radius:22px;box-shadow:0 24px 60px -16px rgba(15,23,42,.35);max-height:92vh;overflow-y:auto}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:22px 26px 18px;border-bottom:1px solid var(--border)}
.modal-title{font-size:17px;font-weight:700;color:var(--brand)}
.modal-close{width:38px;height:38px;border-radius:12px;border:1px solid var(--border);background:#fff;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.modal-close:hover{background:var(--section);color:var(--text)}
.modal-close .msr{font-size:22px}
.modal-body{padding:22px 26px}
.modal-body .field{margin-bottom:16px}
.modal-body .field:last-child{margin-bottom:0}
.modal-body .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.modal-body textarea{min-height:100px;resize:vertical;font-family:inherit;line-height:1.5}
.modal-foot{display:flex;gap:10px;padding:18px 26px 24px;border-top:1px solid var(--border)}
.modal-foot .btn{margin-top:0;flex:1}
.check-field{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1.5px dashed var(--border);border-radius:14px;background:var(--section);cursor:pointer;font-size:13.5px;font-weight:600;margin-bottom:10px}
.check-field:hover{border-color:var(--accent)}
.check-field input[type=checkbox]{width:22px;height:22px;margin:0;flex-shrink:0;accent-color:var(--accent);cursor:pointer;padding:0;border-radius:6px}
.check-field .check-text{flex:1;min-width:0}
.check-field .check-hint{font-size:11px;color:var(--muted);font-weight:500;margin-top:2px}
.check-field.danger:hover{border-color:#DC2626}
.check-field.danger input[type=checkbox]{accent-color:#DC2626}
.check-field.sor:hover{border-color:#1F9EA8}
.check-field.sor input[type=checkbox]{accent-color:#1F9EA8}
.check-field.soch:hover{border-color:#1E88E5}
.check-field.soch input[type=checkbox]{accent-color:#1E88E5}
.mobile-bottom{position:fixed;left:10px;right:10px;bottom:10px;height:68px;background:#fff;border:1px solid var(--border);border-radius:22px;box-shadow:0 -6px 24px -8px rgba(15,23,42,.15);display:none;align-items:center;padding:6px 8px;gap:4px;z-index:45}
.mb-item{flex:1;height:56px;border:none;background:transparent;border-radius:16px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);transition:background .25s ease,color .25s ease}
.mb-item .msr{font-size:26px}
.mb-item.active{background:linear-gradient(135deg,#3B82F6 0%,#2563EB 100%);color:#fff}
@media (max-width:640px){
  .sidebar{display:none}
  .mobile-bottom{display:flex}
  .app-layout{padding:10px 10px 88px;gap:10px}
  .topbar{border-radius:18px;padding:10px 14px;gap:10px;min-height:60px}
  .topbar-title{font-size:15px}
  .topbar-chip .user-name{display:none}
  .page-pane{border-radius:18px;padding:14px}
  .lesson-row{padding:14px;gap:12px;flex-wrap:wrap}
  .lesson-num{width:52px;height:52px;font-size:19px}
  .lesson-info{flex:1 1 calc(100% - 64px)}
  .lesson-action{width:100%;justify-content:flex-end}
  .side-panel{top:10px;right:10px;bottom:10px;width:calc(100vw - 20px);padding:20px;border-radius:18px}
  .modal-head,.modal-body,.modal-foot{padding-left:18px;padding-right:18px}
  .modal-body .grid-2{grid-template-columns:1fr}
}
#toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);background:#0F172A;color:#fff;padding:12px 20px;border-radius:12px;font-size:13px;font-weight:600;z-index:300;opacity:0;transition:opacity .25s ease,transform .25s ease;pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 10px 30px -10px rgba(15,23,42,.5)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ CUSTOM SELECT ============ */
.cs-wrap{position:relative;width:100%}
.cs-input{width:100%;padding:13px 44px 13px 16px;border:1px solid var(--border);border-radius:var(--ri);background:#fff;color:var(--text);font-family:inherit;font-size:14px;outline:none;cursor:pointer;text-align:left;transition:border-color .2s ease,box-shadow .2s ease}
.cs-input:hover{border-color:#CBD5E1}

.cs-input.error{border-color:#DC2626;box-shadow:0 0 0 4px rgba(220,38,38,.14);animation:shake .5s cubic-bezier(.36,.07,.19,.97) both}
.cs-input.placeholder{color:#94A3B8}
.cs-arrow{position:absolute;right:14px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted);transition:transform .25s ease}
.cs-wrap.open .cs-arrow{transform:translateY(-50%) rotate(180deg);color:var(--accent)}
.cs-arrow .msr{font-size:20px}
.cs-panel{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 20px 40px -16px rgba(15,23,42,.25);z-index:200;max-height:320px;overflow:hidden;display:none;flex-direction:column;animation:csIn .18s ease both}
@keyframes csIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.cs-wrap.open .cs-panel{display:flex}
.cs-search{padding:8px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:#fff}
.cs-search .msr{font-size:18px;color:var(--muted)}
.cs-search input{border:none;outline:none;padding:8px 4px;font-size:13.5px;flex:1;box-shadow:none!important}
.cs-list{overflow-y:auto;padding:6px;flex:1;scrollbar-width:thin;max-height:240px}
.cs-list::-webkit-scrollbar{width:6px}
.cs-list::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:3px}
.cs-option{padding:11px 14px;font-size:14px;color:var(--text);border-radius:10px;cursor:pointer;line-height:1.35;transition:background .15s ease;display:flex;align-items:center;gap:8px}
.cs-option .cs-opt-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.cs-option:hover,.cs-option.hl{background:#EFF6FF;color:var(--accent)}
.cs-option.selected{background:var(--accent);color:#fff;font-weight:600}
.cs-option .cs-del{width:24px;height:24px;border-radius:8px;border:none;background:transparent;color:currentColor;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;opacity:.5;flex-shrink:0}
.cs-option .cs-del:hover{opacity:1;background:rgba(220,38,38,.15);color:#DC2626}
.cs-option.selected .cs-del:hover{background:rgba(255,255,255,.25);color:#fff}
.cs-option .cs-del .msr{font-size:18px}
.cs-add{padding:11px 14px;font-size:13.5px;color:var(--accent);border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:700;border:1.5px dashed rgba(37,99,235,.4);margin:6px;background:#F0F7FF}

const CUSTOM_REFS_KEY = 'nc_custom_refs_v1';

function getCustomRefs(){
  try{
    const raw = localStorage.getItem(CUSTOM_REFS_KEY);
    if(!raw) return { lessonNum:[], time:[], subject:[], teacher:[], room:[] };
    const o = JSON.parse(raw);
    return {
      lessonNum: Array.isArray(o.lessonNum) ? o.lessonNum : [],
      time:      Array.isArray(o.time)      ? o.time      : [],
      subject:   Array.isArray(o.subject)   ? o.subject   : [],
      teacher:   Array.isArray(o.teacher)   ? o.teacher   : [],
      room:      Array.isArray(o.room)      ? o.room      : []
    };
  }catch(e){ return { lessonNum:[], time:[], subject:[], teacher:[], room:[] }; }
}
function saveCustomRefs(o){ try{ localStorage.setItem(CUSTOM_REFS_KEY, JSON.stringify(o)); }catch(e){} }

function normKey(s){ return String(s||'').trim().toLowerCase(); }
function contains(list, v){ const k = normKey(v); return list.some(x => normKey(x) === k); }

function mergeRefs(base, custom){
  const seen = new Set();
  const out = [];
  (base||[]).forEach(v=>{
    const k = normKey(v); if(!k || seen.has(k)) return;
    seen.add(k); out.push(v);
  });
  (custom||[]).forEach(v=>{
    const k = normKey(v); if(!k || seen.has(k)) return;
    seen.add(k); out.push(v);
  });
  return out;
}

function rememberValue(kind, value){
  const v = String(value||'').trim();
  if(!v) return;
  const refs = getCustomRefs();
  if(!refs[kind]) refs[kind] = [];
  if(contains(refs[kind], v)) return;
  // Не добавляем если значение уже есть в базовом списке (не дублируем)
  const baseMap = { lessonNum:REF_LESSON_NUMS, time:REF_TIMES, subject:REF_SUBJECTS, teacher:REF_TEACHERS, room:REF_ROOMS };
  if(baseMap[kind] && contains(baseMap[kind], v)) return;
  refs[kind].push(v);
  saveCustomRefs(refs);
}

function forgetValue(kind, value){
  const refs = getCustomRefs();
  if(!refs[kind]) return;
  refs[kind] = refs[kind].filter(x => normKey(x) !== normKey(value));
  saveCustomRefs(refs);
}

function isCustomValue(kind, value){
  const baseMap = { lessonNum:REF_LESSON_NUMS, time:REF_TIMES, subject:REF_SUBJECTS, teacher:REF_TEACHERS, room:REF_ROOMS };
  const base = baseMap[kind] || [];
  return !contains(base, value);
}

const CustomSelect = (function(){
  function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function init(wrap, options, opts){
    opts = opts || {};
    const kind = wrap.dataset.kind || '';
    const toggle = wrap.querySelector('[data-cs-toggle]');
    const search = wrap.querySelector('[data-cs-search]');
    const list = wrap.querySelector('[data-cs-list]');
    const panel = wrap.querySelector('.cs-panel');
    let allOptions = (options||[]).slice();
    let filtered = allOptions.slice();
    let hlIndex = -1;

    function isCustom(v){
      return kind ? isCustomValue(kind, v) : false;
    }

    function renderList(){
      const cur = wrap.dataset.value || '';
      const q = search ? search.value.trim() : '';
      let html = '';

      // Строка "Добавить «...»"
      if(q && !filtered.some(v => normKey(v) === normKey(q))){
        html += `<div class="cs-add" data-cs-add="1"><span class="msr">add_circle</span>Добавить «<b>${esc(q)}</b>»</div>`;
      }

      if(!filtered.length && !q){
        html += '<div class="cs-empty">Ничего не найдено</div>';
      } else {
        html += filtered.map((v,i)=>{
          const custom = isCustom(v);
          return `<div class="cs-option ${v===cur?'selected':''} ${i===hlIndex?'hl':''}" data-val="${esc(v)}">
            <span class="cs-opt-label">${esc(v)}</span>
            ${custom ? `<button class="cs-del" data-cs-del="1" title="Удалить из моих"><span class="msr">delete</span></button>` : ''}
          </div>`;
        }).join('');
      }
      list.innerHTML = html;
    }

    function open(){
      document.querySelectorAll('.cs-wrap.open').forEach(w=>{ if(w!==wrap) close(w); });
      wrap.classList.add('open');
      const rect = wrap.getBoundingClientRect();
      const spaceBelow = window.innerHeight - rect.bottom;
      panel.classList.toggle('up', spaceBelow < 320 && rect.top > 320);
      if(search){ search.value=''; filtered = allOptions.slice(); hlIndex=-1; renderList(); setTimeout(()=>search.focus(), 30); }
    }
    function close(w){ (w||wrap).classList.remove('open'); }

    toggle.addEventListener('click', e=>{ e.stopPropagation(); wrap.classList.contains('open') ? close() : open(); });

    if(search){
      search.addEventListener('input', ()=>{
        const q = search.value.trim().toLowerCase();
        filtered = !q ? allOptions.slice() : allOptions.filter(v => v.toLowerCase().includes(q));
        hlIndex = -1;
        renderList();
      });
      search.addEventListener('keydown', e=>{
        if(e.key==='ArrowDown'){ e.preventDefault(); hlIndex = Math.min(hlIndex+1, filtered.length-1); renderList(); scrollHl(); }
        else if(e.key==='ArrowUp'){ e.preventDefault(); hlIndex = Math.max(hlIndex-1, 0); renderList(); scrollHl(); }
        else if(e.key==='Enter'){
          e.preventDefault();
          const q = search.value.trim();
          if(hlIndex>=0 && filtered[hlIndex]) setValue(filtered[hlIndex]);
          else if(filtered.length) setValue(filtered[0]);
          else if(q) addAndSelect(q);
        }
        else if(e.key==='Escape'){ close(); }
      });
    }
    function scrollHl(){ const el = list.querySelector('.cs-option.hl'); if(el) el.scrollIntoView({block:'nearest'}); }

    list.addEventListener('click', e=>{
      const delBtn = e.target.closest('[data-cs-del]');
      if(delBtn){
        e.stopPropagation();
        const opt = delBtn.closest('.cs-option');
        const v = opt.dataset.val;
        if(!confirm('Удалить «'+v+'» из моих значений?')) return;
        forgetValue(kind, v);
        allOptions = allOptions.filter(x => normKey(x) !== normKey(v));
        filtered = filtered.filter(x => normKey(x) !== normKey(v));
        renderList();
        showToast('Удалено из моих');
        return;
      }
      const addBtn = e.target.closest('[data-cs-add]');
      if(addBtn){
        e.stopPropagation();
        const q = search.value.trim();
        if(q) addAndSelect(q);
        return;
      }
      const opt = e.target.closest('.cs-option');
      if(!opt) return;
      setValue(opt.dataset.val);
    });

    function addAndSelect(v){
      rememberValue(kind, v);
      if(!allOptions.some(x => normKey(x) === normKey(v))) allOptions.push(v);
      filtered = allOptions.slice();
      setValue(v);
    }

    function setValue(v){
      wrap.dataset.value = v;
      toggle.textContent = v;
      toggle.classList.remove('placeholder','error');
      wrap.dispatchEvent(new CustomEvent('cs-change', {detail:v}));
      close();
    }
    function setSilent(v){
      wrap.dataset.value = v || '';
      if(v){ toggle.textContent = v; toggle.classList.remove('placeholder'); }
      else { toggle.textContent = opts.placeholder || 'Выберите'; toggle.classList.add('placeholder'); }
    }
    function markError(){
      toggle.classList.remove('error'); void toggle.offsetWidth; toggle.classList.add('error');
    }
    function setOptions(newOptions){
      allOptions = (newOptions||[]).slice();
      const q = search ? search.value.trim().toLowerCase() : '';
      filtered = !q ? allOptions.slice() : allOptions.filter(v => v.toLowerCase().includes(q));
      hlIndex = -1;
      renderList();
    }
    function refresh(){ setOptions(allOptions); }

    document.addEventListener('click', e=>{ if(!wrap.contains(e.target)) close(); });

    renderList();
    wrap._cs = {
      setValue, setSilent, markError, open, close, setOptions, refresh,
      get value(){ return wrap.dataset.value; },
      get options(){ return allOptions.slice(); }
    };
  }
  return { init };
})();

/* =========================================================
   LOADER
   ========================================================= */
const NovaLoader = (function(){
  const T1=1400,T2=350,T3=180,T4=1400,T5=350,T6=700,T7=900;
  const TOTAL=T1+T2+T3+T4+T5+T6+T7;
  const CIRC=452.39, BLEN=404;
  let raf=null,t0=0,running=false;
  const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
  function frame(now){
    if(!running) return;
    const t = now - t0;
    const rg=$('ringGray'), rgr=$('ringGrad'), rb=$('ringBlue');
    const bg=$('barGray'), bgr=$('barGrad'), bb=$('barBlue');
    const w=$('welcomeText');
    if(!rg||!rgr||!bg||!bgr) return;
    if(t<T1){
      const p=ease(t/T1);
      rg.setAttribute('stroke-dasharray',CIRC+' '+CIRC); rg.style.opacity='1';
      rgr.setAttribute('stroke-dasharray',(CIRC*p)+' '+CIRC); rgr.style.opacity='1';
      rb.style.opacity='0';
      bg.setAttribute('stroke-dasharray',BLEN+' '+BLEN); bg.style.opacity='1';
      bgr.setAttribute('stroke-dasharray','0 '+BLEN); bb.style.opacity='0';
      if(w) w.classList.remove('show');
    } else if(t<T1+T2){
      const p=(t-T1)/T2;
      rg.style.opacity='0';
      rgr.setAttribute('stroke-dasharray',CIRC+' '+CIRC);
      rb.setAttribute('stroke-dasharray',CIRC+' '+CIRC);
      rgr.style.opacity=(1-p)+'';
      rb.style.opacity=p+'';
    } else if(t<T1+T2+T3){
      rgr.style.opacity='0'; rb.style.opacity='1';
    } else if(t<T1+T2+T3+T4){
      const p=ease((t-T1-T2-T3)/T4);
      bg.setAttribute('stroke-dasharray',BLEN+' '+BLEN); bg.style.opacity='1';
      bgr.setAttribute('stroke-dasharray',(BLEN*p)+' '+BLEN); bgr.style.opacity='1';
      bb.style.opacity='0';
    } else if(t<T1+T2+T3+T4+T5){
      const p=(t-T1-T2-T3-T4)/T5;
      bg.style.opacity='0';
      bgr.setAttribute('stroke-dasharray',BLEN+' '+BLEN);
      bb.setAttribute('stroke-dasharray',BLEN+' '+BLEN);
      bgr.style.opacity=(1-p)+'';
      bb.style.opacity=p+'';
    } else if(t<TOTAL-T7){
      bgr.style.opacity='0'; bb.style.opacity='1';
      if(w) w.classList.add('show');
    } else if(t<TOTAL){}
    else { running=false; return; }
    raf=requestAnimationFrame(frame);
  }
  function start(){ running=true; t0=performance.now(); raf=requestAnimationFrame(frame); }
  function stop(){ running=false; if(raf) cancelAnimationFrame(raf); }
  return { start, stop, DURATION: TOTAL };
})();
function showLoader(){ const l=$('loader'); if(!l) return; l.classList.remove('hidden','fade-out'); NovaLoader.start(); }
function hideLoader(){ const l=$('loader'); if(!l) return; NovaLoader.stop(); l.classList.add('fade-out'); setTimeout(()=>{ l.classList.add('hidden'); l.classList.remove('fade-out'); }, 550); }

/* =========================================================

   ========================================================= */
function jsonp(params, timeout){
  return new Promise((resolve,reject)=>{
    const cbName='nc_cb_'+(++jsonpCounter)+'_'+Date.now();
    let finished=false, script, to;
    const cleanup=()=>{ try{ delete window[cbName]; }catch(e){} if(script&&script.parentNode) script.parentNode.removeChild(script); clearTimeout(to); };
    window[cbName]=function(data){ if(finished) return; finished=true; cleanup(); resolve(data); };
    const qs=new URLSearchParams(Object.assign({}, params, {callback:cbName})).toString();
    script=document.createElement('script');
    script.src=GAS_URL+'?'+qs+'&_='+Date.now();
    script.onerror=function(){ if(finished) return; finished=true; cleanup(); reject(new Error('Нет связи с сервером')); };
    document.head.appendChild(script);
    to=setTimeout(()=>{ if(finished) return; finished=true; cleanup(); reject(new Error('Превышено время ожидания')); }, timeout||20000);
  });
}

/* =========================================================

   ========================================================= */
function normDate(v){
  if(!v) return '';
  const s=String(v).trim();
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return m[1]+'-'+m[2]+'-'+m[3];
  m=s.match(/^(\d{1,2})[./](\d{1,2})[./](\d{4})/);
  if(m) return m[3]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0');
  const d=new Date(s);
  if(!isNaN(d.getTime())) return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  return s.slice(0,10);
}
function isoOfDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayISO(){ return isoOfDate(new Date()); }
function mondayOf(d){ const x=new Date(d); x.setHours(0,0,0,0); const day=x.getDay(); const diff=(day===0?-6:1-day); x.setDate(x.getDate()+diff); return x; }
function currentMonday(){ return mondayOf(new Date(selectedDate+'T00:00:00')); }
function initialDate(){ const d=new Date(); const dow=d.getDay(); if(dow===0) d.setDate(d.getDate()-2); if(dow===6) d.setDate(d.getDate()-1); return isoOfDate(d); }
function moveWeek(delta){ const d=new Date(selectedDate+'T00:00:00'); d.setDate(d.getDate()+delta*7); selectedDate=isoOfDate(d); }
function moveDay(delta){ const d=new Date(selectedDate+'T00:00:00'); do{ d.setDate(d.getDate()+delta); }while(d.getDay()===0||d.getDay()===6); selectedDate=isoOfDate(d); }
function moveMonth(delta){ const d=new Date(selectedDate+'T00:00:00'); d.setMonth(d.getMonth()+delta); while(d.getDay()===0||d.getDay()===6){ d.setDate(d.getDate()+(delta>0?1:-1)); } selectedDate=isoOfDate(d); }
function setDayOfWeek(idx){ const mon=currentMonday(); mon.setDate(mon.getDate()+idx); selectedDate=isoOfDate(mon); }
function goToday(){ selectedDate=initialDate(); }
function dowIdx(iso){ const d=new Date(iso+'T00:00:00'); const day=d.getDay(); return day===0?0:Math.min(day-1,4); }
function formatRuDate(iso){ const d=new Date(iso+'T00:00:00'); return d.getDate()+' '+MONTHS_GEN[d.getMonth()]+' '+d.getFullYear(); }
function esc(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function filterByDate(lessons, date){ return (lessons||[]).filter(l => normDate(l.date) === date); }

const MONTHS_GEN=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

   ПРЕДЗАГРУЗКА
   ========================================================= */
async function prefetchAll(user){
  if(!user||!user.email) return;
  const mon = mondayOf(new Date(selectedDate+'T00:00:00'));
  const dates=[];
  for(let i=0;i<5;i++){ const d=new Date(mon); d.setDate(mon.getDate()+i); dates.push(isoOfDate(d)); }
  const jobs = dates.map(date =>
    jsonp({action:'get_sched', requester:user.email, date}, 12000)
      .then(res => { if(res && res.status==='ok') prefetched.scheduleByDate[date] = filterByDate(res.lessons, date); })
      .catch(()=>{})
  );
  jobs.push(jsonp({action:'hw_status', requester:user.email}, 10000).then(hr => { if(hr && hr.status==='ok') prefetched.hwStatuses = hr.statuses || {}; }).catch(()=>{}));
  if(isAdmin()){
    jobs.push(jsonp({action:'users_list', requester:user.email}, 10000).then(ur => { if(ur && ur.status==='ok') prefetched.users = ur.users || []; }).catch(()=>{}));
  }
  await Promise.all(jobs);
  updateCacheFromPrefetched();
}

async function doLogin(){
  hideErr();
  if(markEmpty([$('loginEmail'), $('loginPass')])){ showErr('Введите данные'); return; }
  $('loginBtn').disabled=true;
  const email = $('loginEmail').value.trim().toLowerCase();
  const pass  = $('loginPass').value;
  try{
    showLoader();
    const res = await jsonp({action:'login', email, pass});
    if(!res){ hideLoader(); showErr('Пустой ответ'); return; }
    if(res.status !== 'ok'){ hideLoader(); showErr(res.message||'Ошибка входа'); return; }
    const u=res.user||{};
    if(!u.name) u.name=u.email?u.email.split('@')[0]:'Пользователь';
    if(!u.role||!ROLES[u.role]) u.role='Ученик';
    if(String(u.email||'').toLowerCase()===CREATOR_EMAIL.toLowerCase()) u.role='Создатель';
    saveSession(u);
    hydrateFromCache();
    if(prefetched.scheduleByDate[selectedDate]) cacheLessons = prefetched.scheduleByDate[selectedDate];
    await new Promise(r=>setTimeout(r, 3200));
    hideLoader();
    await enterApp();
    prefetchAll(u).then(()=>{
      if(prefetched.scheduleByDate[selectedDate]) cacheLessons = prefetched.scheduleByDate[selectedDate];
      if(currentPage==='schedule'||currentPage==='homework') refreshCurrentPage();
    });
  }catch(e){ hideLoader(); showErr('Ошибка связи: '+e.message); }
  finally{ $('loginBtn').disabled=false; }
}
async function doRegister(){
  hideErr();
  if(markEmpty([$('regName'), $('regEmail'), $('regPass'), $('regPass2')])){ showErr('Введите данные'); return; }
  const p1=$('regPass').value, p2=$('regPass2').value;
  if(p1.length<6){ markEmpty([$('regPass')]); showErr('Пароль минимум 6 символов'); return; }
  if(p1!==p2){ markEmpty([$('regPass2')]); showErr('Пароли не совпадают'); return; }
  $('regBtn').disabled=true;
  const email = $('regEmail').value.trim().toLowerCase();
  const name  = $('regName').value.trim();
  try{
    showLoader();
    const res=await jsonp({action:'register', email, pass:p1, name});
    if(!res){ hideLoader(); showErr('Пустой ответ'); return; }
    if(res.status!=='ok'){ hideLoader(); showErr(res.message||'Ошибка регистрации'); return; }
    const u=res.user||{};
    if(!u.name) u.name=name;
    if(!u.role||!ROLES[u.role]) u.role='Ученик';
    if(String(u.email||'').toLowerCase()===CREATOR_EMAIL.toLowerCase()) u.role='Создатель';
    saveSession(u);
    clearCache();
    await new Promise(r=>setTimeout(r, 3200));
    hideLoader();
    await enterApp();
    prefetchAll(u).then(()=>{ if(currentPage==='schedule'||currentPage==='homework') refreshCurrentPage(); });
  }catch(e){ hideLoader(); showErr('Ошибка связи: '+e.message); }
  finally{ $('regBtn').disabled=false; }
}
async function enterApp(){
  $('authView').classList.add('hidden');
  $('appView').classList.remove('hidden');
  applyUserToUI(); addCreatorMenu(); renderPage('home');
  requestAnimationFrame(moveIndicator);
}

function applyUserToUI(){
  const u=getCurrentUser(); let name='Пользователь', role='Ученик';
  if(u){ if(u.name&&u.name.trim()) name=u.name.trim(); else if(u.email) name=u.email.split('@')[0]; role=userRole(); }
  const letter=name.charAt(0).toUpperCase()||'П';
  $$('[data-user-ava]').forEach(el=>el.textContent=letter);
  $$('[data-user-name]').forEach(el=>el.textContent=name);
  $$('[data-user-role]').forEach(el=>{ el.className='role-badge '+(ROLES[role]||'student'); el.textContent=role; });
  updateAddBtn();
}
function updateAddBtn(){ const btn=$('topbarAddBtn'); if(!btn) return; btn.classList.toggle('hidden', !(canEditSchedule()&&currentPage==='schedule')); }
function addCreatorMenu(){
  if(!isCreator()) return;
  const mb=$('menuBox');
  if(mb&&!mb.querySelector('[data-page="users"]')){
    const b=document.createElement('button');
    b.className='menu-item'; b.dataset.page='users';
    b.innerHTML='<span class="msr">admin_panel_settings</span><span class="menu-label">Управление</span>';
    mb.appendChild(b);
  }
}
function moveIndicator(){
  const i=$('menuIndicator'), box=$('menuBox'); if(!i||!box) return;
  const a=box.querySelector('.menu-item.active');
  if(!a){ i.classList.remove('ready'); return; }
  i.style.height=a.offsetHeight+'px';
  i.style.transform='translateY('+a.offsetTop+'px)';
  i.style.borderRadius=(parseFloat(getComputedStyle(a).borderRadius)||16)+'px';
  i.classList.add('ready');
}
window.addEventListener('resize', ()=>setTimeout(moveIndicator,50));

function scheduleContentHTML(lessons){

    list='<div class="lessons-list">'+lessons.map(l=>lessonRowHTML(l,'schedule')).join('')+'</div>';

function homeworkContentHTML(lessons, hwStatuses){
  const withHw=(lessons||[]).filter(l=>l.homework&&l.homework.trim());
  let list;
  if(!withHw.length){
    list=`<div class="empty-state"><span class="msr">menu_book</span><h3>Домашних заданий нет</h3><p>Задания появятся, как только их добавят в расписании</p></div>`;
  } else {
    list='<div class="lessons-list">'+withHw.map(l=>lessonRowHTML(l,'homework',hwStatuses)).join('')+'</div>';
  }
  return weekPanelHTML()+list;
}
function lessonRowHTML(l, mode, hwStatuses){
  const cls=[]; if(l.cancelled) cls.push('cancelled');
  const meta=[];
  if(l.time) meta.push(`<span class="meta-item"><span class="msr">schedule</span>${esc(l.time)}</span>`);
  if(l.room) meta.push(`<span class="meta-item"><span class="msr">meeting_room</span>${esc(l.room)}</span>`);
  if(l.teacher) meta.push(`<span class="meta-item"><span class="msr">person</span><b>${esc(l.teacher)}</b></span>`);
  const badges=[];
  if(l.sor) badges.push(`<span class="sor-badge">СОР</span>`);
  if(l.soch) badges.push(`<span class="soch-badge">СОЧ</span>`);
  if(l.cancelled) badges.push(`<span class="role-badge" style="background:#FECACA;color:#991B1B;margin-left:8px">ОТМЕНЁН</span>`);
  const status=hwStatuses&&hwStatuses[l.id];
  if(mode==='homework'&&status!==undefined){
    badges.push(`<span class="role-badge" style="${status?'background:rgba(16,185,129,.15);color:#059669':'background:#FECACA;color:#991B1B'};margin-left:8px">${status?'СДЕЛАНО':'НЕ СДЕЛАНО'}</span>`);
  }
  const hwIcon = l.homework ? `<div style="margin-top:8px;font-size:12.5px;color:#1E293B;display:flex;align-items:flex-start;gap:6px;line-height:1.4"><span class="msr" style="font-size:16px;color:#2563EB;flex-shrink:0">menu_book</span><span>${esc(l.homework)}</span></div>` : '';
  const editBtns=(canEditSchedule()&&mode==='schedule')
    ? `<button class="btn-icon" onclick="editLesson('${l.id}')"><span class="msr">edit</span></button><button class="btn-icon danger" onclick="deleteLesson('${l.id}')"><span class="msr">delete</span></button>`
    : `<button class="btn-icon primary" onclick="openView('${l.id}','${mode}')"><span class="msr">visibility</span></button>`;
  return `<div class="lesson-row ${cls.join(' ')}">
    <div class="lesson-num">${esc(l.lessonNum||'—')}</div>
    <div class="lesson-info">
      <div class="lesson-subject">${esc(l.subject||'')}${badges.join('')}</div>
      <div class="lesson-meta">${meta.join('')}</div>
      ${hwIcon}
    </div>
    <div class="lesson-action">${editBtns}</div>
  </div>`;
}
function weekPanelHTML(){
  const mon=currentMonday(); const activeIdx=dowIdx(selectedDate); const todayIso=todayISO();
  const monthLabel=MONTHS_NOM[mon.getMonth()]+' '+mon.getFullYear();
  const days=[];
  for(let i=0;i<5;i++){
    const d=new Date(mon); d.setDate(mon.getDate()+i);
    const iso=isoOfDate(d); const isActive=i===activeIdx; const isToday=iso===todayIso;
    days.push(`<button class="wp-day ${isActive?'active':''} ${isToday?'today':''}" data-day="${i}"><span class="wp-day-name">${WEEK_FULL[i]}</span></button>`);
  }
  const mobileTab=`<div class="wp-mobile"><div class="wp-mobile-tab"><span class="wp-mobile-name">${WEEK_FULL[activeIdx]}</span></div></div>`;
  return `<div class="week-wrap"><div class="week-panel"><div class="wp-head">
    <button class="wp-arrow" id="wpPrev"><span class="msr">chevron_left</span></button>
    <div class="wp-title" id="wpTitle"><span class="msr">calendar_month</span><span>${monthLabel}</span></div>
    <button class="wp-today-btn" id="wpToday">Сегодня</button>
    <button class="wp-arrow" id="wpNext"><span class="msr">chevron_right</span></button>
  </div><div class="wp-days">${days.join('')}</div>${mobileTab}</div></div>`;
}
function bindWeekPanel(){
  const prev=$('wpPrev'), next=$('wpNext'), today=$('wpToday'), title=$('wpTitle');
  const isPhone=window.innerWidth<=820;
  if(prev) prev.onclick=()=>{ isPhone?moveDay(-1):moveWeek(-1); loadPageData(currentPage); };
  if(next) next.onclick=()=>{ isPhone?moveDay(1):moveWeek(1); loadPageData(currentPage); };
  if(today) today.onclick=()=>{ goToday(); loadPageData(currentPage); };
  if(title) title.onclick=(e)=>{ moveMonth(e.shiftKey?-1:1); loadPageData(currentPage); };
  document.querySelectorAll('.wp-day').forEach(b=>{ b.onclick=()=>{ setDayOfWeek(parseInt(b.dataset.day,10)); loadPageData(currentPage); }; });
}

const TITLES={home:'Главная',schedule:'Расписание',homework:'Домашние задания',diary:'Дневник',users:'Управление'};
function buildPane(key){
  const pane=document.createElement('div');
  pane.className='page-pane'; pane.dataset.page=key;
  let html='';
  if(key==='home') html=homeContentHTML();
  if(key==='schedule') html=scheduleContentHTML(cacheLessons);
  if(key==='homework') html=homeworkContentHTML(cacheLessons, cacheHwStatuses);
  if(key==='diary') html=diaryContentHTML();
  if(key==='users') html=usersContentHTML();
  pane.innerHTML=html;
  return pane;
}
function renderPage(key){
  const viewport=$('pagesViewport');
  $$('.menu-item').forEach(b=>b.classList.toggle('active', b.dataset.page===key));
  $$('.mb-item').forEach(b=>b.classList.toggle('active', b.dataset.page===key));
  moveIndicator();
  $('topbarTitle').textContent=TITLES[key]||'Главная';
  if(!viewport.firstChild){
    viewport.appendChild(buildPane(key));
    if(key==='schedule'||key==='homework') bindWeekPanel();
    currentPage=key; updateAddBtn(); loadPageData(key);
    return;
  }
  if(key===currentPage||animating) return;
  animating=true;
  const oldPane=viewport.querySelector('.page-pane');
  const newPane=buildPane(key);
  viewport.appendChild(newPane);
  if(key==='schedule'||key==='homework') bindWeekPanel();
  setTimeout(()=>{ if(oldPane&&oldPane.parentNode) oldPane.parentNode.removeChild(oldPane); animating=false; }, 350);
  currentPage=key; updateAddBtn(); loadPageData(key);
}
async function loadPageData(key){
  const user=getCurrentUser(); if(!user) return;
  if(key==='schedule'||key==='homework'){
    if(prefetched.scheduleByDate[selectedDate] !== undefined){
      cacheLessons = prefetched.scheduleByDate[selectedDate];
      if(key==='homework' && prefetched.hwStatuses) cacheHwStatuses = prefetched.hwStatuses;
      refreshCurrentPage();
      jsonp({action:'get_sched', requester:user.email, date:selectedDate}, 12000)
        .then(res=>{
          if(res && res.status==='ok'){
            const fresh = filterByDate(res.lessons, selectedDate);
            prefetched.scheduleByDate[selectedDate]=fresh;
            cacheLessons=fresh;
            updateCacheFromPrefetched();
            if(currentPage==='schedule'||currentPage==='homework') refreshCurrentPage();
          }
        }).catch(()=>{});
      return;
    }
    try{
      const res=await jsonp({action:'get_sched', requester:user.email, date:selectedDate});
      if(res&&res.status==='ok'){
        cacheLessons=filterByDate(res.lessons, selectedDate);
        prefetched.scheduleByDate[selectedDate]=cacheLessons;
        if(key==='homework'){
          if(prefetched.hwStatuses){ cacheHwStatuses=prefetched.hwStatuses; }
          else { const hr=await jsonp({action:'hw_status', requester:user.email}); if(hr&&hr.status==='ok'){ cacheHwStatuses=hr.statuses||{}; prefetched.hwStatuses=cacheHwStatuses; } }
        }
        updateCacheFromPrefetched();
      }
      refreshCurrentPage();
    }catch(e){ showToast(e.message); refreshCurrentPage(); }
  }
  if(key==='users'){
    if(prefetched.users && prefetched.users.length){ const box=$('usersList'); if(!box) return; box.outerHTML=usersListHTML(prefetched.users); bindUsersSelects(); }
    try{
      const res=await jsonp({action:'users_list', requester:user.email});
      const box=$('usersList'); if(!box) return;
      if(!res||res.status!=='ok'){ if(!prefetched.users.length) box.innerHTML=`<div class="empty-state"><span class="msr">lock</span><h3>Нет доступа</h3></div>`; return; }
      prefetched.users=res.users||[];
      updateCacheFromPrefetched();
      box.outerHTML=usersListHTML(res.users);
      bindUsersSelects();
    }catch(e){ showToast(e.message); }
  }
}
function bindUsersSelects(){
  const user=getCurrentUser();
  document.querySelectorAll('.u-role select').forEach(sel=>{
    sel.onchange=async()=>{
      const email=sel.dataset.email, role=sel.value;
      try{
        const r=await jsonp({action:'set_role', requester:user.email, email, role});
        if(!r||r.status!=='ok') showToast((r&&r.message)||'Ошибка');
        else { showToast('Роль обновлена'); if(prefetched.users){ const pu=prefetched.users.find(u=>u.email===email); if(pu) pu.role=role; updateCacheFromPrefetched(); } }
      }catch(e){ showToast(e.message); }
    };
  });
}
function refreshCurrentPage(){
  const pane=document.querySelector('.page-pane[data-page="'+currentPage+'"]'); if(!pane) return;
  if(currentPage==='schedule') pane.innerHTML=scheduleContentHTML(cacheLessons);
  if(currentPage==='homework') pane.innerHTML=homeworkContentHTML(cacheLessons, cacheHwStatuses);
  if(currentPage==='schedule'||currentPage==='homework') bindWeekPanel();
}

window.openView = function(id){
  const l=cacheLessons.find(x=>String(x.id)===String(id)); if(!l) return;
  $('spTitle').textContent=l.subject||'—';
  const parts=[];
  if(l.date) parts.push(section('Дата', formatRuDate(normDate(l.date))));
  if(l.lessonNum) parts.push(section('Номер', l.lessonNum));
  if(l.time) parts.push(section('Время', l.time));
  if(l.teacher) parts.push(section('Учитель', l.teacher));
  if(l.room) parts.push(section('Кабинет', l.room));
  if(l.sor) parts.push(section('СОР', 'Да', '#1F9EA8'));
  if(l.soch) parts.push(section('СОЧ', 'Да', '#1E88E5'));
  if(l.cancelled) parts.push(section('Отменён', 'Да', '#DC2626'));
  parts.push(section('Домашнее задание', l.homework||'Нет'));
  $('spBody').innerHTML=parts.join('');
  $('sidePanel').classList.add('open');
  $('sidePanelBackdrop').classList.add('open');
};
function section(label, value, color){
  return `<div class="sp-section"><div class="sp-label">${esc(label)}</div><div class="sp-value" ${color?`style="color:${color};font-weight:700"`:''}>${esc(value)}</div></div>`;
}

$('sidePanelBackdrop').onclick=closePanel;

window.openModal = function(lesson){
  if(!canEditSchedule()){ showToast('Нет прав'); return; }
  editingId=lesson?lesson.id:null;
  $('modalTitle').textContent=lesson?'Редактировать урок':'Новый урок';
  $('mDate').value=lesson?normDate(lesson.date):selectedDate;
  setSelectValue('csLessonNum', lesson?String(lesson.lessonNum||''):'');
  setSelectValue('csTime', lesson?lesson.time:'');
  setSelectValue('csSubject', lesson?lesson.subject:'');
  setSelectValue('csTeacher', lesson?lesson.teacher:'');
  setSelectValue('csRoom', lesson?lesson.room:'');
  $('mHomework').value=lesson?lesson.homework:'';
  $('mSor').checked=lesson?!!lesson.sor:false;
  $('mSoch').checked=lesson?!!lesson.soch:false;
  $('mCancelled').checked=lesson?!!lesson.cancelled:false;
  $('modalBackdrop').classList.add('show');
};
function closeModal(){ $('modalBackdrop').classList.remove('show'); editingId=null; }
$('modalClose').onclick=closeModal;
$('modalCancel').onclick=closeModal;
$('modalBackdrop').onclick=e=>{ if(e.target===$('modalBackdrop')) closeModal(); };

/* ---------- СОХРАНЕНИЕ ---------- */
$('modalSave').onclick=()=>{
  const user=getCurrentUser(); if(!user) return;
  const dateVal = $('mDate').value;
  const subjectVal = getSelectValue('csSubject');
  const timeVal = getSelectValue('csTime');
  const teacherVal = getSelectValue('csTeacher');
  const roomVal = getSelectValue('csRoom');
  const numVal = getSelectValue('csLessonNum');

  let bad=false;
  if(!dateVal){ $('mDate').classList.remove('error'); void $('mDate').offsetWidth; $('mDate').classList.add('error'); bad=true; }
  if(!subjectVal){ $('csSubject')._cs.markError(); bad=true; }
  if(!timeVal){ $('csTime')._cs.markError(); bad=true; }
  if(!teacherVal){ $('csTeacher')._cs.markError(); bad=true; }
  if(!roomVal){ $('csRoom')._cs.markError(); bad=true; }
  if(bad){ showToast('Заполните обязательные поля'); return; }

  // Запоминаем введённые значения
  if(numVal)     rememberValue('lessonNum', numVal);
  if(timeVal)    rememberValue('time', timeVal);
  if(subjectVal) rememberValue('subject', subjectVal);
  if(teacherVal) rememberValue('teacher', teacherVal);
  if(roomVal)    rememberValue('room', roomVal);

  const payload={
    action:'save_sched', requester:user.email, role:userRole(),
    id:editingId||'',
    date:dateVal,
    lessonNum:numVal,
    time:timeVal,
    subject:subjectVal,
    teacher:teacherVal,
    room:roomVal,
    homework:$('mHomework').value.trim(),
    sor:$('mSor').checked?'true':'false',
    soch:$('mSoch').checked?'true':'false',
    cancelled:$('mCancelled').checked?'true':'false'
  };

  const dateKey = normDate(payload.date);
  const localId = editingId || ('tmp_'+Date.now()+'_'+Math.random().toString(36).slice(2,7));
  const localLesson = {
    id: localId, date: payload.date, lessonNum: payload.lessonNum,
    time: payload.time, subject: payload.subject, teacher: payload.teacher,
    room: payload.room, homework: payload.homework,
    sor: payload.sor==='true', soch: payload.soch==='true', cancelled: payload.cancelled==='true'
  };

  const oldList = prefetched.scheduleByDate[dateKey] ? JSON.parse(JSON.stringify(prefetched.scheduleByDate[dateKey])) : null;

  if(prefetched.scheduleByDate[dateKey]){
    let arr = prefetched.scheduleByDate[dateKey].slice();
    if(editingId){
      const i = arr.findIndex(x=>String(x.id)===String(editingId));
      if(i>=0) arr[i] = localLesson; else arr.push(localLesson);
    } else arr.push(localLesson);
    arr.sort((a,b)=>(parseInt(a.lessonNum)||0)-(parseInt(b.lessonNum)||0));
    prefetched.scheduleByDate[dateKey] = arr;
  } else {
    prefetched.scheduleByDate[dateKey] = [localLesson];
  }
  updateCacheFromPrefetched();

  if(payload.date!==selectedDate) selectedDate = payload.date;
  if(dateKey===selectedDate) cacheLessons = prefetched.scheduleByDate[dateKey];
  if(currentPage==='schedule'||currentPage==='homework') refreshCurrentPage();

  // Обновляем все dropdown'ы (новые значения сразу появятся)
  rebuildSelectFromMemory('csLessonNum');
  rebuildSelectFromMemory('csTime');
  rebuildSelectFromMemory('csSubject');
  rebuildSelectFromMemory('csTeacher');
  rebuildSelectFromMemory('csRoom');

  closeModal();
  showToast('Сохранено');

  jsonp(payload).then(res=>{
    if(!res||res.status!=='ok'){
      showToast((res&&res.message)||'Не сохранилось — повторите');
      if(oldList!==null) prefetched.scheduleByDate[dateKey]=oldList;
      else delete prefetched.scheduleByDate[dateKey];
      updateCacheFromPrefetched();
      if(dateKey===selectedDate) cacheLessons = prefetched.scheduleByDate[dateKey]||[];
      if(currentPage==='schedule'||currentPage==='homework') refreshCurrentPage();
      return;
    }
    if(res.id && !editingId && prefetched.scheduleByDate[dateKey]){
      const arr = prefetched.scheduleByDate[dateKey];
      const i = arr.findIndex(x=>String(x.id)===String(localId));
      if(i>=0) arr[i].id = res.id;
      updateCacheFromPrefetched();
    }
  }).catch(()=>{
    showToast('Не сохранилось — повторите');
    if(oldList!==null) prefetched.scheduleByDate[dateKey]=oldList;
    else delete prefetched.scheduleByDate[dateKey];
    updateCacheFromPrefetched();
    if(dateKey===selectedDate) cacheLessons = prefetched.scheduleByDate[dateKey]||[];
    if(currentPage==='schedule'||currentPage==='homework') refreshCurrentPage();
  });
};

window.editLesson=function(id){ const l=cacheLessons.find(x=>String(x.id)===String(id)); if(l) openModal(l); };

window.deleteLesson=function(id){
  if(!confirm('Удалить урок?')) return;
  const user=getCurrentUser();
  const dateKey = selectedDate;
  const oldList = prefetched.scheduleByDate[dateKey] ? JSON.parse(JSON.stringify(prefetched.scheduleByDate[dateKey])) : null;
  if(prefetched.scheduleByDate[dateKey]){
    prefetched.scheduleByDate[dateKey] = prefetched.scheduleByDate[dateKey].filter(x=>String(x.id)!==String(id));
    cacheLessons = prefetched.scheduleByDate[dateKey];
    updateCacheFromPrefetched();
    refreshCurrentPage();
  }
  showToast('Удалено');
  jsonp({action:'del_sched', requester:user.email, role:userRole(), id}).then(res=>{
    if(!res||res.status!=='ok'){
      showToast((res&&res.message)||'Не удалилось — повторите');
      if(oldList!==null){ prefetched.scheduleByDate[dateKey]=oldList; cacheLessons=oldList; }
      updateCacheFromPrefetched();
      refreshCurrentPage();
    }
  }).catch(()=>{
    showToast('Не удалилось — повторите');
    if(oldList!==null){ prefetched.scheduleByDate[dateKey]=oldList; cacheLessons=oldList; }
    updateCacheFromPrefetched();
    refreshCurrentPage();
  });
};

function showToast(m){
  let t=$('toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; document.body.appendChild(t); }
  t.textContent=m; t.classList.add('show');
  clearTimeout(t._tid); t._tid=setTimeout(()=>t.classList.remove('show'),2400);
}

document.addEventListener('click',(e)=>{
  const mb=e.target.closest('.menu-item');
  if(mb&&mb.dataset.page){ renderPage(mb.dataset.page); return; }
  const mbb=e.target.closest('.mb-item');
  if(mbb&&mbb.dataset.page){ renderPage(mbb.dataset.page); return; }
});
$$('[data-logout]').forEach(b=>b.onclick=()=>{ showLoader(); clearSession(); setTimeout(()=>location.reload(), 3000); });

/* =========================================================
   INIT
   ========================================================= */
(async function init(){
  requestAnimationFrame(fitFormHeight);
  initAllSelects();
  const s = getSession();
  if(s && s.user){
    hydrateFromCache();
    if(prefetched.scheduleByDate[selectedDate]) cacheLessons = prefetched.scheduleByDate[selectedDate];
    showLoader();
    await new Promise(r=>setTimeout(r, 3200));
    hideLoader();
    $('authView').classList.add('hidden');
    $('appView').classList.remove('hidden');
    applyUserToUI(); addCreatorMenu();
    renderPage('home');
    requestAnimationFrame(moveIndicator);
    prefetchAll(s.user).then(()=>{
      if(prefetched.scheduleByDate[selectedDate]) cacheLessons = prefetched.scheduleByDate[selectedDate];
      if(currentPage==='schedule'||currentPage==='homework') refreshCurrentPage();
    }).catch(()=>{});
  } else {
    showLoader();
    await new Promise(r=>setTimeout(r, 3200));
    hideLoader();
    $('authView').classList.remove('hidden');
  }
})();
</script>
