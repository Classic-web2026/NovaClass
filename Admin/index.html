<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>NovaClass · Админ-панель</title>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;700&display=swap" rel="stylesheet">
<script>
(function(){try{var t=localStorage.getItem('nc_theme')||'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
:root{
  --bg:#FFFFFF;--section:#F1F5F9;--card:#F8FAFC;
  --text:#1E293B;--muted:#64748B;--brand:#0F172A;
  --accent:#2563EB;--accent-h:#1D4ED8;--accent-light:#DBEAFE;
  --border:#E2E8F0;
  --rc:20px;--ri:14px;--rt:12px;--rb:10px;--rp:32px;
  --shadow:0 1px 3px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.02);
  --shadow-hover:0 8px 24px -8px rgba(37,99,235,.22);
  --shadow-lg:0 20px 40px -16px rgba(15,23,42,.14);
  --ease-spring:cubic-bezier(.34,1.4,.64,1);
  --ease-out:cubic-bezier(.4,0,.2,1);
  --ok:#16A34A;--ok-light:#DCFCE7;
  --warn:#EA580C;--warn-light:#FFEDD5;
  --err:#DC2626;--err-light:#FEF2F2;
  --purple:#A855F7;--purple-light:rgba(168,85,247,.12);
  --pink:#EC4899;--pink-light:rgba(236,72,153,.12);
  --cyan:#06B6D4;--cyan-light:rgba(6,182,212,.12);
}
html[data-theme="dark"]{
  --bg:#0B1220;--section:#1E293B;--card:#0F172A;
  --text:#E2E8F0;--muted:#94A3B8;--brand:#F1F5F9;
  --accent:#3B82F6;--accent-h:#2563EB;--accent-light:rgba(59,130,246,.15);
  --border:#1E293B;
  --shadow:0 1px 3px rgba(0,0,0,.3);
  --shadow-hover:0 8px 24px -8px rgba(59,130,246,.35);
  --shadow-lg:0 20px 40px -16px rgba(0,0,0,.5);
  --ok-light:rgba(22,163,74,.15);--warn-light:rgba(234,88,12,.15);
  --err-light:rgba(220,38,38,.15);--purple-light:rgba(168,85,247,.15);
  --pink-light:rgba(236,72,153,.15);--cyan-light:rgba(6,182,212,.15);
}
html[data-theme="winter"]{
  --bg:#F2F8FE;--section:#E8F1FB;--card:#FFFFFF;
  --text:#1E3A5F;--muted:#6B8BAA;--brand:#0F2A4A;
  --accent:#6FB0E5;--accent-h:#5399D6;--accent-light:#DCEDFB;
  --border:#D2E3F3;
}
body{font-family:'Comfortaa',sans-serif;background:var(--section);color:var(--text);font-size:15px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}
.ui-icon{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1}
.ui-icon.sm{width:18px;height:18px}
.ui-icon.lg{width:32px;height:32px}
.ui-icon.xl{width:40px;height:40px}

/* ===== AUTH ===== */
#authScreen{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg)}
.auth-card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--border);border-radius:22px;padding:32px;box-shadow:var(--shadow-lg);animation:zoom .4s var(--ease-spring) both}
@keyframes zoom{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.auth-icon{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,#3B82F6,#2563EB);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 12px 28px -10px rgba(37,99,235,.5)}
.auth-icon .ui-icon{width:36px;height:36px;stroke:#fff;stroke-width:2.2}
.auth-title{font-size:20px;font-weight:700;color:var(--brand);text-align:center;margin-bottom:6px}
.auth-sub{font-size:12.5px;color:var(--muted);text-align:center;margin-bottom:24px}

/* ===== LAYOUT ===== */
#app{display:flex;height:100%;padding:16px;gap:16px;background:var(--section)}
.sidebar{flex-shrink:0;width:78px;background:var(--card);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);padding:18px 12px;display:flex;flex-direction:column;overflow:hidden;transition:width .3s var(--ease-out);z-index:30}
.sidebar:hover,.sidebar.open{width:250px;box-shadow:var(--shadow-lg)}
.sb-head{display:flex;align-items:center;gap:12px;padding:4px 4px 16px;border-bottom:1px solid var(--border);margin-bottom:14px;min-height:60px;overflow:hidden;white-space:nowrap}
.sb-logo{width:48px;height:48px;border-radius:14px;overflow:hidden;flex-shrink:0;box-shadow:0 6px 16px -8px rgba(111,176,229,.5)}
.sb-logo svg{width:100%;height:100%}
.sb-name{font-size:16px;font-weight:700;color:var(--brand);opacity:0;max-width:0;overflow:hidden;transition:opacity .25s,max-width .3s}
.sidebar:hover .sb-name,.sidebar.open .sb-name{opacity:1;max-width:180px}
.sb-name small{display:block;font-size:10px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
.menu{display:flex;flex-direction:column;gap:5px;overflow-y:auto;flex:1;min-height:0}
.mi{display:flex;align-items:center;gap:16px;padding:13px 14px;border-radius:14px;border:none;background:transparent;color:var(--text);font-family:inherit;font-size:13.5px;font-weight:500;cursor:pointer;text-align:left;white-space:nowrap;min-height:48px;overflow:hidden;transition:background .18s}
.mi:hover:not(.active){background:var(--section)}
.mi.active{background:var(--accent);color:#fff;font-weight:700}
.mi.active .ui-icon{stroke:#fff}
.mi span{opacity:0;max-width:0;overflow:hidden;transition:opacity .25s,max-width .3s}
.sidebar:hover .mi span,.sidebar.open .mi span{opacity:1;max-width:180px}
.mi .badge{margin-left:auto;background:var(--err);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;opacity:0;transition:opacity .25s}
.sidebar:hover .mi .badge,.sidebar.open .mi .badge{opacity:1}
.sb-foot{margin-top:auto;padding:14px 4px 4px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;overflow:hidden;white-space:nowrap}
.sb-ava{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#3B82F6,#2563EB);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0}
.sb-ava.online{position:relative}
.sb-ava.online::after{content:'';position:absolute;bottom:-1px;right:-1px;width:13px;height:13px;background:#16A34A;border:2.5px solid var(--card);border-radius:50%}
.sb-user-info{flex:1;min-width:0;opacity:0;max-width:0;overflow:hidden;transition:opacity .25s,max-width .3s}
.sidebar:hover .sb-user-info,.sidebar.open .sb-user-info{opacity:1;max-width:180px}
.sb-user-info b{font-size:12.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-user-info small{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.sb-out{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;opacity:0;max-width:0;overflow:hidden;transition:all .2s}
.sidebar:hover .sb-out,.sidebar.open .sb-out{opacity:1;max-width:60px}
.sb-out:hover{background:var(--err-light);color:var(--err);border-color:var(--err)}
.sb-out .ui-icon{width:18px;height:18px}

.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px;overflow:hidden}
.topbar{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:14px 22px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);min-height:64px;flex-shrink:0}
.tb-title{font-size:17px;font-weight:700;color:var(--brand);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.tb-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-shrink:0}
.tb-chip{padding:7px 14px;background:var(--section);border:1px solid var(--border);border-radius:20px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.tb-chip.green{background:var(--ok-light);color:var(--ok);border-color:transparent}
.tb-chip.blue{background:var(--accent-light);color:var(--accent);border-color:transparent}
.tb-chip .ui-icon{width:14px;height:14px}
.tb-btn{padding:9px 14px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .18s}
.tb-btn:hover{background:var(--accent-light);color:var(--accent);border-color:var(--accent)}
.tb-btn.primary{background:var(--accent);color:#fff;border-color:transparent}
.tb-btn.primary:hover{background:var(--accent-h)}
.tb-btn.primary .ui-icon{stroke:#fff}
.tb-btn .ui-icon{width:16px;height:16px}
.burger{display:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--card);cursor:pointer;flex-direction:column;justify-content:center;align-items:center;gap:4px;padding:0}
.burger span{display:block;width:18px;height:2px;background:var(--text);border-radius:2px}

.page-area{flex:1;min-height:0;overflow-y:auto;border-radius:20px;padding-right:4px}
.page-area::-webkit-scrollbar{width:8px}
.page-area::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.page{animation:paneIn .35s var(--ease-out) both}
@keyframes paneIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ===== SECTION TITLE ===== */
.stitle{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:22px 0 12px;display:flex;align-items:center;gap:8px}
.stitle:first-child{margin-top:0}
.stitle .ui-icon{width:18px;height:18px;color:var(--accent)}
.stitle .line{flex:1;height:1px;background:var(--border)}

/* ===== STATS ===== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;position:relative;overflow:hidden;transition:all .25s var(--ease-out);animation:paneIn .5s var(--ease-out) both;animation-delay:calc(var(--i,0)*50ms)}
.stat:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover);border-color:var(--accent)}
.stat::after{content:'';position:absolute;top:-40%;right:-30%;width:180px;height:180px;background:radial-gradient(circle,rgba(37,99,235,.06),transparent 70%);pointer-events:none}
.stat-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.stat-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .3s var(--ease-spring)}
.stat:hover .stat-icon{transform:scale(1.1) rotate(-6deg)}
.stat-icon .ui-icon{width:22px;height:22px}
.stat-icon.blue{background:var(--accent-light);color:var(--accent)}
.stat-icon.green{background:var(--ok-light);color:var(--ok)}
.stat-icon.orange{background:var(--warn-light);color:var(--warn)}
.stat-icon.red{background:var(--err-light);color:var(--err)}
.stat-icon.purple{background:var(--purple-light);color:var(--purple)}
.stat-icon.pink{background:var(--pink-light);color:var(--pink)}
.stat-icon.cyan{background:var(--cyan-light);color:var(--cyan)}
.stat-lbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.stat-val{font-size:32px;font-weight:700;color:var(--brand);line-height:1;letter-spacing:-1px;position:relative;z-index:1}
.stat-sub{font-size:11px;color:var(--muted);margin-top:6px;position:relative;z-index:1;display:flex;align-items:center;gap:4px}
.stat-sub.green{color:var(--ok);font-weight:700}
.stat-sub.orange{color:var(--warn);font-weight:700}

/* ===== SERVER BANNER ===== */
.server{background:linear-gradient(135deg,#16A34A,#22C55E);border-radius:20px;padding:22px 26px;color:#fff;display:flex;align-items:center;gap:20px;margin-bottom:12px;position:relative;overflow:hidden;animation:paneIn .4s var(--ease-out) both}
.server.down{background:linear-gradient(135deg,#DC2626,#EF4444)}
.server.slow{background:linear-gradient(135deg,#EA580C,#F97316)}
.server::after{content:'';position:absolute;top:-50%;right:-10%;width:400px;height:400px;background:radial-gradient(circle,rgba(255,255,255,.15),transparent 70%);pointer-events:none}
.server-icon{width:60px;height:60px;border-radius:16px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;z-index:1}
.server-icon .ui-icon{width:30px;height:30px;stroke:#fff;animation:pulseIcon 2s ease-in-out infinite}
@keyframes pulseIcon{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.server-info{flex:1;position:relative;z-index:1;min-width:0}
.server-title{font-size:20px;font-weight:700;margin-bottom:4px}
.server-sub{font-size:12.5px;opacity:.9;display:flex;gap:14px;flex-wrap:wrap}
.server-sub span{display:inline-flex;align-items:center;gap:5px}
.server-sub .ui-icon{width:14px;height:14px}
.server-metrics{display:flex;gap:20px;position:relative;z-index:1}
.server-metric-val{font-size:26px;font-weight:700;line-height:1;letter-spacing:-1px}
.server-metric-lbl{font-size:10px;opacity:.8;text-transform:uppercase;letter-spacing:1.2px;margin-top:4px;font-weight:700;text-align:center}

/* ===== TABLE ===== */
.tbl-wrap{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:auto;box-shadow:var(--shadow);margin-bottom:12px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:var(--section);color:var(--muted);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:12px 14px;text-align:left;white-space:nowrap;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--border)}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--section)}
.tbl .usr-cell{display:flex;align-items:center;gap:10px}
.tbl .ava{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#3B82F6,#2563EB);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;position:relative}
.tbl .ava.online::after{content:'';position:absolute;bottom:-1px;right:-1px;width:10px;height:10px;background:#16A34A;border:2px solid var(--card);border-radius:50%}
.tbl .usr-name{font-weight:700;color:var(--brand);font-size:13px}
.tbl .usr-mail{font-size:11px;color:var(--muted)}
.tbl .badge{padding:3px 9px;border-radius:8px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
.badge-student{background:rgba(37,99,235,.12);color:#2563EB}
.badge-teacher{background:rgba(22,163,74,.15);color:#16A34A}
.badge-admin{background:rgba(220,38,38,.15);color:#DC2626}
.badge-creator{background:linear-gradient(135deg,#3B82F6,#2563EB);color:#fff}
.badge-moderator{background:rgba(234,88,12,.15);color:#EA580C}
.badge-director{background:rgba(168,85,247,.15);color:#A855F7}
.badge-online{background:var(--ok-light);color:var(--ok);position:relative;padding-left:20px}
.badge-online::before{content:'';position:absolute;left:9px;top:50%;transform:translateY(-50%);width:6px;height:6px;background:var(--ok);border-radius:50%;animation:blink 1.6s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.badge-offline{background:var(--section);color:var(--muted)}
.tbl .icon-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all .15s;margin-right:4px}
.tbl .icon-btn:hover{background:var(--accent-light);color:var(--accent);border-color:var(--accent)}
.tbl .icon-btn.dngr:hover{background:var(--err-light);color:var(--err);border-color:var(--err)}
.tbl .icon-btn .ui-icon{width:16px;height:16px}

/* ===== SEARCH/FILTER BAR ===== */
.bar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.bar .search{position:relative;flex:1;min-width:200px}
.bar .search input{width:100%;padding:11px 16px 11px 42px;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);font-family:inherit;font-size:13px;outline:none;transition:all .2s}
.bar .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.bar .search .ui-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted)}
.bar .seg{display:flex;gap:0;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:3px;overflow:hidden}
.bar .seg button{padding:8px 14px;border:none;background:transparent;border-radius:9px;color:var(--muted);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s}
.bar .seg button.active{background:var(--accent);color:#fff}
.bar select{padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;outline:none}

/* ===== EMPTY ===== */
.empty{text-align:center;padding:60px 24px;background:var(--card);border:1px dashed var(--border);border-radius:16px;color:var(--muted)}
.empty .ui-icon{width:56px;height:56px;color:#CBD5E1;stroke-width:1.5;margin-bottom:14px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.empty h3{font-size:15px;font-weight:700;color:var(--brand);margin-bottom:6px}

/* ===== CHART ===== */
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:12px}
.chart-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.chart-title{font-size:14px;font-weight:700;color:var(--brand);display:flex;align-items:center;gap:8px}
.chart-title .ui-icon{width:20px;height:20px;color:var(--accent)}
.chart{display:flex;align-items:flex-end;gap:6px;height:160px;padding:0 4px}
.bar{flex:1;background:linear-gradient(180deg,#60A5FA,#2563EB);border-radius:8px 8px 4px 4px;min-height:4px;position:relative;transition:all .3s var(--ease-out);cursor:pointer}
.bar:hover{filter:brightness(1.15)}
.bar::after{content:attr(data-v);position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--brand);opacity:0;transition:opacity .2s;white-space:nowrap}
.bar:hover::after{opacity:1}
.chart-x{display:flex;gap:6px;padding:8px 4px 0;font-size:10.5px;color:var(--muted);font-weight:600}
.chart-x span{flex:1;text-align:center}

/* ===== ROW LIST ===== */
.row-list{display:flex;flex-direction:column;gap:8px}
.row-item{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 18px;display:flex;align-items:center;gap:14px;transition:all .2s var(--ease-out);animation:paneIn .4s var(--ease-out) both;animation-delay:calc(var(--i,0)*30ms)}
.row-item:hover{border-color:var(--accent);transform:translateX(3px);box-shadow:var(--shadow-hover)}
.row-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.row-info{flex:1;min-width:0}
.row-title{font-size:14px;font-weight:700;color:var(--brand);margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-sub{font-size:11.5px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.row-sub span{display:inline-flex;align-items:center;gap:4px}
.row-sub .ui-icon{width:13px;height:13px}
.row-right{text-align:right;flex-shrink:0}

/* ===== MODAL ===== */
.mbg{position:fixed;inset:0;z-index:1000;background:rgba(15,23,42,.55);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.mbg.on{display:flex;animation:bgFade .25s ease both}
@keyframes bgFade{from{opacity:0}to{opacity:1}}
.mdl{width:100%;max-width:500px;background:var(--card);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow-lg);overflow:hidden;margin:auto;animation:popIn .35s var(--ease-spring) both}
@keyframes popIn{from{opacity:0;transform:scale(.9) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
.mh{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 16px;border-bottom:1px solid var(--border)}
.mh b{font-size:16px;color:var(--brand);display:flex;align-items:center;gap:10px}
.mh b .ui-icon{width:20px;height:20px;color:var(--accent)}
.mh-close{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all .2s}
.mh-close:hover{background:var(--err-light);color:var(--err);border-color:var(--err);transform:rotate(90deg)}
.mh-close .ui-icon{width:18px;height:18px}
.mb{padding:20px 24px}
.fld{margin-bottom:14px}
.fld label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;padding-left:2px}
.fld label .ui-icon{width:14px;height:14px;opacity:.75}
.fld input,.fld select,.fld textarea{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);font-family:inherit;font-size:13.5px;outline:none;transition:all .2s}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.fld textarea{min-height:80px;resize:vertical}
.fld input:disabled{opacity:.6;cursor:not-allowed}
.mf{display:flex;gap:10px;padding:16px 24px 20px;border-top:1px solid var(--border)}
.mf button{flex:1;padding:12px;border-radius:12px;font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:all .18s}
.btn-cancel{background:var(--bg);color:var(--text);border:1px solid var(--border)}
.btn-cancel:hover{background:var(--section)}
.btn-save{background:var(--accent);color:#fff;border:none}
.btn-save:hover{background:var(--accent-h)}
.btn-save:disabled{opacity:.6;cursor:wait}
.btn-save .ui-icon{width:18px;height:18px;stroke:#fff}

/* ===== TOAST ===== */
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:#0F172A;color:#fff;padding:13px 22px;border-radius:12px;font-size:13px;font-weight:600;z-index:10000;opacity:0;transition:all .3s var(--ease-spring);pointer-events:none;max-width:90vw;display:flex;align-items:center;gap:10px;box-shadow:0 20px 40px -16px rgba(15,23,42,.4)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast .ui-icon{width:18px;height:18px;stroke:#fff}
#toast.ok{background:#15803D}
#toast.err{background:#B91C1C}

@media (max-width:900px){
  #app{padding:10px;gap:10px}
  .sidebar{position:fixed;top:10px;left:10px;bottom:10px;width:260px;transform:translateX(-110%);transition:transform .3s var(--ease-out)}
  .sidebar.open{transform:translateX(0);width:260px;box-shadow:var(--shadow-lg)}
  .sidebar .sb-name,.sidebar .mi span,.sidebar .sb-user-info,.sidebar .sb-out{opacity:1;max-width:200px}
  .burger{display:flex}
  .stats{grid-template-columns:1fr 1fr}
  .stat-val{font-size:26px}
  .tb-title{font-size:15px}
  .server{flex-direction:column;text-align:center;gap:14px}
  .server-metrics{width:100%;justify-content:space-around}
}

<script>
/* ============================================================
   NOVACLASS ADMIN PANEL
   ============================================================ */
const GAS_URL='https://script.google.com/macros/s/AKfycbxWdOtpczDkEmU0Nb1gEE8iIovoqTfJPYPTqoUKM__MtciH0xEAlFX3ROPmMnYhxSMd/exec';
const SESSION_KEY='nc_admin_sess';
const $=id=>document.getElementById(id);
let ME=null, USERS=[], ONLINE={}, EDIT_EMAIL=null;
let lastPing=0, refreshTimer=null, pingTimer=null, currentPage='dashboard';
let SCHEDULE_DATA={}, GRADES_DATA=[];

const ROLE_LBL={'Ученик':'Ученик','Модератор':'Модератор','Учитель':'Учитель','Директор':'Директор','Администратор':'Админ','Создатель':'Создатель'};
const ROLE_CLS={'Ученик':'student','Модератор':'moderator','Учитель':'teacher','Директор':'director','Администратор':'admin','Создатель':'creator'};

/* ============= HELPERS ============= */
function toast(msg,type){
  const t=$('toast');
  const ic=type==='ok'?'#i-check':type==='err'?'#i-x':'#i-monitor';
  t.innerHTML='<svg class="ui-icon"><use href="'+ic+'"/></svg><span>'+msg+'</span>';
  t.className='on'+(type?' '+type:'');
  clearTimeout(t._t);t._t=setTimeout(()=>t.className='',2400);
}
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const isoD=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>isoD(new Date());
const MONG=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

function timeAgo(ms){
  if(!ms||ms<0) return 'не заходил';
  const now=new Date(),d=new Date(ms),s=Math.floor((now-d)/1000);
  if(s<30) return 'только что';
  if(s<60) return s+' сек назад';
  const same=d.getDate()===now.getDate()&&d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();
  const hh=pad(d.getHours()),mm=pad(d.getMinutes());
  if(same){const m=Math.floor(s/60);if(m<60)return m+' мин назад';return 'в '+hh+':'+mm}
  const yest=new Date(now);yest.setDate(yest.getDate()-1);
  if(d.getDate()===yest.getDate()&&d.getMonth()===yest.getMonth()&&d.getFullYear()===yest.getFullYear())return 'вчера в '+hh+':'+mm;
  return pad(d.getDate())+'.'+pad(d.getMonth()+1)+' в '+hh+':'+mm;
}

/* ============= JSONP ============= */
let seq=0;
function jsonp(p){
  return new Promise((res,rej)=>{
    const n='cb'+(++seq)+Date.now();
    let done=false,sc;
    const cl=()=>{try{delete window[n]}catch(e){}if(sc&&sc.parentNode)sc.parentNode.removeChild(sc)};
    window[n]=d=>{if(done)return;done=true;cl();res(d)};
    const q=new URLSearchParams(Object.assign({},p,{callback:n})).toString();
    sc=document.createElement('script');sc.src=GAS_URL+'?'+q+'&_='+Date.now();
    sc.onerror=()=>{if(done)return;done=true;cl();rej(new Error('Нет связи'))};
    document.head.appendChild(sc);
    setTimeout(()=>{if(done)return;done=true;cl();rej(new Error('Таймаут'))},12000);
  });
}
async function api(p){let l;for(let i=0;i<2;i++){try{return await jsonp(p)}catch(e){l=e;if(!i)await new Promise(r=>setTimeout(r,500))}}throw l}

/* ============= SESSION ============= */
function getSession(){try{const r=localStorage.getItem(SESSION_KEY);if(!r)return null;const d=JSON.parse(r);if(!d||Date.now()>=d.expiresAt){localStorage.removeItem(SESSION_KEY);return null}return d.user}catch(e){return null}}
function saveSession(u){try{localStorage.setItem(SESSION_KEY,JSON.stringify({user:u,expiresAt:Date.now()+30*24*3600*1000}))}catch(e){}}
function clearSession(){try{localStorage.removeItem(SESSION_KEY)}catch(e){}}

/* ============= DATA LOADING ============= */
async function loadUsers(){
  try{const r=await api({action:'users_list',requester:ME.email});if(r&&r.status==='ok')USERS=r.users||[]}catch(e){}
}
async function loadOnline(){
  try{const r=await api({action:'online_list',requester:ME.email});if(!r||r.status!=='ok')return;
    ONLINE={};(r.users||[]).forEach(u=>{ONLINE[String(u.email).toLowerCase()]={status:u.status,lastSeen:u.lastSeen,diff:u.diff}});
  }catch(e){}
}
async function pingServer(){
  const t0=Date.now();
  try{const r=await api({action:'ping'});lastPing=Date.now()-t0;return r&&r.status==='ok'}catch(e){lastPing=-1;return false}
}
async function loadScheduleForDate(d){

    if(r&&r.status==='ok'){SCHEDULE_DATA[d]=r.lessons||[];return SCHEDULE_DATA[d]}
  }catch(e){}
  return [];
}
async function loadGrades(){

/* ============= STATUS ============= */
function getStatus(email){
  const rec=ONLINE[String(email).toLowerCase()];
  if(!rec) return {cls:'unknown',lbl:'оффлайн'};
  if(rec.status==='online') return {cls:'online',lbl:'в сети'};
  if(!rec.lastSeen) return {cls:'unknown',lbl:'оффлайн'};
  return {cls:rec.status==='recent'?'recent':'offline',lbl:timeAgo(rec.diff)};
}

function drawChart(){
  const chart=$('chart'),chartX=$('chartX');
  if(!chart) return;
  const now=new Date();
  const buckets=[];
  for(let i=11;i>=0;i--){
    const h=new Date(now);h.setHours(now.getHours()-i,0,0,0);
    const hEnd=new Date(h);hEnd.setHours(h.getHours()+1);
    let count=0;
    Object.values(ONLINE).forEach(rec=>{
      if(!rec.lastSeen) return;
      if(rec.lastSeen>=h.getTime() && rec.lastSeen<hEnd.getTime()) count++;
    });
    if(i===0 && count===0){Object.values(ONLINE).forEach(r=>{if(r.status==='online')count++})}
    buckets.push({h,count});
  }
  const max=Math.max(1,...buckets.map(b=>b.count));
  chart.innerHTML=buckets.map(b=>{
    const pct=Math.max(6,(b.count/max)*100);
    return `<div class="bar" style="height:${pct}%" data-v="${b.count}"></div>`;
  }).join('');
  chartX.innerHTML=buckets.map(b=>'<span>'+pad(b.h.getHours())+'</span>').join('');
}

/* ============= PAGE: REPORTS ============= */
function pgReports(){
  const roles={};USERS.forEach(u=>{roles[u.role||'Ученик']=(roles[u.role||'Ученик']||0)+1});
  const total=USERS.length;
  const roleRows=Object.keys(roles).sort((a,b)=>roles[b]-roles[a]).map(r=>{
    const pct=total?Math.round((roles[r]/total)*100):0;
    return `<tr>
      <td><span class="badge badge-${ROLE_CLS[r]||'student'}">${esc(ROLE_LBL[r]||r)}</span></td>
      <td><b>${roles[r]}</b></td>
      <td>${pct}%</td>
      <td><div style="background:var(--section);height:8px;border-radius:4px;overflow:hidden;max-width:300px"><div style="width:${pct}%;height:100%;background:linear-gradient(90deg,#60A5FA,#2563EB);border-radius:4px"></div></div></td>
    </tr>`;
  }).join('');

  const domains={};USERS.forEach(u=>{const d=String(u.email||'').split('@')[1]||'неизвестно';domains[d]=(domains[d]||0)+1});
  const domainRows=Object.keys(domains).sort((a,b)=>domains[b]-domains[a]).map(d=>`<tr><td><b>@${esc(d)}</b></td><td>${domains[d]}</td></tr>`).join('');

  return `
    <div class="stats">
      <div class="stat" style="--i:0"><div class="stat-top"><div class="stat-icon blue"><svg class="ui-icon"><use href="#i-users"/></svg></div><div class="stat-lbl">Всего</div></div><div class="stat-val">${total}</div><div class="stat-sub">аккаунтов</div></div>
      <div class="stat" style="--i:1"><div class="stat-top"><div class="stat-icon green"><svg class="ui-icon"><use href="#i-account"/></svg></div><div class="stat-lbl">Учеников</div></div><div class="stat-val">${roles['Ученик']||0}</div><div class="stat-sub">основная часть</div></div>
      <div class="stat" style="--i:2"><div class="stat-top"><div class="stat-icon orange"><svg class="ui-icon"><use href="#i-homework"/></svg></div><div class="stat-lbl">Учителей</div></div><div class="stat-val">${roles['Учитель']||0}</div><div class="stat-sub">преподаватели</div></div>
      <div class="stat" style="--i:3"><div class="stat-top"><div class="stat-icon red"><svg class="ui-icon"><use href="#i-key"/></svg></div><div class="stat-lbl">Админов</div></div><div class="stat-val">${(roles['Администратор']||0)+(roles['Создатель']||0)}</div><div class="stat-sub">управление</div></div>
    </div>

    <div class="stitle"><svg class="ui-icon"><use href="#i-chart"/></svg>Распределение по ролям<span class="line"></span></div>
    <div class="tbl-wrap">
      <table class="tbl">
        <thead><tr><th>Роль</th><th>Количество</th><th>Доля</th><th>Визуализация</th></tr></thead>
        <tbody>${roleRows||'<tr><td colspan="4">Нет данных</td></tr>'}</tbody>
      </table>
    </div>

    <div class="stitle"><svg class="ui-icon"><use href="#i-database"/></svg>По доменам email<span class="line"></span></div>
    <div class="tbl-wrap">
      <table class="tbl">
        <thead><tr><th>Домен</th><th>Пользователей</th></tr></thead>
        <tbody>${domainRows||'<tr><td colspan="2">Нет данных</td></tr>'}</tbody>
      </table>
    </div>
  `;
}

/* ============= PAGE: TREE ============= */
async function pgTree(){
  let submissions=[];
  try{const r=await api({action:'tree_get',requester:ME.email});if(r&&r.status==='ok')submissions=r.submissions||[]}catch(e){}
  const approved=submissions.filter(s=>s.status==='approved');
  const pending=submissions.filter(s=>s.status==='pending'||!s.status);
  return `
    <div class="stats">
      <div class="stat" style="--i:0"><div class="stat-top"><div class="stat-icon blue"><svg class="ui-icon"><use href="#i-trophy"/></svg></div><div class="stat-lbl">Всего заявок</div></div><div class="stat-val">${submissions.length}</div></div>
      <div class="stat" style="--i:1"><div class="stat-top"><div class="stat-icon green"><svg class="ui-icon"><use href="#i-check"/></svg></div><div class="stat-lbl">Одобрено</div></div><div class="stat-val">${approved.length}</div></div>
      <div class="stat" style="--i:2"><div class="stat-top"><div class="stat-icon orange"><svg class="ui-icon"><use href="#i-clock"/></svg></div><div class="stat-lbl">Ожидает</div></div><div class="stat-val">${pending.length}</div></div>
    </div>

    <div class="stitle"><svg class="ui-icon"><use href="#i-trophy"/></svg>Победители<span class="line"></span></div>
    <div class="row-list">
      ${approved.sort((a,b)=>(+a.place||99)-(+b.place||99)).map((s,i)=>{
        const place=s.place||'—';
        const bg=place===1||place==='1'?'linear-gradient(135deg,#FBBF24,#F59E0B)':place===2||place==='2'?'linear-gradient(135deg,#CBD5E1,#94A3B8)':place===3||place==='3'?'linear-gradient(135deg,#FB923C,#EA580C)':'linear-gradient(135deg,#3B82F6,#2563EB)';
        return `<div class="row-item" style="--i:${i}">
          <div class="row-icon" style="background:${bg};color:#fff;font-weight:700">${esc(place)}</div>
          <div class="row-info">
            <div class="row-title">${esc(s.name||s.email||'—')}</div>
            <div class="row-sub">
              <span><svg class="ui-icon"><use href="#i-email"/></svg>${esc(s.email||'')}</span>
              <span><svg class="ui-icon"><use href="#i-check"/></svg>Место ${esc(place)}</span>
            </div>
          </div>
          <span class="badge badge-teacher">Победитель</span>
        </div>`;
      }).join('')||'<div class="empty"><svg class="ui-icon"><use href="#i-trophy"/></svg><h3>Победителей нет</h3></div>'}
    </div>

    <div class="stitle"><svg class="ui-icon"><use href="#i-clock"/></svg>Ожидают проверки<span class="line"></span></div>
    <div class="row-list">
      ${pending.map((s,i)=>`
        <div class="row-item" style="--i:${i}">
          <div class="row-icon" style="background:var(--warn-light);color:var(--warn)"><svg class="ui-icon"><use href="#i-clock"/></svg></div>
          <div class="row-info">
            <div class="row-title">${esc(s.name||s.email||'—')}</div>
            <div class="row-sub"><span><svg class="ui-icon"><use href="#i-email"/></svg>${esc(s.email||'')}</span></div>
          </div>
          <span class="badge badge-moderator">Ожидает</span>
        </div>
      `).join('')||'<div class="empty"><svg class="ui-icon"><use href="#i-check"/></svg><h3>Все проверены</h3></div>'}
    </div>
  `;
}

/* ============= BIND EVENTS ============= */
function bindPageEvents(p){
  if(p==='users'){
    $('uSearch')?.addEventListener('input',renderUsersTable);
    document.querySelectorAll('#uSeg button').forEach(b=>{
      b.onclick=()=>{document.querySelectorAll('#uSeg button').forEach(x=>x.classList.toggle('active',x===b));renderUsersTable()};
    });
    $('addUserBtn')?.addEventListener('click',()=>openUserModal(null));
    renderUsersTable();
  }
  if(p==='schedule'){
    $('schedDate')?.addEventListener('change',async(e)=>{
      await loadScheduleForDate(e.target.value);
      renderPage('schedule');
    });
  }
  if(p==='settings'){
    document.querySelectorAll('[data-theme-set]').forEach(b=>{
      b.onclick=()=>{
        const t=b.dataset.themeSet;
        document.documentElement.setAttribute('data-theme',t);
        try{localStorage.setItem('nc_theme',t)}catch(e){}
        renderPage('settings');
      };
    });
    $('clearCacheBtn')?.addEventListener('click',()=>{
      try{['nc_lessons_cache_v1','nc_hw_cache_v1','nc_users_cache_v1'].forEach(k=>localStorage.removeItem(k))}catch(e){}
      toast('Кэш очищен','ok');
    });
    $('logoutBtn2')?.addEventListener('click',doLogout);
  }
}

/* ============= USER MODAL ============= */
function openUserModal(email){
  EDIT_EMAIL=email;
  if(email){
    const u=USERS.find(x=>x.email===email);
    if(!u)return;
    $('umTitle').innerHTML='<svg class="ui-icon"><use href="#i-edit"/></svg>Редактировать';
    $('uName').value=u.name||'';
    $('uEmail').value=u.email||'';
    $('uEmail').disabled=true;
    $('uPass').value='';
    $('passWrap').style.display='none';
    $('uRole').value=u.role||'Ученик';
    const isC=String(email).toLowerCase()==='maksimsuhomlinov37@gmail.com';
    $('uRole').disabled=isC;
  } else {
    $('umTitle').innerHTML='<svg class="ui-icon"><use href="#i-plus"/></svg>Добавить пользователя';
    $('uName').value='';
    $('uEmail').value='';
    $('uEmail').disabled=false;
    $('uPass').value='';
    $('passWrap').style.display='';
    $('uRole').value='Ученик';
    $('uRole').disabled=false;
  }
  $('umErr').style.display='none';
  $('userModal').classList.add('on');
  setTimeout(()=>$('uName').focus(),100);
}
$('umClose').onclick=()=>$('userModal').classList.remove('on');
$('umCancel').onclick=()=>$('userModal').classList.remove('on');
$('userModal').onclick=e=>{if(e.target===$('userModal'))$('userModal').classList.remove('on')};

$('umSave').onclick=async()=>{
  const name=$('uName').value.trim();
  const email=$('uEmail').value.trim().toLowerCase();
  const pass=$('uPass').value;
  const role=$('uRole').value;
  if(!name){$('umErr').textContent='Введите имя';$('umErr').style.display='block';return}
  if(!email){$('umErr').textContent='Введите email';$('umErr').style.display='block';return}
  $('umSave').disabled=true;
  try{
    if(!EDIT_EMAIL){
      if(pass.length<6){$('umErr').textContent='Пароль минимум 6 символов';$('umErr').style.display='block';$('umSave').disabled=false;return}
      const r=await api({action:'register',email,pass,name});
      if(!r||r.status!=='ok')throw new Error((r&&r.message)||'Ошибка');
      if(role!=='Ученик'){try{await api({action:'set_role',requester:ME.email,email,role})}catch(e){}}
      toast('Добавлено','ok');
    } else {
      const u=USERS.find(x=>x.email===EDIT_EMAIL);
      if(name!==(u?u.name:'')){await api({action:'update_profile',requester:ME.email,oldEmail:EDIT_EMAIL,email:EDIT_EMAIL,name})}
      if(role!==(u?u.role:'')){await api({action:'set_role',requester:ME.email,email:EDIT_EMAIL,role})}
      toast('Сохранено','ok');
    }
    $('userModal').classList.remove('on');
    await loadUsers();renderPage('users');
  }catch(e){$('umErr').textContent=e.message;$('umErr').style.display='block'}
  finally{$('umSave').disabled=false}
};

async function delUser(email){
  if(!confirm('Удалить '+email+'?'))return;
  try{
    const r=await api({action:'delete_user',requester:ME.email,email});
    if(!r||r.status!=='ok')throw new Error((r&&r.message)||'Ошибка');
    toast('Удалено','ok');await loadUsers();renderPage('users');
  }catch(e){toast(e.message,'err')}
}

/* ============= LOGOUT ============= */
async function doLogout(){
  if(!confirm('Выйти из админ-панели?'))return;
  try{await api({action:'offline',requester:ME.email})}catch(e){}
  clearSession();
  if(refreshTimer)clearInterval(refreshTimer);
  if(pingTimer)clearInterval(pingTimer);
  location.reload();
}
$('logoutBtn').onclick=doLogout;

/* ============= REFRESH ============= */
$('refreshBtn').onclick=async()=>{
  await pingServer();await loadUsers();await loadOnline();
  renderPage(currentPage);
  toast('Обновлено','ok');
};

/* ============= AUTH ============= */
$('authBtn').onclick=async()=>{
  const e=$('authEmail').value.trim().toLowerCase(),p=$('authPass').value;
  if(!e||!p){$('authErr').textContent='Заполните поля';$('authErr').style.display='block';return}
  $('authBtn').disabled=true;
  try{
    const r=await api({action:'login',email:e,pass:p});
    if(!r||r.status!=='ok')throw new Error((r&&r.message)||'Ошибка входа');
    const u=r.user||{};
    if(['администратор','создатель','директор'].indexOf(String(u.role||'').toLowerCase())===-1)throw new Error('Нет доступа');
    ME=u;saveSession(u);start();
  }catch(err){$('authErr').textContent=err.message;$('authErr').style.display='block'}
  finally{$('authBtn').disabled=false}
};
$('authPass').addEventListener('keydown',e=>{if(e.key==='Enter')$('authBtn').click()});

/* ============= START ============= */
async function start(){
  $('authScreen').style.display='none';
  $('app').style.display='flex';
  const nm=ME.name||ME.email||'Админ';
  $('sbAva').textContent=nm[0].toUpperCase();
  $('sbName').textContent=nm;
  $('sbRole').textContent=ROLE_LBL[ME.role]||ME.role||'Администратор';

  await pingServer();
  await loadUsers();
  await loadOnline();
  updateChips();
  navigate('dashboard');

  if(refreshTimer)clearInterval(refreshTimer);
  refreshTimer=setInterval(async()=>{
    await pingServer();await loadOnline();updateChips();
    if(currentPage==='dashboard'){renderPage('dashboard')}
  },15000);
}

function updateChips(){
  let online=0;Object.values(ONLINE).forEach(r=>{if(r.status==='online')online++});
  $('chipOnlineCount').textContent=online;
  $('chipTotalCount').textContent=USERS.length;
  $('badgeUsers').textContent=USERS.length;
}

/* ============= INIT ============= */
(async function(){
  const s=getSession();
  if(s&&s.email){
    try{
      const r=await api({action:'users_list',requester:s.email});
      if(r&&r.status==='ok'){ME=s;start();return}
    }catch(e){}
    clearSession();
  }
})();
</script>
